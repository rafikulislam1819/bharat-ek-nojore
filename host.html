<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>লাইভ কুইজ — হোস্ট প্যানেল</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hind Siliguri', sans-serif; background: #0E1820; color: #E5ECF1; margin: 0; padding: 20px 16px 60px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 18px; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  h3 { font-size: 1rem; margin: 18px 0 8px; }
  section { background: #15222D; border: 1px solid #2A3B49; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: #9DB0BE; margin: 10px 0 4px; }
  input { width: 100%; font: inherit; padding: 9px 10px; background: #0E1820; color: #E5ECF1; border: 1px solid #2A3B49; border-radius: 6px; }
  button { font: inherit; padding: 10px 16px; border-radius: 7px; border: 0; cursor: pointer; margin: 10px 6px 0 0; }
  .btn-main { background: #FF9D62; color: #1A0E05; font-weight: 700; }
  .btn-danger { background: #c0392b; color: #fff; }
  .btn-plain { background: #2A3B49; color: #E5ECF1; }
  .hint { font-size: 12.5px; color: #9DB0BE; margin-top: 8px; }
  #gate { display: flex; gap: 8px; }
  #gate input { flex: 1; }
  ul#playerList, ol#endBoard { padding-left: 0; list-style: none; margin: 8px 0; }
  ul#playerList li, ol#endBoard li { padding: 6px 0; border-bottom: 1px solid #2A3B49; display: flex; justify-content: space-between; font-size: 14px; }
  ul#qOpts { list-style: none; padding: 0; margin: 10px 0; }
  ul#qOpts li { padding: 8px 10px; border: 1px solid #2A3B49; border-radius: 6px; margin-bottom: 6px; font-size: 14.5px; }
  ul#qOpts li.right { border-color: #2e9e53; background: rgba(46,158,83,.14); font-weight: 600; }
  ul#qOpts li.wrong { border-color: #c0392b; background: rgba(192,57,43,.14); }
  #qStatus { font-size: 13.5px; color: #9DB0BE; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #1C3A26; color: #7FDA9B; margin-bottom: 8px; }
  .pill.live { background: #4A3215; color: #F0B868; }
</style>
</head>
<body>
<div class="wrap">
  <h1>লাইভ কুইজ — হোস্ট প্যানেল</h1>

  <section id="gateSec">
    <label for="pw">হোস্ট পাসওয়ার্ড</label>
    <div id="gate">
      <input type="password" id="pw" placeholder="পাসওয়ার্ড">
      <button type="button" class="btn-main" id="pwGo">ঢুকুন</button>
    </div>
  </section>

  <div id="panel" hidden>
    <section id="createSec">
      <h2>নতুন ইভেন্ট তৈরি করুন</h2>
      <label for="evTitle">টাইটেল</label>
      <input id="evTitle" value="ভারত কুইজ — লাইভ">
      <label for="evWhen">কখন শুরু হবে (শুধু দেখানোর জন্য, আপনি যেকোনো সময় শুরু করতে পারবেন)</label>
      <input id="evWhen" type="datetime-local">
      <label for="evCount">কয়টা প্রশ্ন হবে (৩–৫০)</label>
      <input id="evCount" type="number" min="3" max="50" value="15">
      <button type="button" class="btn-main" id="evCreate">ইভেন্ট তৈরি করো</button>
      <p class="hint">নতুন ইভেন্ট তৈরি করলে আগের সব প্লেয়ার ও স্কোর মুছে যাবে।</p>
    </section>

    <section id="liveSec" hidden>
      <span class="pill" id="statusPill"></span>
      <h2 id="liveTitle"></h2>
      <p id="liveWhen" class="hint"></p>
      <p>জয়েন করেছে: <b id="liveCount">0</b> জন</p>
      <ul id="playerList"></ul>
      <button type="button" class="btn-main" id="btnStart">এখনই শুরু করো</button>

      <div id="qPanel" hidden>
        <p id="qProg"></p>
        <p id="qText" style="font-weight:600"></p>
        <ul id="qOpts"></ul>
        <p id="qStatus"></p>
        <button type="button" class="btn-plain" id="btnNext">পরের প্রশ্নে যাও (ম্যানুয়াল)</button>
        <button type="button" class="btn-danger" id="btnEnd">ইভেন্ট শেষ করো</button>
      </div>

      <div id="endPanel" hidden>
        <h3>ফলাফল</h3>
        <ol id="endBoard"></ol>
        <p class="hint" id="totalJoined"></p>
        <button type="button" class="btn-main" id="btnReset">নতুন ইভেন্টের জন্য রিসেট করো</button>
      </div>
    </section>
  </div>
</div>

let root = {};
let es = null;
let lastQKeySeen = '';
let lockHandled = false;
let skipTimer = null, advanceTimer = null, autoStarting = false;
const QUESTION_SECONDS = 15;
const REVEAL_PAUSE_MS = 3500;

function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function node(path) {
  const parts = path.split('/').filter(Boolean);
  let n = root;
  for (const k of parts) { if (typeof n[k] !== 'object' || n[k] === null) n[k] = {}; n = n[k]; }
  return n;
}
function put(path, data) {
  if (path === '/') { root = data || {}; return; }
  const parts = path.split('/').filter(Boolean);
  const last = parts.pop();
  let n = root;
  for (const k of parts) { if (typeof n[k] !== 'object' || n[k] === null) n[k] = {}; n = n[k]; }
  if (data === null || data === undefined) delete n[last]; else n[last] = data;
}
function patch(path, data) {
  const n = node(path);
  Object.keys(data || {}).forEach(k => { if (data[k] === null) delete n[k]; else n[k] = data[k]; });
}

function connect() {
  try {
    if (es) es.close();
    es = new EventSource(LQ_DB + '/liveQuiz.json');
    es.addEventListener('put', e => { try { const { path, data } = JSON.parse(e.data); put(path, data); render(); } catch (_) {} });
    es.addEventListener('patch', e => { try { const { path, data } = JSON.parse(e.data); patch(path, data); render(); } catch (_) {} });
  } catch (_) {}
}

function fmtWhen(ts) {
  if (!ts) return '';
  try { return new Intl.DateTimeFormat('bn', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).format(new Date(ts)); }
  catch (_) { return new Date(ts).toLocaleString(); }
}

function clearTimers() {
  if (skipTimer) { clearTimeout(skipTimer); skipTimer = null; }
  if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
}

function putJson(path, body) {
  return fetch(LQ_DB + path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}

function createEvent() {
  const title = ($('#evTitle').value || '').trim() || 'লাইভ কুইজ';
  const whenVal = $('#evWhen').value;
  const scheduledAt = whenVal ? new Date(whenVal).getTime() : Date.now();
  const total = Math.max(3, Math.min(50, parseInt($('#evCount').value, 10) || 15));
  clearTimers();
  lastQKeySeen = ''; lockHandled = false;
  fetch(LQ_DB + '/liveQuiz/players.json', { method: 'DELETE' })
    .then(() => putJson('/liveQuiz/state.json', { qIndex: 0, total, lockedBy: null, lockedAnswer: null, qStartAt: Date.now() }))
    .then(() => putJson('/liveQuiz/event.json', { title, status: 'scheduled', scheduledAt }))
    .catch(() => {});
}

function startNow() {
  const ev = root.event || {};
  clearTimers();
  lastQKeySeen = ''; lockHandled = false;
  putJson('/liveQuiz/state.json', { qIndex: 0, total: (root.state && root.state.total) || 15, lockedBy: null, lockedAnswer: null, qStartAt: Date.now() })
    .then(() => putJson('/liveQuiz/event.json', { title: ev.title, scheduledAt: ev.scheduledAt, status: 'live' }))
    .catch(() => {});
}

function maybeAutoStart() {
  const ev = root.event;
  if (!ev || ev.status !== 'scheduled' || !ev.scheduledAt) return;
  if (Date.now() < ev.scheduledAt) return;
  if (autoStarting) return;
  autoStarting = true;
  clearTimers();
  lastQKeySeen = ''; lockHandled = false;
  putJson('/liveQuiz/state.json', { qIndex: 0, total: (root.state && root.state.total) || 15, lockedBy: null, lockedAnswer: null, qStartAt: Date.now() })
    .then(() => putJson('/liveQuiz/event.json', { title: ev.title, scheduledAt: ev.scheduledAt, status: 'live' }))
    .catch(() => {})
    .finally(() => { autoStarting = false; });
}

function advanceQuestion() {
  clearTimers();
  const st = root.state || {};
  const total = st.total || 15;
  const next = (st.qIndex || 0) + 1;
  if (next >= total) {
    endEvent();
    return;
  }
  putJson('/liveQuiz/state.json', { qIndex: next, total, lockedBy: null, lockedAnswer: null, qStartAt: Date.now() }).catch(() => {});
}

function endEvent() {
  clearTimers();
  const ev = root.event || {};
  putJson('/liveQuiz/event.json', { title: ev.title, scheduledAt: ev.scheduledAt, status: 'ended' }).catch(() => {});
}

function resetAll() {
  clearTimers();
  lastQKeySeen = ''; lockHandled = false;
  fetch(LQ_DB + '/liveQuiz.json', { method: 'DELETE' }).catch(() => {});
}

function render() {
  const ev = root.event, st = root.state || {}, players = root.players || {};
  const count = Object.keys(players).length;

  $('#createSec').hidden = !!(ev && ev.status);
  $('#liveSec').hidden = !(ev && ev.status);
  if (!(ev && ev.status)) return;
  maybeAutoStart();

  $('#liveTitle').textContent = ev.title || '';
  $('#liveCount').textContent = String(count);
  const pill = $('#statusPill');
  if (ev.status === 'scheduled') { pill.textContent = 'নির্ধারিত'; pill.className = 'pill'; $('#liveWhen').textContent = 'শুরু হবে: ' + fmtWhen(ev.scheduledAt); }
  else if (ev.status === 'live') { pill.textContent = '🔴 লাইভ চলছে'; pill.className = 'pill live'; $('#liveWhen').textContent = ''; }
  else if (ev.status === 'ended') { pill.textContent = 'শেষ হয়েছে'; pill.className = 'pill'; $('#liveWhen').textContent = ''; }

  const ranked = Object.entries(players).map(([id, p]) => ({ id, ...p })).sort((a, b) => (b.score || 0) - (a.score || 0) || (a.joinedAt || 0) - (b.joinedAt || 0));
  $('#playerList').innerHTML = ranked.map(p => `<li><span>${esc(p.name)}</span><span>স্কোর ${p.score || 0}</span></li>`).join('') || '<li>কেউ এখনো জয়েন করেনি</li>';

  $('#btnStart').hidden = ev.status !== 'scheduled';
  $('#qPanel').hidden = ev.status !== 'live';
  $('#endPanel').hidden = ev.status !== 'ended';

  if (ev.status === 'live') {
    renderQuestionPanel(st, players);
  } else {
    clearTimers();
  }

  if (ev.status === 'ended') {
    const medals = ['🥇', '🥈', '🥉'];
    $('#endBoard').innerHTML = ranked.slice(0, 3).map((p, i) => `<li><span>${medals[i]} ${esc(p.name)}</span><span>স্কোর ${p.score || 0}</span></li>`).join('') || '<li>কেউ জয়েন করেনি</li>';
    $('#totalJoined').textContent = `মোট জয়েন করেছিল: ${count} জন`;
  }
}

function renderQuestionPanel(st, players) {
  const Q = QUIZ_BN;
  const qi = st.qIndex || 0;
  const total = st.total || 15;
  $('#qProg').textContent = `প্রশ্ন ${qi + 1} / ${total}`;

  if (Q && Q[qi]) {
    const [q, opts, ans] = Q[qi];
    $('#qText').textContent = q;
    const locked = st.lockedBy != null;
    $('#qOpts').innerHTML = opts.map((o, i) => {
      let cls = '';
      if (locked && i === ans) cls = 'right';
      else if (locked && st.lockedAnswer === i && i !== ans) cls = 'wrong';
      return `<li class="${cls}">${o}</li>`;
    }).join('');
    if (locked) {
      const who = players[st.lockedBy];
      const correct = st.lockedAnswer === ans;
      $('#qStatus').textContent = (who ? who.name : '?') + (correct ? ' সঠিক উত্তর দিয়েছে ✅ — পরের প্রশ্নে যাচ্ছে...' : ' ভুল উত্তর দিয়েছে ❌ — পরের প্রশ্নে যাচ্ছে...');
    } else {
      $('#qStatus').textContent = 'উত্তরের অপেক্ষায়...';
    }
  } else {
    $('#qText').textContent = '(প্রশ্নের তালিকা এই পেজে নেই — মূল সাইট থেকে কন্ট্রোল করুন, এখানে শুধু অগ্রগতি দেখা যাচ্ছে)';
    $('#qOpts').innerHTML = '';
  }

  // অটো-অ্যাডভান্স টাইমার
  // qi আর qStartAt দুটো মিলিয়ে কী বানানো হচ্ছে, যাতে event তৈরি/লাইভ হওয়ার সময় state.json আর event.json
  // আলাদা আলাদা ভাবে (আগে-পরে) এসে পড়লেও টাইমার সঠিক qStartAt দিয়েই সেট হয় — নাহলে প্রথম প্রশ্নে
  // একটা অসম্পূর্ণ/পুরনো state দিয়ে টাইমার সেট হয়ে পরে আর ঠিক হয় না।
  const qKey = qi + ':' + (st.qStartAt || 0);
  if (qKey !== lastQKeySeen) {
    clearTimers();
    lastQKeySeen = qKey;
    lockHandled = false;
    const startedAt = st.qStartAt || Date.now();
    const remain = Math.max(500, QUESTION_SECONDS * 1000 - (Date.now() - startedAt));
    skipTimer = setTimeout(() => { if (!root.state || !root.state.lockedBy) advanceQuestion(); }, remain);
  }
  if (st.lockedBy && !lockHandled) {
    lockHandled = true;
    if (skipTimer) { clearTimeout(skipTimer); skipTimer = null; }
    advanceTimer = setTimeout(advanceQuestion, REVEAL_PAUSE_MS);
  }
  // ওয়াচডগ: মোবাইল ব্রাউজারে ট্যাব ব্যাকগ্রাউন্ডে চলে গেলে setTimeout থ্রটল/মিস হতে পারে,
  // তখন টাইমার না ফায়ার করলেও এখানে সময় হিসেব করে জোর করে পরের প্রশ্নে পাঠানো হয়।
  if (st.lockedBy) {
    const lockedAt = st.lockedAt || Date.now();
    if (Date.now() - lockedAt > REVEAL_PAUSE_MS + 400) advanceQuestion();
  } else {
    const startedAt = st.qStartAt || Date.now();
    if (Date.now() - startedAt > QUESTION_SECONDS * 1000 + 400) advanceQuestion();
  }
}

$('#pwGo').addEventListener('click', () => {
  if ($('#pw').value === HOST_PASSWORD) {
    try { localStorage.setItem('lq_host_ok', '1'); } catch (_) {}
    $('#gateSec').hidden = true;
    $('#panel').hidden = false;
    init();
  } else {
    $('#pw').value = '';
    $('#pw').placeholder = 'ভুল পাসওয়ার্ড, আবার চেষ্টা করো';
  }
});
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#pwGo').click(); });

$('#evCreate').addEventListener('click', createEvent);
$('#btnStart').addEventListener('click', startNow);
$('#btnNext').addEventListener('click', advanceQuestion);
$('#btnEnd').addEventListener('click', endEvent);
$('#btnReset').addEventListener('click', resetAll);

function init() {
  fetch(LQ_DB + '/liveQuiz.json').then(r => r.json()).then(data => { root = data || {}; render(); connect(); }).catch(() => connect());
  setInterval(maybeAutoStart, 2000);
  setInterval(() => { if (root.event && root.event.status === 'live') render(); }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
}

try {
  if (localStorage.getItem('lq_host_ok') === '1') {
    $('#gateSec').hidden = true;
    $('#panel').hidden = false;
    init();
  }
} catch (_) {}
</script>
</body>
</html>
