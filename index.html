<style>
[hidden] { display: none !important; }
/* Layout: survey-sheet feel. Left: picture map of India with clickable regions (sticky on desktop). Right: tabbed fact panel. Phone: map first, panel below. */
:root {
  --bg: #E9EEF2;
  --surface: #F6F9FB;
  --fg: #11202C;
  --muted: #4B5E6D;
  --line: #C6D2DB;
  --accent: #B3400A;
  --accent-ink: #FFFFFF;
  --maphl: #C2410C;
  --sea: #CFE3F2;
  --zn: #BCD3E8;
  --zw: #E6D2A8;
  --zc: #C4DEBE;
  --ze: #D9C3DF;
  --zne: #A8DCD4;
  --zs: #F0C4B8;
  --font-display: 'Noto Serif Bengali', 'Kohinoor Bangla', 'Nirmala UI', serif;
  --font-body: 'Hind Siliguri', 'Kohinoor Bangla', 'Nirmala UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1820; --surface: #15222D; --fg: #E5ECF1; --muted: #9DB0BE; --line: #2A3B49; --accent: #FF9D62; --accent-ink: #1A0E05;
    --zn: #26455E; --zw: #55472A; --zc: #2C4B2F; --ze: #473554; --zne: #1E504B; --zs: #5A3329;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1820; --surface: #15222D; --fg: #E5ECF1; --muted: #9DB0BE; --line: #2A3B49; --accent: #FF9D62; --accent-ink: #1A0E05;
  --zn: #26455E; --zw: #55472A; --zc: #2C4B2F; --ze: #473554; --zne: #1E504B; --zs: #5A3329;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1320px; margin-inline: auto; }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; padding-bottom: 16px; border-bottom: 2px solid var(--fg); margin-bottom: 20px; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 6vw, 2.9rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--muted); max-width: 46ch; }
.asof { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; white-space: nowrap; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 32px; align-items: start; }
  .mapcol { position: sticky; top: 16px; }
}

.pickrow { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.pickrow label { font-size: 13px; color: var(--muted); white-space: nowrap; }
select { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }

.pickrow { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.pickrow label { font-size: 13px; color: var(--muted); white-space: nowrap; }
select { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }

.zoombar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.zoombar button { min-width: 38px; height: 34px; padding: 0 12px; background: var(--surface); border: 1px solid var(--fg); border-radius: 6px; cursor: pointer; font-size: 17px; line-height: 1; }
.zoombar #zreset { font-size: 14px; }
.zoombar button:hover:not(:disabled) { background: var(--fg); color: var(--bg); }
.zoombar button:disabled { opacity: .35; cursor: default; }
.zhint { font-size: 12.5px; color: var(--muted); }

.mapwrap { position: relative; }
.mapvp { background: #F1F4F7; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mapvp.zoomed { overflow: auto; max-height: min(78vh, 780px); overscroll-behavior: contain; }
.stage { width: 100%; }
#map { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 13px; padding: 2px 9px; border-radius: 4px; white-space: nowrap; }

.reg { fill: var(--maphl); fill-opacity: 0; stroke: none; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
.reg:hover { fill-opacity: .3; }
.reg:focus-visible { stroke: #000; stroke-width: 3px; vector-effect: non-scaling-stroke; }
.hot { fill-opacity: .18; stroke: var(--maphl); stroke-width: 2px; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.hot:hover { fill-opacity: .42; }
.hlc { fill: var(--maphl); fill-opacity: .42; stroke: var(--maphl); stroke-width: 2.5px; vector-effect: non-scaling-stroke; pointer-events: none; stroke-dasharray: none; }

.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
#chips { display: contents; }
.chip { font-size: 13px; background: var(--surface); border: 1px dashed var(--fg); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
.chip:hover { background: var(--fg); color: var(--bg); }
.maphint { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; max-width: 60ch; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px max(16px, 3vw) 24px; min-width: 0; scroll-margin-top: 12px; }
.phead { display: flex; flex-wrap: wrap; align-items: start; justify-content: space-between; gap: 8px 16px; }
.phead h2 { font-family: var(--font-display); font-size: clamp(1.6rem, 5vw, 2.25rem); line-height: 1.2; margin: 0; text-wrap: balance; }
.phead p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.pbtns { display: flex; gap: 8px; flex-wrap: wrap; }
#tomap { display: none; }
@media (max-width: 899px) { #tomap { display: inline-block; } }
#tomap, #back { font-size: 14px; background: transparent; border: 1px solid var(--fg); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
#tomap:hover, #back:hover { background: var(--fg); color: var(--bg); }

.pbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 22px; margin-top: 16px; }
#tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; align-content: start; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
#tabs button { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; cursor: pointer; text-align: left; color: var(--fg); font-weight: 500; line-height: 1.35; }
#tabs button[aria-selected="true"] { color: var(--accent-ink); font-weight: 700; border-color: var(--accent); background: var(--accent); }
#tabs button:hover { border-color: var(--accent); }
#tabs button:not([aria-selected="true"]):hover { filter: brightness(0.96); }
#body { min-width: 0; }
@media (min-width: 640px) {
  .pbody { grid-template-columns: 168px minmax(0, 1fr); }
  #tabs { grid-template-columns: minmax(0, 1fr); border-bottom: 0; padding-bottom: 0; border-right: 1px solid var(--line); padding-right: 6px; position: sticky; top: 12px; align-self: start; }
}

.facts { margin: 0; }

function applyChoro() {

  const bin = {}, ranges = [[], [], [], [], []];

  g.innerHTML = h;

function setZoom(z, fx = 0.5, fy = 0.5) {
  z = Math.max(1, Math.min(5, z));
  if (z === zoom) return;
  const px = (vp.scrollLeft + vp.clientWidth * fx) / stage.clientWidth;
  const py = (vp.scrollTop + vp.clientHeight * fy) / stage.clientHeight;
  zoom = z;
  stage.style.width = z * 100 + '%';
  vp.classList.toggle('zoomed', z > 1);
  vp.scrollLeft = px * stage.clientWidth - vp.clientWidth * fx;
  vp.scrollTop = py * stage.clientHeight - vp.clientHeight * fy;
  $('#zin').disabled = z >= 5;
  $('#zout').disabled = z <= 1;
}
function focusOn(id) {
  if (id === 'india') { setZoom(1); return; }
  const b = BB[id];
  if (!b) return;
  if ((b[2] - b[0]) * (b[3] - b[1]) < 30000 && zoom < 3) setZoom(3);
  requestAnimationFrame(() => {
    if (zoom <= 1) return;
    const cx = ((b[0] + b[2]) / 2 / 1280) * stage.clientWidth, cy = ((b[1] + b[3]) / 2 / 1495) * stage.clientHeight;
    vp.scrollTo({ left: cx - vp.clientWidth / 2, top: cy - vp.clientHeight / 2, behavior: reduceMotion ? 'auto' : 'smooth' });
  });
}
function highlight() {

    g.appendChild(c);
  });

let quizI = 0, quizScore = 0, quizPicked = -1;
function natQuiz() {
  const Q = QUIZ();
  if (quizI >= Q.length) {
    return `<p class="quiz-score">${L(`আপনার স্কোর: ${nf.format(quizScore)} / ${nf.format(Q.length)}`, `आपका स्कोर: ${nf.format(quizScore)} / ${nf.format(Q.length)}`, `Your score: ${quizScore} / ${Q.length}`)}</p>` +
      `<button type="button" class="quiz-restart" data-quiz-restart>${L('আবার শুরু করুন', 'फिर से शुरू करें', 'Restart')}</button>`;
  }
  const [q, opts, ans] = Q[quizI];
  const answered = quizPicked >= 0;
  const optHtml = opts.map((o, i) => {
    let cls = 'quiz-opt';
    if (answered && i === ans) cls += ' right';
    else if (answered && i === quizPicked) cls += ' wrong';
    return `<button type="button" class="${cls}" data-quiz-opt="${i}" ${answered ? 'disabled' : ''}>${o}</button>`;
  }).join('');
  return `<div class="quiz-card"><p class="quiz-prog">${L(`প্রশ্ন ${nf.format(quizI + 1)} / ${nf.format(Q.length)} · স্কোর ${nf.format(quizScore)}`, `प्रश्न ${nf.format(quizI + 1)} / ${nf.format(Q.length)} · स्कोर ${nf.format(quizScore)}`, `Question ${quizI + 1} / ${Q.length} · Score ${quizScore}`)}</p>` +
    `<p class="quiz-q">${q}</p><div class="quiz-opts">${optHtml}</div>` +
    (answered ? `<button type="button" class="quiz-next" data-quiz-next>${quizI + 1 < Q.length ? L('পরের প্রশ্ন', 'अगला प्रश्न', 'Next question') : L('ফলাফল দেখুন', 'नतीजा देखें', 'See result')}</button>` : '') + `</div>`;
}

}

    fact(L('তুলনামূলক নিরাপদ শহর (NARI)', 'तुलनात्मक रूप से सुरक्षित शहर (NARI)', 'Relatively safer cities (NARI)'), L('কোহিমা, বিশাখাপত্তনম, ভুবনেশ্বর, আইজল, গ্যাংটক, ইটানগর, মুম্বই', 'कोहिमा, विशाखापत्तनम, भुवनेश्वर, आइज़ोल, गंगटोक, ईटानगर, मुंबई', 'Kohima, Visakhapatnam, Bhubaneswar, Aizawl, Gangtok, Itanagar, Mumbai')),
    fact(L('তুলনামূলক কম নিরাপদ শহর (NARI)', 'तुलनात्मक रूप से कम सुरक्षित शहर (NARI)', 'Relatively less safe cities (NARI)'), L('পাটনা, জয়পুর, ফরিদাবাদ, দিল্লি, কলকাতা, শ্রীনগর, রাঁচি', 'पटना, जयपुर, फ़रीदाबाद, दिल्ली, कोलकाता, श्रीनगर, रांची', 'Patna, Jaipur, Faridabad, Delhi, Kolkata, Srinagar, Ranchi'))
  ];

    `<p class="hint">${L('মাত্র সাতটি রাজ্যের ২০২৩ সালের হার আমি নির্ভরযোগ্য সূত্রে পেয়েছি, বাকিগুলোর জন্য রাজ্য বেছে ২০১৮ সালের পূর্ণ সারণি দেখুন। বেশি হার মানেই বেশি অপরাধ নয়: যেখানে অভিযোগ নথিভুক্ত করা সহজ, সেখানে হার বেশি দেখাতে পারে।', 'केवल सात राज्यों की 2023 की दर मुझे भरोसेमंद स्रोत से मिली; बाक़ी के लिए राज्य चुनकर 2018 की पूरी सारणी देखें। ज़्यादा दर का मतलब ज़्यादा अपराध ही नहीं है: जहाँ शिकायत दर्ज कराना आसान है, वहाँ दर ज़्यादा दिख सकती है।', 'I found 2023 rates for only seven states from reliable sources; for the rest, pick a state to see the full 2018 table. A higher rate does not simply mean more crime: where complaints are easier to register, the rate can look higher.')}</p>`;

function stSaf(x) {
  const rows = [];
  const a = CAW18[x.id], b = CAW23[x.id];
  if (b != null) rows.push(fact(L('২০২৩ (প্রতি লক্ষ নারীতে)', '2023 (प्रति लाख महिलाओं पर)', '2023 (per lakh women)'), pfx(b), L(`২০২৩ সালের জাতীয় হার ${pfx(CAW23_NAT)} (২০২৪ সালে জাতীয় হার কমে ${pfx(CAW24_NAT)} হয়েছে, তবে রাজ্যভিত্তিক ২০২৪ হার এখনো যাচাই করা যায়নি)। NCRB, Crime in India ২০২৩/২০২৪`, `2023 की राष्ट्रीय दर ${pfx(CAW23_NAT)} थी (2024 में राष्ट्रीय दर घटकर ${pfx(CAW24_NAT)} हो गई, पर राज्यवार 2024 दर अभी सत्यापित नहीं की जा सकी)। NCRB, Crime in India 2023/2024`, `The 2023 national rate was ${pfx(CAW23_NAT)} (the national rate fell to ${pfx(CAW24_NAT)} in 2024, but state-wise 2024 rates could not yet be verified). NCRB, Crime in India 2023/2024`)));
  if (a != null) {
    const pl = Object.entries(CAW18).sort((p, q) => q[1] - p[1]);
    const r = rankOf(pl, x.id);
    rows.push(fact(L('২০১৮ (প্রতি লক্ষ জনসংখ্যায়)', '2018 (प्रति लाख जनसंख्या पर)', '2018 (per lakh population)'), pfx(a), L(`${nf.format(pl.length)}টির মধ্যে ${ord(r)} সর্বোচ্চ (১ম = সর্বোচ্চ হার)। NCRB ২০১৮, উইকিপিডিয়ার সারণি`, `${nf.format(pl.length)} में ${ord(r)} सर्वोच्च (पहला = सबसे ऊँची दर)। NCRB 2018, विकिपीडिया की सारणी`, `${ord(r)} highest of ${nf.format(pl.length)} (1st = highest rate). NCRB 2018, Wikipedia table`)));
  }
  if (!rows.length) return `<p class="hint">${L(`${R(x).n}-এর নারীর বিরুদ্ধে অপরাধের আলাদা হার আমি পাইনি।`, `${R(x).n} के लिए महिलाओं के विरुद्ध अपराध की अलग दर मुझे नहीं मिली।`, `I did not find a separate crime-against-women rate for ${R(x).n}.`)}${x.id === 'la' ? L(' ২০১৮ সালে লাদাখ আলাদা অঞ্চল ছিল না।', ' 2018 में लद्दाख अलग क्षेत्र नहीं था।', ' Ladakh was not a separate territory in 2018.') : ''}${x.id === 'dd' ? L(' ২০১৮ সালে দাদরা-নগর হাভেলি ১৭.৩ ও দমন-দিউ ১২.৩ ছিল, তখন দুটি আলাদা অঞ্চল।', ' 2018 में दादरा-नगर हवेली 17.3 और दमन-दीव 12.3 थे, तब दो अलग क्षेत्र।', ' In 2018 Dadra & Nagar Haveli (17.3) and Daman & Diu (12.3) were two separate territories.') : ''}</p>`;
  const max = Math.max(...Object.values(CAW18));
  return facts(rows) + (a != null ? `<div class="cbl"><div class="cbl-h"><span>${L('২০১৮ হার, সর্বোচ্চের (অসম) তুলনায়', '2018 की दर, सर्वोच्च (असम) की तुलना में', '2018 rate, relative to the highest (Assam)')}</span><b>${nf.format(Math.round(a / max * 100))}%</b></div>${bar(a / max * 100, 'rate')}</div>` : '') +
    (x.id === 'jk' ? `<p class="hint">${L('২০১৮ সালের সংখ্যা লাদাখ-সহ অবিভক্ত জম্মু ও কাশ্মীরের।', '2018 के आँकड़े लद्दाख सहित अविभाजित जम्मू और कश्मीर के हैं।', 'The 2018 figure is for undivided Jammu & Kashmir, including Ladakh.')}</p>` : '') +
    `<p class="hint">${L('এই হার শুধু নথিভুক্ত অভিযোগ গণনা করে। বেশি হার মানেই বেশি অপরাধ নয়, অভিযোগ করার সুযোগ ও থানার নথিভুক্তির ধরনও এতে প্রভাব ফেলে। ২০১৮ ও ২০২৩-এর সংখ্যা সরাসরি তুলনীয় নয়, কারণ হিসাবের ভিত্তি (জনসংখ্যা বনাম নারী) ও আইন (IPC বনাম BNS) আলাদা।', 'यह दर केवल दर्ज शिकायतों को गिनती है। ज़्यादा दर का मतलब ज़्यादा अपराध ही नहीं है; शिकायत करने की सुविधा और थानों के दर्ज करने के तरीक़े का भी असर पड़ता है। 2018 और 2023 के आँकड़े सीधे तुलनीय नहीं हैं, क्योंकि गणना का आधार (जनसंख्या बनाम महिलाएँ) और क़ानून (IPC बनाम BNS) अलग हैं।', 'This rate counts only registered complaints. A higher rate does not simply mean more crime; how easy it is to complain and how police record cases also matter. The 2018 and 2023 figures are not directly comparable, because the base (population vs women) and the law (IPC vs BNS) differ.')}</p>`;
}

function stVs(x) {
  const opts = T.filter((y) => y.id !== x.id).sort((a, b) => R(a).n.localeCompare(R(b).n, LOC[lang])).map((y) => `<option value="${y.id}"${y.id === vsWith ? ' selected' : ''}>${R(y).n}</option>`).join('');
  let h = `<div class="vsbox"><label for="vs-sel" class="hint" style="margin:0 8px 0 0">${L('অন্য রাজ্যের সঙ্গে তুলনা:', 'किसी और राज्य से तुलना:', 'Compare with another state:')}</label><select id="vs-sel" data-vs style="max-width:240px"><option value="">—</option>${opts}</select>`;
  if (vsWith && vsWith !== x.id && byId[vsWith]) {
    const y = byId[vsWith], dash = '—';
    const rows = [
      [L('জনসংখ্যা (২০১১)', 'जनसंख्या (2011)', 'Population (2011)'), (z) => big(z.pop)],
      [L('আয়তন', 'क्षेत्रफल', 'Area'), (z) => nf.format(z.area) + ' ' + KM()],
      [L('জনঘনত্ব', 'जनघनत्व', 'Density'), (z) => nf.format(Math.round(z.d)) + '/' + L('বর্গ কিমি', 'वर्ग किमी', 'sq km')],
      [L('লোকসভা আসন', 'लोकसभा सीटें', 'Lok Sabha seats'), (z) => nf.format(z.ls)],
      [L('মাথাপিছু GSDP', 'प्रति व्यक्ति GSDP', 'GSDP per capita'), (z) => (ECO[z.id] ? '₹' + nf.format(ECO[z.id].p24) : dash)],
      [L('সাক্ষরতা (২০২৪)', 'साक्षरता (2024)', 'Literacy (2024)'), (z) => (LIT[z.id] ? nf1.format(LIT[z.id][3]) + '%' : dash)],
      [L('নারী সাক্ষরতা (২০২৪)', 'महिला साक्षरता (2024)', 'Female literacy (2024)'), (z) => (LIT[z.id] ? nf1.format(LIT[z.id][5]) + '%' : dash)],
      [L('নারীর বিরুদ্ধে অপরাধ (২০১৮, প্রতি লক্ষ)', 'महिलाओं के विरुद्ध अपराध (2018, प्रति लाख)', 'Crimes against women (2018, per lakh)'), (z) => (CAW18[z.id] != null ? nf1.format(CAW18[z.id]) : dash)],
      [L('রাজধানী', 'राजधानी', 'Capital'), (z) => R(z).cap]
    ];
    h += `<div style="overflow-x:auto"><table class="vs"><thead><tr><th></th><th>${R(x).n}</th><th>${R(y).n}</th></tr></thead><tbody>${rows.map(([l, f]) => `<tr><th>${l}</th><td>${f(x)}</td><td>${f(y)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  return h + '</div>';
}
function stCmp(x) {
  const g = x.t === 'state' ? L('রাজ্যগুলির', 'राज्यों', 'among states') : L('কেন্দ্রশাসিত অঞ্চলগুলির', 'केंद्रशासित प्रदेशों', 'among union territories');
  const n = groupSize(x), popShare = (x.pop / TOTAL_POP) * 100, areaShare = (x.area / TOTAL_AREA) * 100;
  const maxPop = Math.max(...T.map((y) => y.pop / TOTAL_POP * 100)), maxArea = Math.max(...T.map((y) => y.area / TOTAL_AREA * 100));
  const ratio = x.d / NAT_DENSITY_2011;
  const rk = (what, key) => L(`${g} মধ্যে ${what}য় ${ord(rankIn(x, key))}`, `${g} में ${what} में ${ord(rankIn(x, key))}`, `${ord(rankIn(x, key))} ${what} ${g}`);
  return stVs(x) + `<div class="cbl"><div class="cbl-h"><span>${L('দেশের জনসংখ্যার অংশ', 'देश की जनसंख्या का हिस्सा', "Share of India's population")}</span><b>${nf2.format(popShare)}%</b></div>${bar((popShare / maxPop) * 100, 'pop')}<small>${L(`${g} মধ্যে জনসংখ্যায় ${ord(rankIn(x, 'pop'))} (মোট ${nf.format(n)}টি)`, `${g} में जनसंख्या में ${ord(rankIn(x, 'pop'))} (कुल ${nf.format(n)})`, `${ord(rankIn(x, 'pop'))} by population ${g} (of ${nf.format(n)})`)}</small></div>` +
    `<div class="cbl"><div class="cbl-h"><span>${L('দেশের আয়তনের অংশ', 'देश के क्षेत्रफल का हिस्सा', "Share of India's area")}</span><b>${nf2.format(areaShare)}%</b></div>${bar((areaShare / maxArea) * 100, 'area')}<small>${L(`${g} মধ্যে আয়তনে ${ord(rankIn(x, 'area'))}`, `${g} में क्षेत्रफल में ${ord(rankIn(x, 'area'))}`, `${ord(rankIn(x, 'area'))} by area ${g}`)}</small></div>` +
    `<div class="cbl"><div class="cbl-h"><span>${L('জনঘনত্ব', 'जनघनत्व', 'Density')}</span><b>${nf.format(Math.round(x.d))}/${L('বর্গ কিমি', 'वर्ग किमी', 'sq km')}</b></div>${bar(Math.sqrt(x.d / Math.max(...T.map((y) => y.d))) * 100, 'density')}<small>${L(`${g} মধ্যে ঘনত্বে ${ord(rankIn(x, 'd'))}। ২০১১ সালের দেশের গড়ের (${nf.format(Math.round(NAT_DENSITY_2011))}) ${nf1.format(ratio)} গুণ`, `${g} में घनत्व में ${ord(rankIn(x, 'd'))}। 2011 के देश के औसत (${nf.format(Math.round(NAT_DENSITY_2011))}) का ${nf1.format(ratio)} गुना`, `${ord(rankIn(x, 'd'))} by density ${g}. ${nf1.format(ratio)} times the 2011 national average (${nf.format(Math.round(NAT_DENSITY_2011))})`)}</small></div>`;
}

  for (const k of parts) { if (typeof node[k] !== 'object' || node[k] === null) node[k] = {}; node = node[k]; }
  if (data === null || data === undefined) delete node[last]; else node[last] = data;
}
function lqPatch(path, data) {
  const node = lqNode(path);
  Object.keys(data || {}).forEach((k) => { if (data[k] === null) delete node[k]; else node[k] = data[k]; });
}
function lqConnect() {
  try {
    if (lqES) lqES.close();
    lqES = new EventSource(LQ_DB + '/liveQuiz.json');
    lqES.addEventListener('put', (e) => { try { const { path, data } = JSON.parse(e.data); lqPut(path, data); lqRender(); } catch (_) {} });
    lqES.addEventListener('patch', (e) => { try { const { path, data } = JSON.parse(e.data); lqPatch(path, data); lqRender(); } catch (_) {} });
  } catch (_) {}
}
function lqInit() {
  if (typeof EventSource === 'undefined' || !$('#lqBanner')) return;
  lqConnect();
  $('#lqNameGo').addEventListener('click', lqDoJoin);
  $('#lqNameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') lqDoJoin(); });
  setInterval(lqMaybeAutoStart, 2000);
  setInterval(lqTickCountdown, 1000);
  setInterval(lqTickQuestionTimer, 250);
  lqTickCountdown();
}
const LQ_RING_C = 326.7;
const LQ_QUESTION_MS = 15000;
const LQ_REVEAL_MS = 3500;
const LQ_QRING_C = 113.1;
function lqTickQuestionTimer() {
  const st = lqRoot.state;
  const numEl = $('#lqQNum'), sweepEl = $('#lqQSweep'), wrapEl = $('#lqQRingWrap');
  if (!st || !numEl || !sweepEl || !wrapEl) return;
  const locked = st.lockedBy != null;
  let remain, total;
  if (locked) {
    const lockedAt = st.lockedAt || Date.now();
    remain = Math.max(0, LQ_REVEAL_MS - (Date.now() - lockedAt));
    total = LQ_REVEAL_MS;
    wrapEl.classList.add('lq-qring-reveal');
  } else {
    const startedAt = st.qStartAt || Date.now();
    remain = Math.max(0, LQ_QUESTION_MS - (Date.now() - startedAt));
    total = LQ_QUESTION_MS;
    wrapEl.classList.remove('lq-qring-reveal');
  }
  numEl.textContent = String(Math.ceil(remain / 1000));
  sweepEl.style.strokeDashoffset = String(LQ_QRING_C * (1 - remain / total));
}
function lqTickCountdown() {
  const wrap = $('#lqCountdown');
  if (!wrap) return;
  const ev = lqRoot.event;
  if (!ev || ev.status !== 'scheduled' || !ev.scheduledAt) { wrap.hidden = true; return; }
  const remainMs = ev.scheduledAt - Date.now();
  if (remainMs <= 0) { wrap.hidden = true; return; }
  wrap.hidden = false;
  const totalSec = Math.floor(remainMs / 1000);
  const days = Math.floor(totalSec / 86400);
  const hrs = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  const p2 = (n) => String(n).padStart(2, '0');
  const timeEl = $('#lqCdTime');
  if (timeEl) timeEl.textContent = days > 0 ? `${days}${L('দিন ', 'दिन ', 'd ')}${p2(hrs)}:${p2(mins)}:${p2(secs)}` : `${p2(hrs)}:${p2(mins)}:${p2(secs)}`;
  const labelEl = $('#lqCdLabel');
  if (labelEl) labelEl.textContent = L('শুরু হতে বাকি', 'शुरू होने में बाकी', 'until start');
  const sweep = $('#lqCdSweep');
  if (sweep) {
    const frac = secs / 60;
    sweep.style.strokeDashoffset = String(LQ_RING_C * (1 - frac));
  }
}
function lqMaybeAutoStart() {
  const ev = lqRoot.event;
  if (!ev || ev.status !== 'scheduled' || !ev.scheduledAt) return;
  if (Date.now() < ev.scheduledAt) return;
  if (lqAutoStarting) return;
  lqAutoStarting = true;
  const total = (lqRoot.state && lqRoot.state.total) || 15;
  fetch(LQ_DB + '/liveQuiz/state.json', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ qIndex: 0, total, lockedBy: null, lockedAnswer: null, qStartAt: Date.now() })
  }).then(() => fetch(LQ_DB + '/liveQuiz/event.json', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'live' })
  })).catch(() => {}).finally(() => { lqAutoStarting = false; });
}
let lqJoining = false;
function lqDoJoin() {
  if (lqJoining) return;
  const inp = $('#lqNameInput');
  const name = (inp.value || '').trim().slice(0, 24);
  if (!name) { inp.focus(); return; }
  lqJoining = true;
  const goBtn = $('#lqNameGo');
  if (goBtn) { goBtn.disabled = true; }
  if (inp) { inp.disabled = true; }
  lqName = name;
  try { localStorage.setItem('lq_name', name); } catch (_) {}
  fetch(LQ_DB + '/liveQuiz/players.json', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, score: 0, joinedAt: Date.now() })
  }).then((r) => r.json()).then((res) => {
    if (res && res.name) {
      lqPid = res.name;
      try { localStorage.setItem('lq_pid', lqPid); } catch (_) {}
      lqJoined = true;
    }
    lqJoining = false;
    lqRender();
  }).catch(() => {
    lqJoining = false;
    if (goBtn) { goBtn.disabled = false; }
    if (inp) { inp.disabled = false; }
  });
}
function lqFmtWhen(ts) {
  if (!ts) return '';
  try { return new Intl.DateTimeFormat(LOC[lang], { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).format(new Date(ts)); }
  catch (_) { return new Date(ts).toLocaleString(); }
}
function lqRender() {
  const banner = $('#lqBanner');
  if (!banner) return;
  const ev = lqRoot.event, st = lqRoot.state, players = lqRoot.players || {};
  const count = Object.keys(players).length;
  if (!ev || !ev.status) { banner.hidden = true; return; }
  banner.hidden = false;
  lqMaybeAutoStart();
  lqTickCountdown();
  if (lqPid && players[lqPid]) lqJoined = true;
  $('#lqDot').hidden = ev.status !== 'live';
  $('#lqTitle').textContent = ev.title || L('লাইভ কুইজ ইভেন্ট', 'लाइव क्विज़ इवेंट', 'Live quiz event');
  $('#lqCount').textContent = L(`${nf.format(count)} জন যোগ দিয়েছে`, `${nf.format(count)} लोग शामिल हुए`, `${nf.format(count)} joined`);

  if (ev.status === 'scheduled') {
    $('#lqWhen').textContent = ev.scheduledAt ? L('শুরু হবে: ', 'शुरू होगा: ', 'Starts: ') + lqFmtWhen(ev.scheduledAt) : L('শীঘ্রই শুরু হবে', 'जल्द शुरू होगा', 'Starting soon');
  } else if (ev.status === 'live') {
    $('#lqWhen').textContent = L('🔴 এখনই লাইভ চলছে', '🔴 अभी लाइव चल रहा है', '🔴 Live now');
  } else if (ev.status === 'ended') {
    $('#lqWhen').textContent = L('ইভেন্ট শেষ হয়েছে', 'इवेंट समाप्त हो गया', 'Event has ended');
  }

  const joinBtn = $('#lqJoinBtn'), joinbox = $('#lqJoinbox');
  const evKey = (ev.title || '') + '|' + (ev.scheduledAt || '') + '|' + (ev.createdAt || '');
  if (evKey !== lqLastEvKey) { lqLastEvKey = evKey; lqBoxOpen = false; }
  if (lqJoined || ev.status === 'ended') {
    joinBtn.hidden = true;
    joinbox.hidden = true;
    lqBoxOpen = false;
  } else {
    joinBtn.hidden = false;
    joinBtn.textContent = L('যোগ দিন', 'जुड़ें', 'Join');
    joinbox.hidden = !lqBoxOpen;
    joinBtn.onclick = () => {
      lqBoxOpen = true;
      joinbox.hidden = false;
      $('#lqNameInput').value = lqName;
      $('#lqNameInput').placeholder = L('তোমার নাম লেখো', 'अपना नाम लिखें', 'Enter your name');
      $('#lqNameGo').textContent = L('যোগ দাও', 'जुड़ें', 'Go');
      $('#lqNameInput').focus();
    };
  }

  const play = $('#lqPlay');
  if (ev.status === 'ended') {
    play.hidden = false;
    const ranked = Object.entries(players).map(([id, p]) => ({ id, ...p })).sort((a, b) => (b.score || 0) - (a.score || 0) || (a.joinedAt || 0) - (b.joinedAt || 0));
    const medals = ['🥇', '🥈', '🥉'];
    if (!ranked.length) { play.innerHTML = `<p class="hint">${L('কেউ জয়েন করেনি।', 'कोई शामिल नहीं हुआ।', 'No one joined.')}</p>`; }
    else play.innerHTML = `<div class="lq-leader">` + ranked.slice(0, 3).map((p, i) => `<div class="lq-lrow"><span class="lq-medal">${medals[i]}</span><span class="lq-lname">${lqEsc(p.name)}</span><span class="lq-lscore">${L('স্কোর', 'स्कोर', 'Score')} ${nf.format(p.score || 0)}</span></div>`).join('') + `</div>`;
  } else if (ev.status === 'live' && lqJoined && st) {
    play.hidden = false;
    lqRenderQuestion(st, players);
  } else {
    play.hidden = true;
  }
}
function lqRenderQuestion(st, players) {
  const Q = QUIZ();
  const qi = st.qIndex || 0;
  const total = Math.min(st.total || Q.length, Q.length);
  const play = $('#lqPlay');
  if (qi >= total || qi >= Q.length) { play.innerHTML = `<p class="hint">${L('ফলাফলের অপেক্ষা করছি...', 'नतीजों का इंतज़ार...', 'Waiting for results...')}</p>`; return; }
  const [q, opts, ans] = Q[qi];
  const locked = st.lockedBy != null;
  const mine = players[lqPid] || { score: 0 };
  const optHtml = opts.map((o, i) => {
    let cls = 'lq-opt';
    if (locked && i === ans) cls += ' lqright';
    else if (locked && st.lockedAnswer === i && i !== ans) cls += ' lqwrong';
    return `<button type="button" class="${cls}" data-lq-opt="${i}" ${locked ? 'disabled' : ''}>${o}</button>`;
  }).join('');
  let firstLine = '';
  if (locked) {
    const who = players[st.lockedBy];
    const correct = st.lockedAnswer === ans;
    firstLine = `<p class="lq-firstby">${who ? lqEsc(who.name) : '?'} ${correct ? L('সঠিক উত্তর দিয়েছে ✅', 'ने सही उत्तर दिया ✅', 'answered correctly ✅') : L('ভুল উত্তর দিয়েছে ❌', 'ने ग़लत उत्तर दिया ❌', 'answered incorrectly ❌')}</p>`;
  }
  const revealMode = !!locked;
  const ringC = LQ_QRING_C;
  let ringFrac = 0, ringNum = 0;
  if (revealMode) {
    const lockedAt = st.lockedAt || Date.now();
    const remain = Math.max(0, LQ_REVEAL_MS - (Date.now() - lockedAt));
    ringFrac = remain / LQ_REVEAL_MS;
    ringNum = Math.ceil(remain / 1000);
  } else {
    const startedAt = st.qStartAt || Date.now();
    const remain = Math.max(0, LQ_QUESTION_MS - (Date.now() - startedAt));
    ringFrac = remain / LQ_QUESTION_MS;
    ringNum = Math.ceil(remain / 1000);
  }
  const ringHtml = `<div class="lq-qring-wrap${revealMode ? ' lq-qring-reveal' : ''}" id="lqQRingWrap"><svg class="lq-qring" viewBox="0 0 36 36"><circle class="lq-qring-track" cx="18" cy="18" r="18"></circle><circle class="lq-qring-sweep" id="lqQSweep" cx="18" cy="18" r="18" transform="rotate(-90 18 18)" style="stroke-dashoffset:${ringC * (1 - ringFrac)}"></circle></svg><span class="lq-qring-num" id="lqQNum">${ringNum}</span></div>`;
  play.innerHTML = `<div class="lq-qtop"><span class="lq-qtop-left">${ringHtml}${L('প্রশ্ন', 'प्रश्न', 'Question')} ${nf.format(qi + 1)} / ${nf.format(total)}</span><span>${L('তোমার স্কোর', 'तुम्हारा स्कोर', 'Your score')}: ${nf.format(mine.score || 0)}</span></div>` +
    `<p class="lq-q">${q}</p><div class="lq-opts">${optHtml}</div>` + firstLine;
  if (!locked) {
    play.querySelectorAll('[data-lq-opt]').forEach((btn) => btn.addEventListener('click', () => lqAnswer(qi, +btn.dataset.lqOpt, ans)));
  }
}
function lqAnswer(qi, pickIdx, ansIdx) {
  if (!lqPid) return;
  fetch(LQ_DB + '/liveQuiz/state.json', { headers: { 'X-Firebase-ETag': 'true' } }).then((res) => {
    const etag = res.headers.get('ETag');
    return res.json().then((data) => ({ etag, data }));
  }).then(({ etag, data }) => {
    if (!data || data.qIndex !== qi || data.lockedBy) return;
    const body = Object.assign({}, data, { lockedBy: lqPid, lockedAnswer: pickIdx, lockedAt: Date.now() });
    return fetch(LQ_DB + '/liveQuiz/state.json', {
      method: 'PUT', headers: { 'Content-Type': 'application/json', 'if-match': etag }, body: JSON.stringify(body)
    }).then((r) => {
      if (r.status === 412) return;
      if (pickIdx === ansIdx) {
        const cur = (lqRoot.players && lqRoot.players[lqPid] && lqRoot.players[lqPid].score) || 0;
        return fetch(LQ_DB + '/liveQuiz/players/' + lqPid + '.json', {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ score: cur + 10 })
        }).catch(() => {});
      }
    });
  }).catch(() => {});
}

buildMap();
cur = fromHash();
applyStatic();
labelMap();
render();
lqInit();

</script>
