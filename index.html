    [L('জনঘনত্ব', 'जनघनत्व', 'Density'), (z) => z.d, (z) => nf.format(Math.round(z.d)) + '/' + L('বর্গ কিমি', 'वर्ग किमी', 'sq km'), 'ne'],
    [L('সাক্ষরতা (২০২৪)', 'साक्षरता (2024)', 'Literacy (2024)'), (z) => LIT[z.id] ? LIT[z.id][3] : null, (z) => nf1.format(LIT[z.id][3]) + '%', 'hi'],
    [L('নারী সাক্ষরতা (২০২৪)', 'महिला साक्षरता (2024)', 'Female literacy (2024)'), (z) => LIT[z.id] ? LIT[z.id][5] : null, (z) => nf1.format(LIT[z.id][5]) + '%', 'hi'],
    [L('মাথাপিছু GSDP', 'प्रति व्यक्ति GSDP', 'Per-capita GSDP'), (z) => ECO[z.id] ? ECO[z.id].p24 : null, (z) => '₹' + nf.format(ECO[z.id].p24), 'hi'],
    ['GSDP', (z) => ECO[z.id] ? ECO[z.id].g : null, (z) => ECO[z.id].g >= 1000 ? nf2.format(ECO[z.id].g / 1000) + L(' লক্ষ কোটি ₹', ' लाख करोड़ ₹', ' L Cr ₹') : nf.format(ECO[z.id].g * 100) + L(' কোটি ₹', ' करोड़ ₹', ' Cr ₹'), 'hi'],
    [L('SDG উন্নয়ন স্কোর', 'SDG विकास स्कोर', 'SDG India Score'), (z) => si(z).sdg ?? null, (z) => nf.format(si(z).sdg) + '/100', 'hi'],
    ['HDI', (z) => ext(z).hdi ?? null, (z) => nf3.format(ext(z).hdi), 'hi'],
    [L('দারিদ্র্য সূচক (MPI)', 'ग़रीबी सूचकांक (MPI)', 'Poverty (MPI)'), (z) => MPI[z.id] ?? null, (z) => nf2.format(MPI[z.id]) + '%', 'lo'],
    [L('বেকারত্বের হার', 'बेरोज़गारी दर', 'Unemployment Rate'), (z) => si(z).unemp ?? null, (z) => nf1.format(si(z).unemp) + '%', 'lo'],
    [L('নারী শ্রমশক্তি (LFPR)', 'महिला श्रम भागीदारी', 'Female LFPR'), (z) => si(z).flfpr ?? null, (z) => nf1.format(si(z).flfpr) + '%', 'hi'],
    [L('আয়ুষ্কাল', 'जीवन प्रत्याशा', 'Life Expectancy'), (z) => ext(z).lifeExp ?? null, (z) => nf1.format(ext(z).lifeExp) + L(' বছর', ' वर्ष', ' yrs'), 'hi'],
    [L('বনভূমি', 'वन क्षेत्र', 'Forest Cover'), (z) => ext(z).forestCover ?? null, (z) => nf1.format(ext(z).forestCover) + '%', 'hi'],
    [L('লোকসভা আসন', 'लोकसभा सीटें', 'Lok Sabha Seats'), (z) => z.ls, (z) => nf.format(z.ls), 'ne']
  ];

  let winsL = 0, winsR = 0;
  const rowsHtml = metrics.map(([lbl, get, fmt, pol]) => {
    const vl = get(x), vr = get(y);
    const sl = vl != null ? fmt(x) : dash, sr = vr != null ? fmt(y) : dash;
    let wL = false, wR = false;
    if (vl != null && vr != null && vl !== vr && (pol === 'hi' || pol === 'lo')) {
      wL = pol === 'hi' ? vl > vr : vl < vr;
      wR = !wL;
      if (wL) winsL++; else winsR++;
    }
    const maxV = Math.max(vl || 0, vr || 0, 0.0001);
    const pL = vl != null ? Math.max(6, Math.round((vl / maxV) * 100)) : 0;
    const pR = vr != null ? Math.max(6, Math.round((vr / maxV) * 100)) : 0;
    const arrow = pol === 'hi' ? ' ▲' : pol === 'lo' ? ' ▼' : '';
    return `<div class="duel-row"><div class="duel-row-lbl">${lbl}${arrow}</div><div class="duel-row-vals">` +
      `<div class="duel-side left"><span class="duel-val-txt${wL ? ' win-l' : ''}">${wL ? '★ ' : ''}${sl}</span><div class="duel-mini-track"><div class="duel-mini-fill-l" style="width:${pL}%"></div></div></div>` +
      `<div class="duel-side right"><span class="duel-val-txt${wR ? ' win-r' : ''}">${sr}${wR ? ' ★' : ''}</span><div class="duel-mini-track"><div class="duel-mini-fill-r" style="width:${pR}%"></div></div></div>` +
      `</div></div>`;
  }).join('');

  const totW = Math.max(1, winsL + winsR);
  const pctL = Math.round((winsL / totW) * 100), pctR = 100 - pctL;

  return `<div class="duel-box">` +
    `<div class="duel-head">` +
      `<span class="duel-me">🔵 ${R(x).n}</span>` +
      `<span class="duel-vs-pill">VS</span>` +
      `<div class="duel-sel-wrap"><span>🟢</span><select id="vs-sel" data-vs aria-label="${L('অন্য রাজ্য বাছুন', 'दूसरा राज्य चुनें', 'Pick another state')}">${opts}</select></div>` +
    `</div>` +
    `<div class="duel-quick"><span class="cmp-presets-lbl">⚡ ${L('দ্রুত বাছুন:', 'त्वरित चुनें:', 'Quick pick:')}</span>${quickChips}</div>` +
    `<div class="duel-score">` +
      `<div class="duel-score-top"><span style="color:#2563EB">${R(x).sh || R(x).n}: ${nf.format(winsL)} ${winsL > winsR ? '🏆' : ''}</span><span style="font-size:11.5px;color:var(--muted)">${L('মূল সূচকে এগিয়ে', 'मुख्य सूचकांकों में आगे', 'key metrics led')}</span><span style="color:#059669">${winsR > winsL ? '🏆 ' : ''}${R(y).sh || R(y).n}: ${nf.format(winsR)}</span></div>` +
      `<div class="duel-score-bar"><div style="width:${pctL}%;background:#3B82F6"></div><div style="width:${pctR}%;background:#10B981"></div></div>` +
    `</div>` +
    `<div class="duel-rows">${rowsHtml}</div>` +
  `</div>`;
}

function stCmp(x) {
  const g = x.t === 'state' ? L('রাজ্যগুলির', 'राज्यों', 'states') : L('কেন্দ্রশাসিত অঞ্চলগুলির', 'केंद्रशासित प्रदेशों', 'UTs');
  const n = groupSize(x), popShare = (x.pop / TOTAL_POP) * 100, areaShare = (x.area / TOTAL_AREA) * 100;
  const maxPop = Math.max(...T.map((y) => y.pop / TOTAL_POP * 100)), maxArea = Math.max(...T.map((y) => y.area / TOTAL_AREA * 100));
  const ratio = x.d / NAT_DENSITY_2011;
  const litVal = LIT[x.id] ? LIT[x.id][3] : null;
  const litRk = rankMetric(x, (z) => LIT[z.id] ? LIT[z.id][3] : null);
  const pcVal = ECO[x.id] ? ECO[x.id].p24 : null;
  const pcRk = rankMetric(x, (z) => ECO[z.id] ? ECO[z.id].p24 : null);
  const sdgVal = ST_IDX[x.id] ? ST_IDX[x.id].sdg : null;
  const sdgRk = rankMetric(x, (z) => ST_IDX[z.id] ? ST_IDX[z.id].sdg : null);

  const standCards = `<h3 class="sub">📊 ${L('জাতীয় প্রেক্ষাপটে অবস্থান', 'राष्ट्रीय परिप्रेक्ष्य में स्थिति', 'National Standing Overview')}</h3>` +
    `<div class="stcmp-grid">` +
      `<div class="stcmp-card" style="--cc:#6366F1"><div class="stcmp-top"><span class="stcmp-lbl">${L('জনসংখ্যার অংশ', 'जनसंख्या हिस्सा', 'Population Share')}</span><span class="stcmp-rk">#${nf.format(rankIn(x, 'pop'))}/${nf.format(n)}</span></div><div class="stcmp-val">${nf2.format(popShare)}%</div>${bar((popShare / maxPop) * 100, 'pop')}<div class="stcmp-sub">${big(x.pop)} · ${g} ${L('মধ্যে', 'में', 'among')}</div></div>` +
      `<div class="stcmp-card" style="--cc:#10B981"><div class="stcmp-top"><span class="stcmp-lbl">${L('আয়তনের অংশ', 'क्षेत्रफल हिस्सा', 'Area Share')}</span><span class="stcmp-rk">#${nf.format(rankIn(x, 'area'))}/${nf.format(n)}</span></div><div class="stcmp-val">${nf2.format(areaShare)}%</div>${bar((areaShare / maxArea) * 100, 'area')}<div class="stcmp-sub">${nf.format(x.area)} ${KM()}</div></div>` +
      `<div class="stcmp-card" style="--cc:#A855F7"><div class="stcmp-top"><span class="stcmp-lbl">${L('জনঘনত্ব', 'जनघनत्व', 'Density')}</span><span class="stcmp-rk">#${nf.format(rankIn(x, 'd'))}/${nf.format(n)}</span></div><div class="stcmp-val">${nf.format(Math.round(x.d))}</div>${bar(Math.sqrt(x.d / Math.max(...T.map((y) => y.d))) * 100, 'density')}<div class="stcmp-sub">${L(`ভারতের গড়ের ${nf1.format(ratio)} গুণ`, `भारत औसत का ${nf1.format(ratio)} गुना`, `${nf1.format(ratio)}× national avg`)}</div></div>` +
      (litVal != null ? `<div class="stcmp-card" style="--cc:#0EA5E9"><div class="stcmp-top"><span class="stcmp-lbl">${L('সাক্ষরতা (২০২৪)', 'साक्षरता (2024)', 'Literacy (2024)')}</span><span class="stcmp-rk">${litRk ? `#${nf.format(litRk[0])}/${nf.format(litRk[1])}` : ''}</span></div><div class="stcmp-val">${nf1.format(litVal)}%</div>${bar(litVal, 'lit')}<div class="stcmp-sub">${L('ভারতের গড় ৮০.৯%', 'भारत औसत 80.9%', 'India avg: 80.9%')}</div></div>` : '') +
      (pcVal != null ? `<div class="stcmp-card" style="--cc:#F59E0B"><div class="stcmp-top"><span class="stcmp-lbl">${L('মাথাপিছু আয়', 'प्रति व्यक्ति आय', 'Per-Capita GSDP')}</span><span class="stcmp-rk">${pcRk ? `#${nf.format(pcRk[0])}/${nf.format(pcRk[1])}` : ''}</span></div><div class="stcmp-val">₹${big(pcVal)}</div>${bar(Math.min(100, (pcVal / 850000) * 100), 'pc')}<div class="stcmp-sub">${L('ভারতের গড় ₹২.৩৫ লক্ষ', 'भारत औसत ₹2.35 लाख', 'India avg: ₹2.35 L')}</div></div>` : '') +
      (sdgVal != null ? `<div class="stcmp-card" style="--cc:#14B8A6"><div class="stcmp-top"><span class="stcmp-lbl">${L('SDG স্কোর', 'SDG स्कोर', 'SDG Score')}</span><span class="stcmp-rk">${sdgRk ? `#${nf.format(sdgRk[0])}/${nf.format(sdgRk[1])}` : ''}</span></div><div class="stcmp-val">${nf.format(sdgVal)}/100</div>${bar(sdgVal, 'sdg')}<div class="stcmp-sub">${L('NITI Aayog ২০২৩-২৪ (গড় ৭১)', 'NITI Aayog 2023-24 (औसत 71)', 'NITI Aayog 2023-24 (Avg 71)')}</div></div>` : '') +
    `</div>`;

  return standCards +
    `<h3 class="sub">⚔️ ${L('অন্য রাজ্যের সাথে মুখোমুখি তুলনা', 'अन्य राज्य से आमने-सामने तुलना', 'Head-to-Head State Comparison')}</h3>` +
    stVs(x) +
    `<p class="hint">${L('★ চিহ্নিত মানটি তুলনায় এগিয়ে — ▲ বেশি ভালো, ▼ কম ভালো। আরও সূচক দেখতে "সূচক" ট্যাব দেখুন।', '★ चिह्नित मान तुलना में बेहतर है — ▲ ज़्यादा बेहतर, ▼ कम बेहतर। अधिक विवरण के लिए "सूचकांक" टैब देखें।', '★ indicates the leading figure — ▲ higher is better, ▼ lower is better. Check the "Indices" tab for full state metrics.')}</p>`;
}

function stIdx(x) {
  const e = EXT[x.id] || {};
  const si = ST_IDX[x.id] || {};
  const mpi = MPI[x.id];
  const nm = R(x).n;
  const sdgCat = si.sdg != null
    ? (si.sdg >= 65
      ? `<span class="sdg-pill sdg-fr">${L('ফ্রন্ট রানার', 'फ़्रंट रनर', 'Front Runner')}</span>`
      : `<span class="sdg-pill sdg-pf">${L('পারফর্মার', 'परफ़ॉर्मर', 'Performer')}</span>`)
    : '';
  const kpiHtml = `<div class="stidx-kpis">` +
    `<div class="stidx-kpi" style="--sk:#10B981"><span class="stidx-kpi-lbl">${L('SDG ইন্ডিয়া স্কোর', 'SDG इंडिया स्कोर', 'SDG India Score')}</span><div class="stidx-kpi-val">${si.sdg != null ? nf.format(si.sdg) + '/100' : '—'}${sdgCat}</div><div class="stidx-bar"><i style="width:${si.sdg || 0}%"></i></div><span class="stidx-kpi-sub">${L('ভারতের গড় ৭১ (NITI Aayog)', 'भारत औसत 71 (NITI Aayog)', 'India avg: 71 (NITI Aayog)')}</span></div>` +
    `<div class="stidx-kpi" style="--sk:#2563EB"><span class="stidx-kpi-lbl">${L('মানব উন্নয়ন (HDI)', 'मानव विकास (HDI)', 'Human Dev (HDI)')}</span><div class="stidx-kpi-val">${e.hdi != null ? nf3.format(e.hdi) : '—'}</div><div class="stidx-bar"><i style="width:${e.hdi ? Math.round(e.hdi * 100) : 0}%"></i></div><span class="stidx-kpi-sub">${L('০ থেকে ১ স্কেল (বেশি ভালো)', '0 से 1 पैमाना (अधिक बेहतर)', '0 to 1 scale (higher better)')}</span></div>` +
    `<div class="stidx-kpi" style="--sk:#F59E0B"><span class="stidx-kpi-lbl">${L('বহুমাত্রিক দারিদ্র্য (MPI)', 'बहुआयामी ग़रीबी (MPI)', 'Poverty (MPI)')}</span><div class="stidx-kpi-val">${mpi != null ? nf2.format(mpi) + '%' : '—'}</div><div class="stidx-bar"><i style="width:${mpi != null ? Math.min(100, Math.round(mpi * 2.5)) : 0}%"></i></div><span class="stidx-kpi-sub">${L('কম মানেই ভালো (NFHS-5)', 'कम मान बेहतर (NFHS-5)', 'Lower is better (NFHS-5)')}</span></div>` +
    `<div class="stidx-kpi" style="--sk:#7C3AED"><span class="stidx-kpi-lbl">${L('বেকারত্বের হার', 'बेरोज़गारी दर', 'Unemployment')}</span><div class="stidx-kpi-val">${si.unemp != null ? nf1.format(si.unemp) + '%' : '—'}</div><div class="stidx-bar"><i style="width:${si.unemp != null ? Math.min(100, Math.round(si.unemp * 8)) : 0}%"></i></div><span class="stidx-kpi-sub">${L('ভারতের গড় ৩.২% (PLFS)', 'भारत औसत 3.2% (PLFS)', 'India avg: 3.2% (PLFS)')}</span></div>` +
  `</div>`;

  const card = (lbl, val, sub, pct) => `<div class="stidx-item"><div class="stidx-item-top"><span class="stidx-item-lbl">${lbl}</span><span class="stidx-item-val">${val}</span></div>${pct != null ? `<div class="stidx-bar"><i style="width:${Math.max(3, Math.min(100, pct))}%"></i></div>` : ''}${sub ? `<small>${sub}</small>` : ''}</div>`;
  const sec = (ico, title, col, items) => items.length ? `<div class="stidx-sec" style="--sc:${col}"><h3 class="stidx-sec-head">${ico} ${title}</h3><div class="stidx-grid">${items.join('')}</div></div>` : '';

  const demo = [];
  if (e.sexRatio != null) demo.push(card(L('লিঙ্গ অনুপাত', 'लिंगानुपात', 'Sex Ratio'), nf.format(e.sexRatio) + L('/১০০০', '/1000', '/1000'), L('প্রতি ১,০০০ পুরুষে নারী (আদমশুমারি ২০১১)', 'प्रति 1,000 पुरुष पर महिलाएँ (2011)', 'Females per 1,000 males (Census 2011)'), Math.min(100, (e.sexRatio / 1100) * 100)));
  if (e.urban != null) demo.push(card(L('নগরায়ণের হার', 'शहरीकरण दर', 'Urbanization'), nf1.format(e.urban) + '%', L('শহরাঞ্চলে বসবাসকারী জনসংখ্যা', 'शहरी क्षेत्रों में रहने वाली आबादी', 'Share living in urban areas'), e.urban));
  if (e.districts != null) demo.push(card(L('জেলার সংখ্যা', 'ज़िलों की संख्या', 'Districts'), nf.format(e.districts), L('প্রশাসনিক জেলা', 'प्रशासनिक ज़िले', 'Administrative districts')));

  const econ = [];
  if (mpi != null) econ.push(card(L('বহুমাত্রিক দারিদ্র্য (MPI)', 'बहुआयामी ग़रीबी (MPI)', 'Multidimensional Poverty'), nf2.format(mpi) + '%', L('NITI Aayog ২০২৩ (কম মানেই ভালো)', 'NITI Aayog 2023 (कम मान बेहतर)', 'NITI Aayog 2023 (lower is better)'), Math.min(100, mpi * 2.5)));
  if (si.unemp != null) econ.push(card(L('বেকারত্বের হার (PLFS)', 'बेरोज़गारी दर (PLFS)', 'Unemployment Rate'), nf1.format(si.unemp) + '%', L('১৫+ বছর, PLFS ২০২৩-২৪ (দেশের গড় ৩.২%)', '15+ वर्ष, PLFS 2023-24 (भारत औसत 3.2%)', 'Age 15+, PLFS 2023-24 (India avg 3.2%)'), Math.min(100, si.unemp * 8)));
  if (si.flfpr != null) econ.push(card(L('নারী শ্রমশক্তি অংশগ্রহণ', 'महिला श्रम भागीदारी (LFPR)', 'Female LFPR'), nf1.format(si.flfpr) + '%', L('১৫+ বছর, PLFS ২০২৩-২৪ (দেশের গড় ৪১.৭%)', '15+ वर्ष, PLFS 2023-24 (भारत औसत 41.7%)', 'Age 15+, PLFS 2023-24 (India avg 41.7%)'), si.flfpr));
  if (si.epi != null) econ.push(card(L('রপ্তানি প্রস্তুতি সূচক (EPI)', 'निर्यात तत्परता सूचकांक (EPI)', 'Export Preparedness (EPI)'), nf1.format(si.epi) + '/100', L('NITI Aayog রপ্তানি সক্ষমতা স্কোর', 'NITI Aayog निर्यात क्षमता स्कोर', 'NITI Aayog export ecosystem score'), si.epi));

  const health = [];
  if (si.health != null) health.push(card(L('NITI স্বাস্থ্য সূচক', 'NITI स्वास्थ्य सूचकांक', 'NITI State Health Index'), nf1.format(si.health) + '/100', L('৪র্থ রাউন্ড সামগ্রিক স্বাস্থ্য স্কোর', 'चौथा दौर समग्र स्वास्थ्य स्कोर', '4th Round composite health score'), si.health));
  if (e.lifeExp != null) health.push(card(L('আয়ুষ্কাল', 'जीवन प्रत्याशा', 'Life Expectancy'), nf1.format(e.lifeExp) + L(' বছর', ' वर्ष', ' yrs'), L('জন্মের সময় গড় আয়ু', 'जन्म के समय औसत आयु', 'Average life expectancy at birth'), Math.min(100, (e.lifeExp / 80) * 100)));
  if (e.imr != null) health.push(card(L('শিশুমৃত্যুর হার (IMR)', 'शिशु मृत्यु दर (IMR)', 'Infant Mortality (IMR)'), nf.format(e.imr), L('প্রতি হাজার জীবিত জন্মে (কম ভালো)', 'प्रति हज़ार जीवित जन्म पर (कम बेहतर)', 'Per 1,000 live births (lower better)'), Math.min(100, e.imr * 2.5)));

    sec('🏛️', L('শাসন ও প্রতিনিধিত্ব', 'शासन और प्रतिनिधित्व', 'Governance & Representation'), '#7C3AED', gov) +
    sec('🌿', L('ডিজিটাল, পরিচ্ছন্নতা ও পরিবেশ', 'डिजिटल, स्वच्छता और पर्यावरण', 'Digital, Cleanliness & Environment'), '#0D9488', infra) +

const FACT_BANK = [["const","ভারতে ২৮টি রাজ্য ও ৮টি কেন্দ্রশাসিত অঞ্চল আছে।","भारत में 28 राज्य और 8 केंद्रशासित प्रदेश हैं।","India has 28 states and 8 union territories."],["const","ভারতের সংবিধান বিশ্বের দীর্ঘতম লিখিত সংবিধান।","भारत का संविधान दुनिया का सबसे लंबा लिखित संविधान है।","India's Constitution is the longest written constitution in the world."],["const","সংবিধানের অষ্টম তফসিলে ২২টি ভাষা স্বীকৃত, যদিও ভারতে শত শত ভাষা ও উপভাষা বলা হয়।","संविधान की आठवीं अनुसूची में 22 भाषाएँ मान्यता-प्राप्त हैं, हालाँकि भारत में सैकड़ों भाषाएँ और बोलियाँ बोली जाती हैं।","The Eighth Schedule recognises 22 languages, though hundreds of languages and dialects are spoken across India."],["const","ভারতের সংবিধান গৃহীত হয় ২৬ নভেম্বর ১৯৪৯ এবং কার্যকর হয় ২৬ জানুয়ারি ১৯৫০।","भारत का संविधान 26 नवंबर 1949 को अपनाया गया और 26 जनवरी 1950 को लागू हुआ।","India's Constitution was adopted on 26 November 1949 and came into force on 26 January 1950."],["const","মূল সংবিধানের ইংরেজি কপিটি হাতে লিখেছিলেন প্রখ্যাত ক্যালিগ্রাফার প্রেম বিহারী নারায়ণ রাইজাদা।","मूल संविधान की अंग्रेज़ी प्रति सुलेखक प्रेम बिहारी नारायण रायज़ादा ने हाथ से लिखी थी।","The original English copy of the Indian Constitution was handwritten by calligrapher Prem Behari Narain Raizada."],["const","সংবিধানের মূল পাণ্ডুলিপি অলংকরণ করেছিলেন শান্তিনিকেতনের শিল্পী নন্দলাল বসু ও তাঁর ছাত্ররা।","संविधान की मूल पांडुलिपि की सजावट शांतिनिकेतन के कलाकार नंदलाल बोस और उनके शिष्यों ने की थी।","The original Constitution manuscript was illuminated by Nandalal Bose and artists from Santiniketan."],["const","ভারতের মূল সংবিধানের পাণ্ডুলিপি সংসদ ভবনে হিলিয়াম-ভরা বিশেষ কাচের বাক্সে সংরক্ষিত আছে।","भारत के मूल संविधान की पांडुलिपि संसद भवन में हीलियम-भरे विशेष काँच के बक्से में सुरक्षित है।","The original manuscript of India's Constitution is preserved in helium-filled cases in Parliament."],["const","সংবিধান প্রণয়নে গণপরিষদের সময় লেগেছিল ২ বছর ১১ মাস ১৮ দিন।","संविधान सभा को भारत का संविधान तैयार करने में 2 वर्ष, 11 महीने और 18 दिन लगे थे।","The Constituent Assembly took 2 years, 11 months and 18 days to draft the Constitution of India."],["const","ড. বি. আর. আম্বেদকর অনুচ্ছেদ ৩২ (সাংবিধানিক প্রতিকারের অধিকার)-কে \"সংবিধানের হৃদয় ও আত্মা\" বলেছিলেন।","डॉ. बी. आर. आंबेडकर ने अनुच्छेद 32 (संवैधानिक उपचारों का अधिकार) को \"संविधान का हृदय और आत्मा\" कहा था।","Dr. B. R. Ambedkar called Article 32 (Right to Constitutional Remedies) the \"heart and soul of the Constitution\"."],["const","ভারতের সংবিধানে কোনো একক \"জাতীয় ভাষা\" নির্ধারিত নেই; কেন্দ্রের সরকারি ভাষা হিন্দি ও ইংরেজি।","भारत के संविधान में कोई एक \"राष्ट्रभाषा\" तय नहीं है; केंद्र की राजभाषाएँ हिंदी और अंग्रेज़ी हैं।","The Indian Constitution specifies no single \"national language\"; Hindi and English are the official languages of the Union."],["const","১৯৭৮ সালের ৪৪তম সংশোধনীর মাধ্যমে সম্পত্তির অধিকারকে মৌলিক অধিকার থেকে অনুচ্ছেদ ৩০০ক-তে আইনি অধিকার করা হয়।","1978 के 44वें संशोधन से संपत्ति के अधिकार को मौलिक अधिकार से हटाकर अनुच्छेद 300क के तहत विधिक अधिकार बनाया गया।","The 44th Amendment (1978) moved the Right to Property from Fundamental Rights to a legal right under Article 300A."],["const","১৯৭৬ সালের ৪২তম সংশোধনীর মাধ্যমে সংবিধানের প্রস্তাবনায় \"সমাজতান্ত্রিক\", \"ধর্মনিরপেক্ষ\" ও \"অখণ্ডতা\" শব্দ তিনটি যুক্ত হয়।","1976 के 42वें संशोधन से प्रस्तावना में \"समाजवादी\", \"पंथनिरपेक्ष\" और \"अखंडता\" शब्द जोड़े गए।","The 42nd Amendment (1976) added \"Socialist\", \"Secular\" and \"Integrity\" to the Preamble of the Constitution."],["const","১৯৮৮ সালের ৬১তম সংশোধনীতে ভারতে ভোট দেওয়ার ন্যূনতম বয়স ২১ বছর থেকে কমিয়ে ১৮ বছর করা হয়।","1988 के 61वें संविधान संशोधन से भारत में मतदान की न्यूनतम आयु 21 से घटाकर 18 वर्ष की गई।","The 61st Amendment (1988) lowered India's minimum voting age from 21 to 18 years."],["const","২০০২ সালের ৮৬তম সংশোধনীর মাধ্যমে ৬ থেকে ১৪ বছর বয়সী শিশুদের শিক্ষার অধিকার অনুচ্ছেদ ২১ক-তে যুক্ত হয়।","2002 के 86वें संशोधन से 6 से 14 वर्ष के बच्चों के लिए शिक्षा का अधिकार अनुच्छेद 21क में जोड़ा गया।","The 86th Amendment (2002) inserted Article 21A, making free education for children aged 6–14 a Fundamental Right."],["const","লোকসভার নির্বাচিত আসন ৫৪৩টি এবং রাজ্যসভার সর্বোচ্চ অনুমোদিত সদস্যসংখ্যা ২৫০ জন।","लोकसभा की निर्वाचित सीटें 543 हैं और राज्यसभा की अधिकतम निर्धारित सदस्य संख्या 250 है।","The Lok Sabha has 543 elected seats, while the Rajya Sabha has a maximum sanctioned strength of 250 members."],["const","ভারতের মাত্র ৬টি রাজ্যে দ্বিকক্ষবিশিষ্ট আইনসভা (বিধানসভা ও বিধান পরিষদ) রয়েছে।","भारत के केवल 6 राज्यों में द्विसदनीय विधानमंडल (विधानसभा और विधान परिषद) है।","Only 6 Indian states have a bicameral legislature with both a Legislative Assembly and a Legislative Council."],["const","ভারতের সুপ্রিম কোর্টের আনুষ্ঠানিক উদ্বোধন হয় ২৮ জানুয়ারি ১৯৫০ সালে।","भारत के सर्वोच्च न्यायालय का औपचारिक उद्घाटन 28 जनवरी 1950 को हुआ था।","The Supreme Court of India was formally inaugurated on 28 January 1950."],["const","ভারতের নির্বাচন কমিশন প্রতিষ্ঠিত হয় ২৫ জানুয়ারি ১৯৫০ সালে; তাই ২৫ জানুয়ারি \"জাতীয় ভোটার দিবস\"।","भारत निर्वाचन आयोग की स्थापना 25 जनवरी 1950 को हुई थी; इसलिए 25 जनवरी को राष्ट्रीय मतदाता दिवस मनाया जाता है।","The Election Commission of India was founded on 25 January 1950, celebrated annually as National Voters' Day."],["const","ভারতের প্রথম প্রধান নির্বাচন কমিশনার ছিলেন সুকুমার সেন, যিনি ১৯৫১–৫২ সালের প্রথম সাধারণ নির্বাচন পরিচালনা করেন।","भारत के पहले मुख्य चुनाव आयुक्त सुकुमार सेन थे, जिन्होंने 1951–52 का पहला आम चुनाव कराया।","India's first Chief Election Commissioner was Sukumar Sen, who oversaw the 1951–52 general election."],["const","ভারতের রাষ্ট্রপতি দেশের প্রথম নাগরিক এবং স্থল, নৌ ও বায়ু—তিন প্রতিরক্ষা বাহিনীর সর্বাধিনায়ক।","भारत के राष्ट्रपति देश के प्रथम नागरिक और थल, जल व वायु तीनों सेनाओं के सर्वोच्च कमांडर होते हैं।","The President of India is the first citizen and Supreme Commander of the Indian Armed Forces."],["const","সংবিধানের অনুচ্ছেদ ১৭ অনুযায়ী অস্পৃশ্যতা সম্পূর্ণভাবে বিলুপ্ত ও দণ্ডনীয় অপরাধ।","संविधान के अनुच्छेद 17 के तहत अस्पृश्यता को पूर्णतः समाप्त और दंडनीय अपराध घोषित किया गया है।","Article 17 of the Constitution abolishes untouchability and forbids its practice in any form."],["const","১৯৭৩ সালের কেশবানন্দ ভারতী মামলায় সুপ্রিম কোর্ট সংবিধানের \"মৌলিক কাঠামো\" (Basic Structure) নীতি প্রতিষ্ঠা করে।","1973 के केशवानंद भारती मामले में सुप्रीम कोर्ट ने संविधान के \"मूल ढाँचे\" का सिद्धांत स्थापित किया।","In the 1973 Kesavananda Bharati judgment, the Supreme Court established the Basic Structure doctrine."],["const","ভারতের জাতীয় পতাকার নকশা করেছিলেন পিঙ্গালি ভেঙ্কাইয়া; গণপরিষদ এটি গ্রহণ করে ২২ জুলাই ১৯৪৭ সালে।","भारत के राष्ट्रीय ध्वज का डिज़ाइन पिंगली वेंकैया ने तैयार किया था; इसे 22 जुलाई 1947 को अपनाया गया।","India's national flag was designed by Pingali Venkayya and adopted on 22 July 1947."],["const","ভারতের প্রথম সাধারণ নির্বাচনে (১৯৫১–৫২) প্রায় ১৭ কোটি ভোটার অংশ নেওয়ার যোগ্য ছিলেন।","भारत के पहले आम चुनाव (1951–52) में लगभग 17 करोड़ मतदाता पंजीकृत थे।","Roughly 170 million voters were eligible in India's first general election in 1951–52."],["const","৭৩তম ও ৭৪তম সংবিধান সংশোধনীর (১৯৯২) মাধ্যমে পঞ্চায়েতি রাজ ও পৌরসভাকে সাংবিধানিক মর্যাদা দেওয়া হয়।","73वें और 74वें संविधान संशोधन (1992) से पंचायती राज और नगरपालिकाओं को संवैधानिक दर्जा मिला।","The 73rd and 74th Amendments (1992) granted constitutional status to Panchayati Raj and urban municipalities."],["const","ভারতের সংবিধানের ১১টি মৌলিক কর্তব্য (Fundamental Duties) অনুচ্ছেদ ৫১ক-তে বর্ণিত আছে।","भारत के संविधान के 11 मौलिक कर्तव्य अनुच्छेद 51क में वर्णित हैं।","The 11 Fundamental Duties of Indian citizens are listed under Article 51A of the Constitution."],["const","কলকাতা, বম্বে ও মাদ্রাজ হাইকোর্ট (১৮৬২) ভারতের তিনটি প্রাচীনতম হাইকোর্ট।","कलकत्ता, बॉम्बे और मद्रास हाईकोर्ट (1862) भारत के तीन सबसे पुराने उच्च न्यायालय हैं।","The High Courts of Calcutta, Bombay and Madras (1862) are India's three oldest High Courts."],["geo","রাজস্থান আয়তনে ভারতের বৃহত্তম রাজ্য, আর গোয়া ক্ষুদ্রতম।","राजस्थान क्षेत्रफल में भारत का सबसे बड़ा राज्य है, और गोवा सबसे छोटा।","Rajasthan is India's largest state by area, and Goa is the smallest."],["geo","উত্তরপ্রদেশ জনসংখ্যায় ভারতের বৃহত্তম রাজ্য, আর সিকিম সবচেয়ে কম জনসংখ্যার রাজ্য।","उत्तर प्रदेश जनसंख्या में भारत का सबसे बड़ा राज्य है, जबकि सिक्किम सबसे कम आबादी वाला राज्य है।","Uttar Pradesh is India's most populous state, while Sikkim is the least populous state."],["geo","গঙ্গা নদী ভারতের দীর্ঘতম নদী (দেশের ভেতরে প্রবাহিত দৈর্ঘ্য প্রায় ২,৫২৫ কিমি)।","गंगा नदी भारत की सबसे लंबी नदी है (देश के भीतर लंबाई लगभग 2,525 किमी)।","The Ganga is India's longest river, flowing roughly 2,525 km within the country."],["geo","কাঞ্চনজঙ্ঘা (৮,৫৮৬ মিটার) ভারতের সিকিম সীমান্তে অবস্থিত বিশ্বের তৃতীয় সর্বোচ্চ পর্বতশৃঙ্গ।","कंचनजंघा (8,586 मीटर) सिक्किम सीमा पर स्थित दुनिया की तीसरी सबसे ऊँची चोटी है।","Kangchenjunga (8,586 m) on Sikkim's border is the world's third-highest mountain peak."],["geo","মেঘালয়ের মাওসিনরাম পৃথিবীর সর্বাধিক বৃষ্টিপাতযুক্ত জনবসতিপূর্ণ স্থান হিসেবে পরিচিত।","मेघालय का मौसिनराम धरती पर सबसे अधिक वर्षा वाले बसावट क्षेत्र के रूप में जाना जाता है।","Mawsynram in Meghalaya is widely recognised as the wettest inhabited place on Earth."],["geo","কর্কটক্রান্তি রেখা (২৩.৫° উত্তর) ভারতের মোট ৮টি রাজ্যের ওপর দিয়ে অতিক্রম করেছে।","कर्क रेखा (23.5° उत्तर) भारत के कुल 8 राज्यों से होकर गुज़रती है।","The Tropic of Cancer (23.5° N) passes through 8 Indian states."],["geo","ভারতের মান সময় (IST) নির্ধারিত হয় ৮২.৫° পূর্ব দ্রাঘিমাংশ অনুযায়ী, যা উত্তরপ্রদেশের মির্জাপুরের কাছ দিয়ে গেছে।","भारतीय मानक समय (IST) 82.5° पूर्वी देशांतर पर आधारित है, जो उत्तर प्रदेश के मिर्ज़ापुर के पास से गुज़रता है।","Indian Standard Time (IST) is based on the 82.5° E longitude near Mirzapur in Uttar Pradesh."],["geo","ভারতের মূল ভূখণ্ড ও দ্বীপপুঞ্জ মিলিয়ে মোট উপকূলরেখার দৈর্ঘ্য ৭,৫০০ কিলোমিটারেরও বেশি।","भारत की मुख्य भूमि और द्वीपों को मिलाकर कुल तटरेखा 7,500 किलोमीटर से अधिक लंबी है।","India's total coastline, including its island territories, stretches over 7,500 km."],["geo","গুজরাত ভারতের দীর্ঘতম উপকূলরেখাবিশিষ্ট রাজ্য।","गुजरात भारत की सबसे लंबी तटरेखा वाला राज्य है।","Gujarat has the longest coastline of any Indian state."],["geo","ভারতের স্থলসীমান্ত মোট ৭টি দেশের সঙ্গে যুক্ত — বাংলাদেশ, চীন, পাকিস্তান, নেপাল, মিয়ানমার, ভুটান ও আফগানিস্তান।","भारत की स्थलीय सीमा 7 देशों से लगती है — बांग्लादेश, चीन, पाकिस्तान, नेपाल, म्यांमार, भूटान और अफ़ग़ानिस्तान।","India shares land borders with 7 countries: Bangladesh, China, Pakistan, Nepal, Myanmar, Bhutan and Afghanistan."],["geo","ভারতের দীর্ঘতম আন্তর্জাতিক স্থলসীমান্ত বাংলাদেশের সঙ্গে (প্রায় ৪,০৯৬ কিমি)।","भारत की सबसे लंबी अंतरराष्ट्रीय स्थलीय सीमा बांग्लादेश के साथ (लगभग 4,096 किमी) है।","India's longest international land border is with Bangladesh, stretching about 4,096 km."],["geo","আন্দামান ও নিকোবরের ব্যারেন দ্বীপ দক্ষিণ এশিয়ার একমাত্র সক্রিয় আগ্নেয়গিরি।","अंडमान और निकोबार का बैरन द्वीप दक्षिण एशिया का एकमात्र सक्रिय ज्वालामुखी है।","Barren Island in the Andaman & Nicobar Islands is South Asia's only active volcano."],["geo","নিকোবর দ্বীপপুঞ্জের ইন্দিরা পয়েন্ট ভারতের দক্ষিণতম বিন্দু, আর মূল ভূখণ্ডের দক্ষিণতম বিন্দু কন্যাকুমারী।","निकोबार द्वीपसमूह का इंदिरा पॉइंट भारत का दक्षिणतम बिंदु है, जबकि मुख्य भूमि का दक्षिणतम सिरा कन्याकुमारी है।","Indira Point in Nicobar is India's southernmost point, while Kanyakumari is the tip of the mainland."],["geo","মণিপুরের লোকতাক হ্রদে অবস্থিত কেইবুল লামজাও বিশ্বের একমাত্র ভাসমান জাতীয় উদ্যান।","मणिपुर की लोकटक झील में स्थित केइबुल लमजाओ दुनिया का एकमात्र तैरता हुआ राष्ट्रीय उद्यान है।","Keibul Lamjao on Manipur's Loktak Lake is the world's only floating national park."],["geo","অসমের ব্রহ্মপুত্র নদের বুকে অবস্থিত মাজুলি বিশ্বের বৃহত্তম নদী-দ্বীপগুলির একটি।","असम में ब्रह्मपुत्र नदी पर स्थित माजुली दुनिया के सबसे बड़े नदी-द्वीपों में से एक है।","Majuli on the Brahmaputra in Assam is one of the world's largest river islands."],["geo","মহারাষ্ট্রের লোনার হ্রদ প্রায় ৫০,০০০ বছর আগে উল্কাপাতের ফলে সৃষ্ট এক বিরল ব্যাসল্ট ক্রেটার হ্রদ।","महाराष्ट्र की लोनार झील लगभग 50,000 साल पहले उल्कापिंड के टकराने से बनी दुर्लभ क्रेटर झील है।","Lonar Lake in Maharashtra is a rare crater lake formed by a meteorite impact around 50,000 years ago."],["geo","ওডিশার চিলিকা হ্রদ এশিয়ার বৃহত্তম লোনা জলের উপহ্রদ (ল্যাগুন)।","ओडिशा की चिल्का झील एशिया की सबसे बड़ी खारे पानी की लैगून झील है।","Odisha's Chilika Lake is the largest brackish-water lagoon in Asia."],["geo","কেরলের ভেম্বানাড হ্রদ ভারতের দীর্ঘতম হ্রদ, যার দৈর্ঘ্য প্রায় ৯৬ কিলোমিটার।","केरल की वेम्बनाड झील भारत की सबसे लंबी झील है, जिसकी लंबाई लगभग 96 किलोमीटर है।","Kerala's Vembanad Lake is India's longest lake, stretching nearly 96 km."],["geo","জম্মু ও কাশ্মীরের উলার হ্রদ ভারতের বৃহত্তম মিষ্টি জলের হ্রদগুলির একটি।","जम्मू और कश्मीर की वुलर झील भारत की सबसे बड़ी मीठे पानी की झीलों में से एक है।","Wular Lake in Jammu & Kashmir is one of India's largest freshwater lakes."],["geo","নর্মদা ও তাপ্তি নদী ভারতের অধিকাংশ বড় নদীর বিপরীতে পূর্ব থেকে পশ্চিমে প্রবাহিত হয়ে আরব সাগরে মিশেছে।","नर्मदा और ताप्ती नदियाँ अधिकांश बड़ी नदियों के विपरीत पूर्व से पश्चिम बहकर अरब सागर में गिरती हैं।","Unlike most major Indian rivers, the Narmada and Tapi flow westward into the Arabian Sea."],["geo","গঙ্গা ও ব্রহ্মপুত্রের মোহনায় গড়ে ওঠা সুন্দরবন ব-দ্বীপ বিশ্বের বৃহত্তম ব-দ্বীপ ও ম্যানগ্রোভ অরণ্য।","गंगा और ब्रह्मपुत्र के मुहाने पर बना सुंदरबन डेल्टा दुनिया का सबसे बड़ा डेल्टा और मैंग्रोव वन है।","The Ganga-Brahmaputra Sundarbans forms the largest river delta and mangrove forest on Earth."],["geo","উত্তরাখণ্ডের দেবপ্রয়াগে অলকানন্দা ও ভাগীরথী নদীর মিলনের পর নদীটির নাম হয় গঙ্গা।","उत्तराखंड के देवप्रयाग में अलकनंदा और भागीरथी के संगम के बाद नदी का नाम गंगा पड़ता है।","The Alaknanda and Bhagirathi rivers meet at Devprayag in Uttarakhand to form the Ganga."],["geo","ভারতের পূর্বতম প্রান্ত অরুণাচল প্রদেশের কিবিথু এবং পশ্চিমতম প্রান্ত গুজরাতের গুহার মোতি।","भारत का सबसे पूर्वी बिंदु अरुणाचल का किबिथू और सबसे पश्चिमी बिंदु गुजरात का गुहार मोती है।","India's easternmost village is Kibithu (Arunachal Pradesh) and westernmost is Guhar Moti (Gujarat)."],["geo","লাদাখের উমলিং লা গিরিপথ (১৯,০০০ ফুটের বেশি উঁচু) বিশ্বের অন্যতম সর্বোচ্চ মোটরযোগ্য সড়ক।","लद्दाख का उमलिंग ला दर्रा (19,000 फ़ीट से अधिक ऊँचा) दुनिया की सबसे ऊँची मोटर-योग्य सड़कों में है।","Ladakh's Umling La pass (over 19,000 ft) features one of the highest motorable roads in the world."],["geo","উত্তর-পূর্ব ভারতের ৭টি রাজ্য (অসম, অরুণাচল, মণিপুর, মেঘালয়, মিজোরাম, নাগাল্যান্ড, ত্রিপুরা) \"সেভেন সিস্টার্স\" নামে পরিচিত।","पूर्वोत्तर के 7 राज्य (असम, अरुणाचल, मणिपुर, मेघालय, मिज़ोरम, नागालैंड, त्रिपुरा) \"सेवन सिस्टर्स\" कहलाते हैं।","The seven contiguous states of Northeast India are popularly called the \"Seven Sisters\"."],["geo","উত্তরপ্রদেশ মোট ৮টি রাজ্য ও ১টি কেন্দ্রশাসিত অঞ্চলের (দিল্লি) সঙ্গে সীমান্ত ভাগ করে — যা ভারতে সর্বাধিক।","उत्तर प्रदेश 8 राज्यों और 1 केंद्रशासित प्रदेश (दिल्ली) के साथ सीमा साझा करता है — जो भारत में सर्वाधिक है।","Uttar Pradesh borders 8 states and 1 union territory (Delhi), the most of any Indian state."],["geo","উত্তরাখণ্ডের নন্দাদেবী (৭,৮১৬ মিটার) সম্পূর্ণভাবে ভারতের ভূখণ্ডের ভেতরে অবস্থিত সর্বোচ্চ পর্বতশৃঙ্গ।","उत्तराखंड का नंदा देवी (7,816 मीटर) पूरी तरह भारत की सीमा के भीतर स्थित सबसे ऊँचा पर्वत शिखर है।","Nanda Devi (7,816 m) in Uttarakhand is the highest peak located entirely within India."],["hist","ভারত ১৫ আগস্ট ১৯৪৭ সালে স্বাধীনতা লাভ করে এবং ২৬ জানুয়ারি ১৯৫০ সালে প্রজাতন্ত্র হয়।","भारत 15 अगस्त 1947 को आज़ाद हुआ और 26 जनवरी 1950 को गणराज्य बना।","India gained independence on 15 August 1947 and became a republic on 26 January 1950."],["hist","ভারতের প্রথম প্রধানমন্ত্রী ছিলেন জওহরলাল নেহরু, আর প্রথম নারী প্রধানমন্ত্রী ইন্দিরা গান্ধী।","भारत के पहले प्रधानमंत्री जवाहरलाल नेहरू थे, और पहली महिला प्रधानमंत्री इंदिरा गांधी।","India's first Prime Minister was Jawaharlal Nehru, and the first woman Prime Minister was Indira Gandhi."],["hist","ড. রাজেন্দ্র প্রসাদ ছিলেন স্বাধীন ভারতের প্রথম রাষ্ট্রপতি, যিনি টানা দুই মেয়াদ দায়িত্ব পালন করেন।","डॉ. राजेंद्र प्रसाद स्वतंत्र भारत के पहले राष्ट्रपति थे, जिन्होंने लगातार दो कार्यकाल पूरे किए।","Dr. Rajendra Prasad was India's first President and the only one to serve two full consecutive terms."],["hist","বিহারের প্রাচীন নালন্দা মহাবিহার (খ্রিস্টীয় ৫ম শতাব্দী) ছিল বিশ্বের প্রাচীনতম আবাসিক বিশ্ববিদ্যালয়গুলির একটি।","बिहार का प्राचीन नालंदा महाविहार (5वीं शताब्दी ई.) दुनिया के सबसे पुराने आवासीय विश्वविद्यालयों में से था।","Ancient Nalanda Mahavihara in Bihar (5th century CE) was one of the world's earliest residential universities."],["hist","সিন্ধু সভ্যতার গুজরাতের লোথালে প্রায় ৪,৪০০ বছর আগের বিশ্বের প্রাচীনতম পরিচিত পোতাশ্রয় (ডকইয়ার্ড) পাওয়া গেছে।","सिंधु सभ्यता के गुजरात स्थित लोथल में लगभग 4,400 साल पुराना दुनिया का सबसे प्राचीन डॉकयार्ड मिला है।","Lothal in Gujarat preserves one of the world's earliest known tidal dockyards from the Indus Valley Civilization."],["hist","সম্রাট অশোকের সারনাথের সিংহস্তম্ভ থেকেই ভারতের জাতীয় প্রতীক নেওয়া হয়েছে।","सम्राट अशोक के सारनाथ स्थित सिंह स्तंभ से ही भारत का राष्ट्रीय प्रतीक लिया गया है।","India's State Emblem is adapted from Emperor Ashoka's Lion Capital at Sarnath."],["hist","১৬ এপ্রিল ১৮৫৩ সালে বম্বে (মুম্বই) থেকে থানে পর্যন্ত ৩৪ কিমি পথে ভারতের প্রথম যাত্রীবাহী ট্রেন চলে।","16 अप्रैल 1853 को बॉम्बे से ठाणे के बीच 34 किमी मार्ग पर भारत की पहली यात्री ट्रेन चली थी।","India's first passenger train ran 34 km from Bombay (Mumbai) to Thane on 16 April 1853."],["hist","১৭৮০ সালে কলকাতা থেকে প্রকাশিত \"হিকিস বেঙ্গল গেজেট\" ছিল ভারতের প্রথম মুদ্রিত সংবাদপত্র।","1780 में कोलकाता से प्रकाशित \"हिकीज़ बंगाल गज़ट\" भारत का पहला मुद्रित समाचार-पत्र था।","Hicky's Bengal Gazette, published from Kolkata in 1780, was India's first printed newspaper."],["hist","১৯১৩ সালে রবীন্দ্রনাথ ঠাকুর \"গীতাঞ্জলি\"-র জন্য এশিয়ার প্রথম ব্যক্তি হিসেবে সাহিত্যে নোবেল পুরস্কার পান।","1913 में रवींद्रनाथ टैगोर \"गीतांजलि\" के लिए साहित्य का नोबेल पुरस्कार पाने वाले पहले एशियाई बने।","In 1913, Rabindranath Tagore became the first Asian Nobel laureate for Gitanjali."],["hist","রবীন্দ্রনাথ ঠাকুরের লেখা গান দুটি দেশের জাতীয় সংগীত — ভারতের \"জন গণ মন\" ও বাংলাদেশের \"আমার সোনার বাংলা\"।","रवींद्रनाथ टैगोर के गीत दो देशों के राष्ट्रगान हैं — भारत का \"जन गण मन\" और बांग्लादेश का \"आमार सोनार बांग्ला\"।","Rabindranath Tagore authored the national anthems of two nations: India and Bangladesh."],["hist","ভারতের জাতীয় সংগীত \"জন গণ মন\" প্রথম গাওয়া হয় ২৭ ডিসেম্বর ১৯১১ সালে কলকাতায়।","भारत का राष्ट्रगान \"जन गण मन\" पहली बार 27 दिसंबर 1911 को कोलकाता में गाया गया था।","India's national anthem \"Jana Gana Mana\" was first sung on 27 December 1911 in Kolkata."],["hist","১৮৫৭ সালের মহাবিদ্রোহ শুরু হয়েছিল ১০ মে মীরাট থেকে, যা প্রথম স্বাধীনতা সংগ্রাম নামেও পরিচিত।","1857 का विद्रोह 10 मई को मेरठ से शुरू हुआ था, जिसे प्रथम स्वतंत्रता संग्राम भी कहा जाता है।","The Revolt of 1857 began on 10 May in Meerut and is widely remembered as the First War of Independence."],["hist","মহাত্মা গান্ধী ১২ মার্চ ১৯৩০ সালে সবরমতী আশ্রম থেকে ডান্ডি পর্যন্ত ৩৮৫ কিমি লবণ সত্যাগ্রহ যাত্রা শুরু করেন।","महात्मा गांधी ने 12 मार्च 1930 को साबरमती आश्रम से दांडी तक नमक सत्याग्रह यात्रा शुरू की थी।","Mahatma Gandhi launched the historic Dandi Salt March from Sabarmati Ashram on 12 March 1930."],["hist","১৯১৯ সালের ১৩ এপ্রিল অমৃতসরের জালিয়ানওয়ালাবাগ হত্যাকাণ্ডের প্রতিবাদে রবীন্দ্রনাথ নাইটহুড ত্যাগ করেন।","13 अप्रैल 1919 के जलियांवाला बाग हत्याकांड के विरोध में रवींद्रनाथ टैगोर ने नाइटहुड की उपाधि लौटा दी थी।","Rabindranath Tagore renounced his knighthood in protest against the 1919 Jallianwala Bagh massacre."],["hist","১৯৩১ সালে মুক্তিপ্রাপ্ত \"আলম আরা\" ছিল ভারতের প্রথম সবাক চলচ্চিত্র।","1931 में रिलीज़ हुई \"आलम आरा\" भारत की पहली बोलती फ़िल्म थी।","\"Alam Ara\" (1931) was India's first talking (sound) feature film."],["hist","১৯১৩ সালে দাদাসাহেব ফালকে নির্মিত \"রাজা হরিশ্চন্দ্র\" ছিল ভারতের প্রথম পূর্ণদৈর্ঘ্য নির্বাক চলচ্চিত্র।","1913 में दादासाहब फाल्के द्वारा निर्मित \"राजा हरिश्चंद्र\" भारत की पहली पूर्ण लंबाई की मूक फ़िल्म थी।","Dadasaheb Phalke's \"Raja Harishchandra\" (1913) was India's first full-length silent feature film."],["hist","১৭৫৭ সালের ২৩ জুন পলাশীর যুদ্ধ বাংলা ও ভারতে ব্রিটিশ শাসনের ভিত্তি স্থাপন করেছিল।","23 जून 1757 का प्लासी का युद्ध भारत में ब्रिटिश शासन की नींव बना था।","The Battle of Plassey on 23 June 1757 laid the foundation of British rule in India."],["hist","দিল্লির কুতুব মিনার চত্বরে অবস্থিত প্রায় ১,৬০০ বছর পুরনো লৌহস্তম্ভটি আজও প্রায় মরিচামুক্ত।","दिल्ली के क़ुतुब मीनार परिसर में स्थित लगभग 1,600 साल पुराना लौह स्तंभ आज भी लगभग जंग-रहित है।","Delhi's 1,600-year-old Iron Pillar at the Qutub complex has remarkably resisted rust for centuries."],["hist","তামিলনাডুর বৃহদীশ্বর মন্দির (তাঞ্জাভুর) ১০১০ খ্রিস্টাব্দে চোল সম্রাট প্রথম রাজরাজ গ্রানাইট পাথরে নির্মাণ করেন।","तमिलनाडु का बृहदीश्वर मंदिर (तंजावुर) 1010 ई. में चोल सम्राट राजराज प्रथम ने ग्रेनाइट से बनवाया था।","The Brihadisvara Temple at Thanjavur was completed in 1010 CE by Chola Emperor Rajaraja I entirely in granite."],["hist","১৮১৪ সালে কলকাতায় স্থাপিত ভারতীয় জাদুঘর (Indian Museum) এশিয়ার প্রাচীনতম জাদুঘরগুলির একটি।","1814 में कोलकाता में स्थापित भारतीय संग्रहालय (Indian Museum) एशिया के सबसे पुराने संग्रहालयों में से एक है।","Founded in Kolkata in 1814, the Indian Museum is one of the oldest museums in Asia."],["hist","স্বাধীনতার পর ৫৬০টিরও বেশি দেশীয় রাজ্যকে ভারতের সঙ্গে একত্রিত করার প্রধান কারিগর ছিলেন সর্দার বল্লভভাই প্যাটেল।","आज़ादी के बाद 560 से अधिक रियासतों का भारत में विलय कराने में सरदार वल्लभभाई पटेल की प्रमुख भूमिका थी।","Sardar Vallabhbhai Patel spearheaded the integration of over 560 princely states into independent India."],["hist","১৯৬১ সালের ১৯ ডিসেম্বর \"অপারেশন বিজয়\"-এর মাধ্যমে গোয়া, দমন ও দিউ পর্তুগিজ শাসন থেকে মুক্ত হয়।","19 दिसंबर 1961 को \"ऑपरेशन विजय\" के ज़रिए गोवा, दमन और दीव पुर्तगाली शासन से मुक्त हुए।","Goa, Daman and Diu were liberated from Portuguese rule on 19 December 1961 via Operation Vijay."],["hist","প্রাচীন ভারতের \"অর্থশাস্ত্র\" গ্রন্থটি রাষ্ট্রনীতি ও অর্থনীতির ওপর কৌটিল্য (চাণক্য) রচনা করেন।","प्राचीन भारत का प्रसिद्ध ग्रंथ \"अर्थशास्त्र\" राजव्यवस्था और अर्थनीति पर कौटिल्य (चाणक्य) ने लिखा था।","The ancient treatise Arthashastra on statecraft and economics was authored by Kautilya (Chanakya)."],["hist","ভারতের প্রথম নারী রাজ্যপাল ছিলেন সরোজিনী নাইডু (উত্তর প্রদেশ) এবং প্রথম নারী মুখ্যমন্ত্রী সুচেতা কৃপালনি।","भारत की पहली महिला राज्यपाल सरोजिनी नायडू (उ.प्र.) और पहली महिला मुख्यमंत्री सुचेता कृपलानी थीं।","Sarojini Naidu was India's first woman Governor and Sucheta Kripalani was the first woman Chief Minister."],["hist","১৯২১ সালে হরপ্পা ও ১৯২২ সালে মহেঞ্জোদারো খননের মাধ্যমে প্রাচীন সিন্ধু সভ্যতা বিশ্ববাসীর সামনে আসে।","1921 में हड़प्पा और 1922 में मोहनजोदड़ो की खुदाई से प्राचीन सिंधु घाटी सभ्यता दुनिया के सामने आई।","Excavations at Harappa (1921) and Mohenjo-daro (1922) unveiled the ancient Indus Valley Civilization."],["sci","২৩ আগস্ট ২০২৩ সালে চন্দ্রযান-৩ চাঁদের দক্ষিণ মেরুর কাছে সফল অবতরণ করে; ভারত প্রথম দেশ হিসেবে এই কীর্তি গড়ে।","23 अगस्त 2023 को चंद्रयान-3 चाँद के दक्षिणी ध्रुव के पास उतरा; ऐसा करने वाला भारत पहला देश बना।","On 23 August 2023, Chandrayaan-3 made India the first nation to land near the lunar south pole."],["sci","চন্দ্রযান-৩-এর ঐতিহাসিক সাফল্যের স্মরণে ২৩ আগস্ট ভারতে \"জাতীয় মহাকাশ দিবস\" পালিত হয়।","चंद्रयान-3 की ऐतिहासिक सफलता की याद में 23 अगस्त को भारत में \"राष्ट्रीय अंतरिक्ष दिवस\" मनाया जाता है।","India celebrates 23 August as National Space Day to commemorate the Chandrayaan-3 landing."],["sci","১৯ এপ্রিল ১৯৭৫ সালে উৎক্ষেপিত \"আর্যভট্ট\" ছিল ভারতের প্রথম কৃত্রিম উপগ্রহ।","19 अप्रैल 1975 को प्रक्षेपित \"आर्यभट्ट\" भारत का पहला कृत्रिम उपग्रह था।","\"Aryabhata\", launched on 19 April 1975, was India's first artificial satellite."],["sci","২০১৪ সালে মঙ্গলযান (MOM) মিশনের মাধ্যমে ভারত প্রথম প্রচেষ্টাতেই মঙ্গল গ্রহের কক্ষপথে পৌঁছানো প্রথম দেশ হয়।","2014 में मंगलयान (MOM) के साथ भारत पहले ही प्रयास में मंगल की कक्षा में पहुँचने वाला पहला देश बना।","With Mangalyaan (2014), India became the first nation to reach Mars orbit on its maiden attempt."],["sci","২০০৮ সালে ভারতের চন্দ্রযান-১ মিশন চাঁদের পৃষ্ঠে জলের অণুর অস্তিত্ব নিশ্চিত করতে গুরুত্বপূর্ণ ভূমিকা রাখে।","2008 में भारत के चंद्रयान-1 मिशन ने चाँद की सतह पर पानी के अणुओं की पुष्टि में अहम भूमिका निभाई।","India's Chandrayaan-1 (2008) played a pivotal role in confirming water molecules on the Moon."],["sci","আদিত্য-এল১ হলো সূর্য পর্যবেক্ষণের জন্য ভারতের প্রথম মহাকাশযান, যা পৃথিবী থেকে ১৫ লক্ষ কিমি দূরে এল১ বিন্দুতে অবস্থিত।","आदित्य-एल1 सूर्य के अध्ययन के लिए भारत का पहला अंतरिक्ष मिशन है, जो पृथ्वी से 15 लाख किमी दूर एल1 बिंदु पर स्थित है।","Aditya-L1 is India's first solar observatory, stationed at the L1 point 1.5 million km from Earth."],["sci","২০১৭ সালে ইসরোর PSLV-C37 রকেট এক অভিযানে ১০৪টি উপগ্রহ উৎক্ষেপণ করে বিশ্বরেকর্ড গড়েছিল।","2017 में इसरो के PSLV-C37 रॉकेट ने एक साथ 104 उपग्रह प्रक्षेपित कर विश्व रिकॉर्ड बनाया था।","In 2017, ISRO's PSLV-C37 set a world record at the time by launching 104 satellites on a single flight."],["sci","১৯৩০ সালে \"রমন ক্রিয়া\" আবিষ্কারের জন্য সি. ভি. রমন পদার্থবিজ্ঞানে নোবেল পান; ২৮ ফেব্রুয়ারি তাই জাতীয় বিজ্ঞান দিবস।","1930 में \"रमन प्रभाव\" की खोज के लिए सी. वी. रमन को नोबेल मिला; 28 फ़रवरी को राष्ट्रीय विज्ञान दिवस मनाया जाता है।","C. V. Raman won the 1930 Physics Nobel for the Raman Effect; 28 February is National Science Day."],["sci","শূন্য (০) এবং দশমিক স্থানমান পদ্ধতির গাণিতিক নিয়ম প্রাচীন ভারতে আর্যভট্ট ও ব্রহ্মগুপ্ত সুসংবদ্ধ করেন।","शून्य (0) और दशमलव स्थान-मान प्रणाली के गणितीय नियम प्राचीन भारत में आर्यभट्ट व ब्रह्मगुप्त ने सुव्यवस्थित किए।","Zero and the decimal place-value system were formalised in ancient India by Aryabhata and Brahmagupta."],["sci","প্রাচীন ভারতের চিকিৎসক সুশ্রুতকে শল্যচিকিৎসা ও প্লাস্টিক সার্জারির অন্যতম আদি প্রবক্তা হিসেবে গণ্য করা হয়।","प्राचीन भारत के चिकित्सक सुश्रुत को शल्य चिकित्सा और प्लास्टिक सर्जरी का आदि प्रवर्तक माना जाता है।","Ancient Indian physician Sushruta is widely regarded as a pioneer of surgery and reconstructive procedures."],["sci","আচার্য জগদীশ চন্দ্র বসু ১৮৯৫ সালে কলকাতায় বেতার তরঙ্গ (মাইক্রোওয়েভ) প্রেরণ প্রদর্শন ও ক্রেস্কোগ্রাফ উদ্ভাবন করেন।","जगदीश चंद्र बसु ने 1895 में कोलकाता में माइक्रोवेव रेडियो तरंगों का प्रदर्शन किया और क्रेस्कोग्राफ़ बनाया।","Jagadish Chandra Bose demonstrated millimetre radio waves in Kolkata in 1895 and invented the crescograph."],["sci","সত্যেন্দ্রনাথ বসুর নামানুসারে কোয়ান্টাম পদার্থবিজ্ঞানের কণার শ্রেণি \"বোসন\" (Boson)-এর নামকরণ হয়েছে।","सत्येंद्र नाथ बोस के नाम पर क्वांटम भौतिकी के कणों की श्रेणी \"बोसॉन\" (Boson) का नाम रखा गया है।","The class of subatomic particles called \"bosons\" is named after Indian physicist Satyendra Nath Bose."],["sci","মহান গণিতবিদ শ্রীনিবাস রামানুজনের জন্মদিন ২২ ডিসেম্বর ভারতে \"জাতীয় গণিত দিবস\" হিসেবে পালিত হয়।","महान गणितज्ञ श्रीनिवास रामानुजन के जन्मदिन 22 दिसंबर को भारत में \"राष्ट्रीय गणित दिवस\" मनाया जाता है।","Srinivasa Ramanujan's birthday, 22 December, is observed across India as National Mathematics Day."],["sci","১৯৯১ সালে পুনের C-DAC তৈরি করে \"PARAM 8000\", যা ছিল ভারতের প্রথম দেশীয় সুপারকম্পিউটার।","1991 में पुणे की C-DAC ने \"परम 8000\" बनाया, जो भारत का पहला स्वदेशी सुपरकंप्यूटर था।","Developed by C-DAC Pune in 1991, PARAM 8000 was India's first indigenously built supercomputer."],["sci","ইসরো (ISRO) প্রতিষ্ঠিত হয় ১৫ আগস্ট ১৯৬৯ সালে, এর প্রথম চেয়ারম্যান ছিলেন ড. বিক্রম সারাভাই।","इसरो (ISRO) की स्थापना 15 अगस्त 1969 को हुई थी और इसके पहले अध्यक्ष डॉ. विक्रम साराभाई थे।","ISRO was founded on 15 August 1969 with Dr. Vikram Sarabhai as its first Chairman."],["sci","১৯৮৪ সালের ৩ এপ্রিল উইং কমান্ডার রাকেশ শর্মা মহাকাশে যাওয়া প্রথম ভারতীয় নাগরিক হন।","3 अप्रैल 1984 को विंग कमांडर राकेश शर्मा अंतरिक्ष में जाने वाले पहले भारतीय नागरिक बने।","On 3 April 1984, Rakesh Sharma became the first Indian citizen to travel into space."],["sci","ভারতীয় বংশোদ্ভূত প্রথম নারী মহাকাশচারী কল্পনা চাওলা ১৯৯৭ সালে নাসার কলম্বিয়া মহাকাশযানে পাড়ি দেন।","भारत में जन्मी पहली महिला अंतरिक्ष यात्री कल्पना चावला 1997 में नासा के कोलंबिया यान से अंतरिक्ष गईं।","Kalpana Chawla became the first woman of Indian origin in space aboard NASA's Columbia in 1997."],["sci","ভারত অ্যান্টার্কটিকায় দক্ষিণ গঙ্গোত্রী, মৈত্রী ও ভারতী নামে তিনটি স্থায়ী বৈজ্ঞানিক গবেষণা কেন্দ্র স্থাপন করেছে।","भारत ने अंटार्कटिका में दक्षिण गंगोत्री, मैत्री और भारती नाम से तीन वैज्ञानिक शोध केंद्र स्थापित किए हैं।","India has established three Antarctic research stations: Dakshin Gangotri, Maitri and Bharati."],["sci","অন্ধ্র প্রদেশের শ্রীহরিকোটায় অবস্থিত সতীশ ধাওয়ান মহাকাশ কেন্দ্র ভারতের প্রধান রকেট উৎক্ষেপণ ঘাঁটি।","आंध्र प्रदेश के श्रीहरिकोटा में स्थित सतीश धवन अंतरिक्ष केंद्र भारत का प्रमुख रॉकेट प्रक्षेपण केंद्र है।","Satish Dhawan Space Centre at Sriharikota, Andhra Pradesh, is India's primary rocket launchport."],["sci","ড. এ. পি. জে. আব্দুল কালাম দেশীয় ক্ষেপণাস্ত্র ও মহাকাশ উৎক্ষেপণ যানে অবদানের জন্য \"মিসাইল ম্যান\" নামে পরিচিত।","डॉ. ए. पी. जे. अब्दुल कलाम स्वदेशी मिसाइल और प्रक्षेपण यान में योगदान के लिए \"मिसाइल मैन\" कहलाते हैं।","Dr. A. P. J. Abdul Kalam is known as India's \"Missile Man\" for his leadership in launch vehicles and missiles."],["sci","ভারত বিশ্বের বৃহত্তম ভ্যাকসিন উৎপাদনকারী দেশ, যা বৈশ্বিক টিকার বড় একটি অংশ সরবরাহ করে।","भारत दुनिया का सबसे बड़ा वैक्सीन उत्पादक देश है, जो वैश्विक टीकों का बड़ा हिस्सा आपूर्ति करता है।","India is the world's largest vaccine manufacturer, supplying a major share of global immunisation doses."],["sci","ডিজিটাল পেমেন্ট ব্যবস্থা UPI বিশ্বের দ্রুততম ও বৃহত্তম রিয়েল-টাইম পেমেন্ট নেটওয়ার্কগুলির একটি।","भारत की डिजिटल भुगतान प्रणाली UPI दुनिया के सबसे बड़े रियल-टाइम पेमेंट नेटवर्क में से एक है।","India's Unified Payments Interface (UPI) is among the largest real-time digital payment networks globally."],["sci","লাদাখের হানলেতে অবস্থিত ইন্ডিয়ান অ্যাস্ট্রোনমিক্যাল অবজারভেটরি বিশ্বের সর্বোচ্চ মহাকাশ পর্যবেক্ষণ কেন্দ্রগুলির একটি।","लद्दाख के हानले में स्थित इंडियन एस्ट्रोनॉमिकल ऑब्ज़र्वेटरी दुनिया की सबसे ऊँची वेधशालाओं में से एक है।","The Indian Astronomical Observatory at Hanle, Ladakh, is one of the highest observatories in the world."],["sci","অ্যাস্ট্রোস্যাট (AstroSat, ২০১৫) ছিল মহাকাশ গবেষণার জন্য ভারতের প্রথম বহুতরঙ্গদৈর্ঘ্য বিশিষ্ট মহাকাশ দূরবীন।","एस्ट्रोसैट (2015) खगोल विज्ञान के अध्ययन के लिए भारत की पहली बहु-तरंगदैर्ध्य अंतरिक्ष वेधशाला थी।","AstroSat (2015) was India's first dedicated multi-wavelength space astronomy observatory."],["sci","মুম্বইয়ের ট্রম্বেতে ১৯৫৬ সালে চালু হওয়া \"অপ্সরা\" ছিল এশিয়ার প্রথম পারমাণবিক গবেষণা চুল্লি।","मुंबई के ट्रॉम्बे में 1956 में शुरू हुआ \"अप्सरा\" एशिया का पहला परमाणु अनुसंधान रिएक्टर था।","Apsara, commissioned in Mumbai in 1956, was Asia's first nuclear research reactor."],["sci","ভারতের নিজস্ব আঞ্চলিক স্যাটেলাইট নেভিগেশন সিস্টেমের নাম \"NavIC\" (IRNSS), যা ইসরো তৈরি করেছে।","भारत की स्वदेशी क्षेत्रीय उपग्रह नेविगेशन प्रणाली का नाम \"NavIC\" (IRNSS) है, जिसे इसरो ने बनाया है।","NavIC (IRNSS) is India's indigenous regional satellite navigation system developed by ISRO."],["sci","ভারতীয় বংশোদ্ভূত হর গোবিন্দ খোরানা (১৯৬৮) জেনেটিক কোড ব্যাখ্যার জন্য চিকিৎসাবিজ্ঞানে নোবেল পুরস্কার পান।","भारतीय मूल के हर गोबिंद खुराना ने 1968 में जेनेटिक कोड की व्याख्या के लिए चिकित्सा का नोबेल जीता।","Indian-born biochemist Har Gobind Khorana won the 1968 Nobel Prize in Medicine for deciphering the genetic code."],["cul","দাবা খেলার আদি রূপ \"চতুরঙ্গ\" প্রায় দেড় হাজার বছর আগে গুপ্ত যুগের ভারতে উদ্ভূত হয়েছিল।","शतरंज का आदि रूप \"चतुरंग\" लगभग डेढ़ हज़ार साल पहले गुप्त काल के भारत में विकसित हुआ था।","Chess originated in Gupta-era India around 1,500 years ago as the strategy game \"Chaturanga\"."],["cul","সাপ-লুডো (Snakes & Ladders) খেলাটির উৎপত্তি প্রাচীন ভারতের \"মোক্ষপটম\" খেলা থেকে।","साँप-सीढ़ी का खेल प्राचीन भारत के \"मोक्षपटम\" खेल से उत्पन्न हुआ था।","The board game Snakes and Ladders evolved from the ancient Indian game Moksha Patam."],["cul","ভারতে ৪০টিরও বেশি ইউনেস্কো বিশ্ব ঐতিহ্যবাহী স্থান রয়েছে, যা বিশ্বের শীর্ষ দেশগুলোর একটি।","भारत में 40 से अधिक यूनेस्को विश्व धरोहर स्थल हैं, जो दुनिया के शीर्ष देशों में शामिल है।","India is home to over 40 UNESCO World Heritage Sites, ranking among the highest in the world."],["cul","সংগীত নাটক অকাদেমি ভারতের ৮টি শাস্ত্রীয় নৃত্যধারাকে স্বীকৃতি দেয় — ভরতনাট্যম, কত্থক, কথাকলি, কুচিপুড়ি, ওড়িশি, মণিপুরী, মোহিনীঅট্টম ও সত্রিয়া।","संगीत नाटक अकादमी भारत के 8 शास्त्रीय नृत्यों को मान्यता देती है — भरतनाट्यम, कथक, कथकली, कुचिपुड़ी, ओडिसी, मणिपुरी, मोहिनीअट्टम व सत्त्रिया।","The Sangeet Natak Akademi recognises 8 Indian classical dances: Bharatanatyam, Kathak, Kathakali, Kuchipudi, Odissi, Manipuri, Mohiniyattam and Sattriya."],["cul","ভারত সরকারের স্বীকৃত ধ্রুপদী (Classical) ভাষার সংখ্যা এখন ১১টি — যার মধ্যে বাংলা, অসমিয়া, মারাঠি, পালি ও প্রাকৃত ২০২৪ সালে যুক্ত হয়।","भारत सरकार द्वारा मान्यता-प्राप्त शास्त्रीय भाषाएँ अब 11 हैं — 2024 में बांग्ला, असमिया, मराठी, पाली और प्राकृत जुड़ीं।","India now recognises 11 Classical Languages, including Bengali, Assamese, Marathi, Pali and Prakrit added in 2024."],["cul","তামিল বিশ্বের প্রাচীনতম জীবিত ধ্রুপদী ভাষাগুলির একটি, যার সাহিত্যিক ইতিহাস দুই হাজার বছরেরও বেশি পুরনো।","तमिल दुनिया की सबसे पुरानी जीवित शास्त्रीय भाषाओं में से है, जिसका साहित्यिक इतिहास 2,000 वर्ष से अधिक पुराना है।","Tamil is one of the world's oldest surviving classical languages, with over 2,000 years of recorded literature."],["cul","প্রয়াগরাজ, হরিদ্বার, উজ্জয়িনী ও নাসিকে আয়োজিত কুম্ভমেলা বিশ্বের বৃহত্তম শান্তিপূর্ণ জনসমাগম।","प्रयागराज, हरिद्वार, उज्जैन और नासिक में लगने वाला कुंभ मेला दुनिया का सबसे बड़ा शांतिपूर्ण जनसमूह है।","The Kumbh Mela is the largest peaceful human gathering on Earth."],["cul","জাতিসংঘ ২১ জুনকে \"আন্তর্জাতিক যোগ দিবস\" ঘোষণা করেছে; যোগের উৎপত্তি প্রাচীন ভারতে।","संयुक्त राष्ट्र ने 21 जून को \"अंतर्राष्ट्रीय योग दिवस\" घोषित किया है; योग का उद्गम प्राचीन भारत में हुआ।","The UN declared 21 June as International Day of Yoga, celebrating the ancient Indian discipline."],["cul","ভারত বিশ্বের বৃহত্তম চলচ্চিত্র নির্মাতা দেশ — হিন্দি, তামিল, তেলুগু, বাংলা, মালয়ালম ও কন্নড়-সহ বহু ভাষায় সিনেমা তৈরি হয়।","भारत दुनिया का सबसे बड़ा फ़िल्म निर्माता देश है — हिंदी, तमिल, तेलुगु, बांग्ला, मलयालम व कन्नड़ समेत कई भाषाओं में फ़िल्में बनती हैं।","India is the world's largest producer of feature films across Hindi, Tamil, Telugu, Bengali, Malayalam, Kannada and more."],["cul","মহারাষ্ট্রের ইলোরার কৈলাস মন্দির (গুহা ১৬) একটিমাত্র বিশাল পাহাড় ওপর থেকে নিচে কেটে নির্মিত বিশ্বের বৃহত্তম একশিলা স্থাপত্য।","महाराष्ट्र के एलोरा का कैलास मंदिर एक ही विशाल चट्टान को ऊपर से नीचे काटकर बनाई गई दुनिया की सबसे बड़ी एकाश्म संरचना है।","Ellora's Kailasa Temple in Maharashtra is the world's largest monolithic structure carved top-down from a single rock."],["cul","আগ্রার তাজমহল মুঘল সম্রাট শাহজাহান ১৬৩২–১৬৫৩ সালের মধ্যে সাদা মকরানা মার্বেল দিয়ে নির্মাণ করেন।","आगरा का ताजमहल मुग़ल सम्राट शाहजहाँ ने 1632–1653 के बीच सफ़ेद मकराना संगमरमर से बनवाया था।","The Taj Mahal in Agra was built between 1632 and 1653 in white Makrana marble by Emperor Shah Jahan."],["cul","পশ্চিমবঙ্গের দুর্গাপূজা ২০২১ সালে ইউনেস্কোর \"অধরা সাংস্কৃতিক ঐতিহ্য\" (Intangible Cultural Heritage) তালিকায় স্থান পায়।","पश्चिम बंगाल की दुर्गा पूजा को 2021 में यूनेस्को की \"अमूर्त सांस्कृतिक विरासत\" सूची में शामिल किया गया।","Kolkata's Durga Puja was inscribed on UNESCO's Intangible Cultural Heritage list in 2021."],["cul","গুজরাতের গরবা নৃত্য ২০২৩ সালে ইউনেস্কোর অধরা সাংস্কৃতিক ঐতিহ্যের স্বীকৃতি লাভ করে।","गुजरात के गरबा नृत्य को 2023 में यूनेस्को की अमूर्त सांस्कृतिक विरासत का दर्जा मिला।","Gujarat's Garba dance was added to UNESCO's Intangible Cultural Heritage list in 2023."],["cul","মহাভারত প্রায় এক লক্ষ শ্লোক নিয়ে বিশ্বের দীর্ঘতম মহাকাব্য হিসেবে পরিচিত।","महाभारत लगभग एक लाख श्लोकों के साथ दुनिया का सबसे लंबा महाकाव्य माना जाता है।","With roughly 100,000 verses, the Mahabharata is the longest epic poem in world literature."],["cul","ওডিশার কোণার্কের সূর্য মন্দিরটি ১২ জোড়া বিশাল পাথরের চাকা-সহ সূর্যের রথের আদলে নির্মিত।","ओडिशा का कोणार्क सूर्य मंदिर 12 जोड़ी विशाल पत्थर के पहियों वाले सूर्य के रथ के रूप में बना है।","Odisha's Konark Sun Temple is sculpted as a giant stone chariot with 12 pairs of carved wheels."],["cul","অমৃতসরের স্বর্ণমন্দিরের লঙ্গরখানায় প্রতিদিন বিনামূল্যে লক্ষাধিক মানুষকে খাবার পরিবেশন করা হয়।","अमृतसर के स्वर्ण मंदिर के लंगर में रोज़ाना बिना किसी भेदभाव के एक लाख से अधिक लोगों को निःशुल्क भोजन कराया जाता है।","The Golden Temple langar in Amritsar serves free meals to around 100,000 visitors every day."],["cul","পাণিনির রচিত \"অষ্টাধ্যায়ী\" সংস্কৃত ব্যাকরণের প্রাচীনতম ও অত্যন্ত বিজ্ঞানসম্মত গ্রন্থ হিসেবে বিশ্বখ্যাত।","पाणिनि रचित \"अष्टाध्यायी\" संस्कृत व्याकरण का प्राचीनतम और अत्यंत वैज्ञानिक ग्रंथ माना जाता है।","Panini's Ashtadhyayi is celebrated globally as a foundational scientific grammar of Sanskrit."],["cul","হিন্দুস্তানি (উত্তর ভারত) ও কর্ণাটকী (দক্ষিণ ভারত) — এই দুই ধারায় ভারতীয় শাস্ত্রীয় সংগীত বিকশিত হয়েছে।","हिंदुस्तानी (उत्तर भारत) और कर्नाटक (दक्षिण भारत) — इन दो परंपराओं में भारतीय शास्त्रीय संगीत विकसित हुआ।","Indian classical music flourishes in two great traditions: Hindustani in the north and Carnatic in the south."],["cul","ভারতের জাতীয় প্রতীকের নিচে খোদাই করা \"সত্যমেব জয়তে\" বাক্যাংশটি মুণ্ডক উপনিষদ থেকে নেওয়া।","भारत के राष्ट्रीय प्रतीक के नीचे लिखा \"सत्यमेव जयते\" वाक्य मुंडक उपनिषद से लिया गया है।","The national motto \"Satyameva Jayate\" (Truth Alone Triumphs) comes from the Mundaka Upanishad."],["cul","ভারতের সরকারি জাতীয় ক্যালেন্ডার হলো শকাব্দ (Saka Calendar), যা ২২ মার্চ ১৯৫৭ সালে গৃহীত হয়।","भारत का आधिकारिक राष्ट्रीय पंचांग शक संवत है, जिसे 22 मार्च 1957 को अपनाया गया था।","India's official civil calendar is the Saka Calendar, adopted on 22 March 1957."],["cul","মসলার দেশ হিসেবে পরিচিত ভারত বিশ্বের মোট মসলা উৎপাদনের বৃহত্তম অংশীদার।","मसालों की भूमि भारत दुनिया में मसालों का सबसे बड़ा उत्पादक और निर्यातक देश है।","Known as the land of spices, India is the world's largest producer and exporter of spices."],["cul","অজন্তার গুহাচিত্রগুলি খ্রিস্টপূর্ব ২য় শতাব্দী থেকে খ্রিস্টীয় ৫ম
