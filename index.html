েশের স্পিতির হিক্কিমে (১৪,৫৬৭ ফুট উঁচু) বিশ্বের সর্বোচ্চ পোস্ট অফিসগুলির একটি অবস্থিত।","हिमाचल प्रदेश के स्पीति स्थित हिक्किम में (14,567 फ़ीट ऊँचा) दुनिया के सबसे ऊँचे डाकघरों में से एक है।","Hikkim in Spiti Valley, Himachal Pradesh (14,567 ft), houses one of the world's highest post offices."],["eco","ভারতের মোট জনসংখ্যা এখন বিশ্বের মধ্যে সর্বাধিক — ১৪৭ কোটির বেশি।","भारत की कुल जनसंख्या अब दुनिया में सबसे अधिक है — 147 करोड़ से ज़्यादा।","India is the world's most populous country, with over 1.47 billion people."],["eco","কর্ণাটকের হুব্বাল্লি রেলওয়ে স্টেশনে বিশ্বের দীর্ঘতম রেলওয়ে প্ল্যাটফর্ম (১,৫০৭ মিটার) অবস্থিত।","कर्नाटक के हुब्बल्ली रेलवे स्टेशन पर दुनिया का सबसे लंबा रेलवे प्लेटफ़ॉर्म (1,507 मीटर) है।","Hubballi Junction in Karnataka has the world's longest railway platform at 1,507 metres."],["eco","জম্মু ও কাশ্মীরের চেনাব রেল সেতু নদীর তলদেশ থেকে ৩৫৯ মিটার উঁচু — এটি বিশ্বের সর্বোচ্চ রেলওয়ে আর্চ সেতু।","जम्मू-कश्मीर का चिनाब रेल पुल नदी तल से 359 मीटर ऊँचा है — यह दुनिया का सबसे ऊँचा रेलवे आर्च ब्रिज है।","The Chenab Rail Bridge in Jammu & Kashmir stands 359 m above the river, the world's highest railway arch bridge."],["eco","১৯৮৪ সালে চালু হওয়া কলকাতা মেট্রো ভারতের প্রথম ভূগর্ভস্থ মেট্রো রেল; ২০২৪ সালে হুগলি নদীর নিচে প্রথম আন্ডারওয়াটার মেট্রোও এখানেই চালু হয়।","1984 में शुरू हुई कोलकाता मेट्रो भारत की पहली मेट्रो सेवा थी; 2024 में देश की पहली अंडरवाटर मेट्रो भी हुगली नदी के नीचे यहीं चली।","Kolkata Metro (1984) was India's first metro rail, and in 2024 launched India's first underwater river metro under the Hooghly."],["eco","ভারতের রিজার্ভ ব্যাঙ্ক (RBI) প্রতিষ্ঠিত হয় ১ এপ্রিল ১৯৩৫ সালে কলকাতায়; পরে ১৯৩৭ সালে সদর দপ্তর মুম্বইয়ে যায়।","भारतीय रिज़र्व बैंक (RBI) की स्थापना 1 अप्रैल 1935 को कोलकाता में हुई थी; 1937 में मुख्यालय मुंबई गया।","The Reserve Bank of India was established on 1 April 1935 in Kolkata before moving its headquarters to Mumbai in 1937."],["eco","ভারতীয় রুপির প্রতীক \"₹\" নকশা করেছিলেন আইআইটি-র ডিজাইনার ডি. উদয় কুমার (২০১০ সালে গৃহীত)।","भारतीय रुपये का चिह्न \"₹\" डिज़ाइनर डी. उदय कुमार ने तैयार किया था (2010 में स्वीकृत)।","The Indian Rupee symbol \"₹\" was designed by D. Udaya Kumar and officially adopted in 2010."],["eco","১৮৭৫ সালে প্রতিষ্ঠিত বম্বে স্টক এক্সচেঞ্জ (BSE) এশিয়ার প্রাচীনতম স্টক এক্সচেঞ্জ।","1875 में स्थापित बॉम्बे स्टॉक एक्सचेंज (BSE) एशिया का सबसे पुराना स्टॉक एक्सचेंज है।","Founded in 1875, the Bombay Stock Exchange (BSE) is Asia's oldest stock exchange."],["eco","ভারতের সড়ক নেটওয়ার্ক ৬৬ লক্ষ কিলোমিটারেরও বেশি দীর্ঘ — যা বিশ্বের দ্বিতীয় বৃহত্তম।","भारत का सड़क नेटवर्क 66 लाख किलोमीटर से अधिक लंबा है — जो दुनिया में दूसरा सबसे बड़ा है।","India's road network spans over 6.6 million km, the second largest in the world."],["eco","শ্রীনগর থেকে কন্যাকুমারী পর্যন্ত বিস্তৃত NH-44 ভারতের দীর্ঘতম জাতীয় সড়ক (প্রায় ৩,৭৪৫ কিমি)।","श्रीनगर से कन्याकुमारी तक फैला NH-44 भारत का सबसे लंबा राष्ट्रीय राजमार्ग (लगभग 3,745 किमी) है।","NH-44, running from Srinagar to Kanyakumari (~3,745 km), is India's longest national highway."],["eco","ভারত বিশ্বের বৃহত্তম দুধ উৎপাদক দেশ — বৈশ্বিক দুধ উৎপাদনের প্রায় এক-চতুর্থাংশ ভারতেই হয়।","भारत दुनिया का सबसे बड़ा दूध उत्पादक देश है — वैश्विक दूध उत्पादन का लगभग एक-चौथाई भारत में होता है।","India is the world's largest milk producer, accounting for nearly a quarter of global output."],["eco","ডাল, পাট ও কলা উৎপাদনে ভারত বিশ্বে প্রথম স্থানে রয়েছে।","दालें, जूट और केले के उत्पादन में भारत दुनिया में पहले स्थान पर है।","India ranks first globally in the production of pulses, jute and bananas."],["eco","গুজরাতের সুরাট শহরে বিশ্বের বেশিরভাগ পালিশ করা হীরে কাটা ও মসৃণ করা হয়।","गुजरात के सूरत शहर में दुनिया के अधिकांश तराशे हुए हीरों की कटिंग और पॉलिशिंग होती है।","Surat in Gujarat cuts and polishes the vast majority of the world's diamonds."],["eco","অসমের ভূপেন হাজারিকা সেতু (ঢোলা-সাদিয়া, ৯.১৫ কিমি) ভারতের দীর্ঘতম নদী-সেতুগুলির অন্যতম।","असम का भूपेन हज़ारिका सेतु (ढोला-सदिया, 9.15 किमी) भारत के सबसे लंबे नदी पुलों में से है।","Assam's 9.15 km Bhupen Hazarika Setu (Dhola-Sadiya) is one of India's longest river bridges."],["eco","মুম্বই ট্রান্স হারবার লিংক (অটল সেতু, ২১.৮ কিমি) ভারতের দীর্ঘতম সমুদ্র-সেতু।","मुंबई ट्रांस हार्बर लिंक (अटल सेतु, 21.8 किमी) भारत का सबसे लंबा समुद्री पुल है।","The 21.8 km Mumbai Trans Harbour Link (Atal Setu) is India's longest sea bridge."],["eco","হিমাচল প্রদেশের অটল টানেল (৯.০২ কিমি) ১০,০০০ ফুটের বেশি উচ্চতায় বিশ্বের দীর্ঘতম হাইওয়ে সুড়ঙ্গ।","हिमाचल प्रदेश की अटल सुरंग (9.02 किमी) 10,000 फ़ीट से अधिक ऊँचाई पर दुनिया की सबसे लंबी राजमार्ग सुरंग है।","Himachal's 9.02 km Atal Tunnel is the world's longest highway tunnel above 10,000 feet."],["eco","ভারত বিশ্বের শীর্ষ নবায়নযোগ্য শক্তি (সৌর ও বায়ু) উৎপাদনকারী দেশগুলোর একটি।","भारत दुनिया के शीर्ष नवीकरणीय ऊर्जा (सौर व पवन) उत्पादक देशों में शामिल है।","India ranks among the world's top nations in installed renewable energy capacity."],["eco","কেরলের কোচিন আন্তর্জাতিক বিমানবন্দর বিশ্বের প্রথম সম্পূর্ণ সৌরশক্তিচালিত বিমানবন্দর।","केरल का कोचीन अंतर्राष्ट्रीय हवाई अड्डा दुनिया का पहला पूरी तरह सौर ऊर्जा से चलने वाला एयरपोर्ट है।","Cochin International Airport in Kerala was the world's first fully solar-powered airport."],["eco","প্রয়াগরাজ থেকে হলদিয়া পর্যন্ত বিস্তৃত জাতীয় জলপথ-১ (NW-1, ১,৬২০ কিমি) ভারতের দীর্ঘতম অভ্যন্তরীণ জলপথ।","प्रयागराज से हल्दिया तक फैला राष्ट्रीय जलमार्ग-1 (1,620 किमी) भारत का सबसे लंबा राष्ट्रीय जलमार्ग है।","National Waterway 1 (Prayagraj to Haldia, 1,620 km) is India's longest inland waterway."],["eco","বিশ্বের বৃহত্তম সমবায় দুগ্ধ বিপ্লব \"অপারেশন ফ্লাড\" (শ্বেত বিপ্লব)-এর জনক ছিলেন ড. ভার্গিস কুরিয়েন।","दुनिया की सबसे बड़ी डेयरी क्रांति \"ऑपरेशन फ़्लड\" (श्वेत क्रांति) के जनक डॉ. वर्गीज़ कुरियन थे।","Dr. Verghese Kurien spearheaded Operation Flood, the White Revolution that transformed Indian dairy."],["eco","কৃষিবিজ্ঞানী ড. এম. এস. স্বামীনাথনকে ভারতের \"সবুজ বিপ্লব\"-এর জনক বলা হয়।","कृषि वैज्ञानिक डॉ. एम. एस. स्वामीনাথन को भारत में \"हरित क्रांति\" का जनक कहा जाता है।","Agricultural scientist Dr. M. S. Swaminathan is known as the Father of India's Green Revolution."],["eco","দিল্লি মেট্রো ৩৯০ কিলোমিটারেরও বেশি নেটওয়ার্ক নিয়ে ভারতের বৃহত্তম মেট্রো রেল ব্যবস্থা।","दिल्ली मेट्रो 390 किमी से अधिक के नेटवर्क के साथ भारत की सबसे बड़ी मेट्रो रेल प्रणाली है।","Spanning over 390 km, the Delhi Metro is India's largest rapid transit network."],["nat","বিশ্বের একমাত্র দেশ ভারত, যেখানে প্রাকৃতিক পরিবেশে বাঘ ও সিংহ—দুটি প্রাণীই একসঙ্গে বসবাস করে।","भारत दुनिया का एकमात्र देश है जहाँ प्राकृतिक आवास में बाघ और शेर दोनों पाए जाते हैं।","India is the only country in the world with both tigers and lions living in the wild."],["nat","বিশ্বের মোট বন্য বাঘের ৭০ শতাংশেরও বেশি ভারতেই বাস করে।","दुनिया के कुल जंगली बाघों में से 70 प्रतिशत से अधिक भारत में रहते हैं।","More than 70% of the world's wild tiger population lives in India."],["nat","গুজরাতের গির অরণ্য এশীয় সিংহের (Asiatic Lion) পৃথিবীর একমাত্র প্রাকৃতিক আবাসস্থল।","गुजरात का गिर वन एशियाई शेरों का दुनिया में एकमात्र प्राकृतिक आवास है।","Gujarat's Gir Forest is the only natural habitat of the Asiatic Lion in the world."],["nat","অসমের কাজিরাঙা জাতীয় উদ্যানে বিশ্বের বৃহত্তম একশৃঙ্গ গন্ডারের বসতি রয়েছে।","असम के काज़ीरंगा राष्ट्रीय उद्यान में दुनिया के सबसे अधिक एक सींग वाले गैंडे पाए जाते हैं।","Assam's Kaziranga National Park holds the world's largest population of greater one-horned rhinoceroses."],["nat","১৯৩৬ সালে উত্তরাখণ্ডে স্থাপিত জিম করবেট জাতীয় উদ্যান ভারতের প্রথম জাতীয় উদ্যান।","1936 में उत्तराखंड में स्थापित जिम कॉर्बेट राष्ट्रीय उद्यान भारत का पहला राष्ट्रीय उद्यान है।","Established in 1936 in Uttarakhand, Jim Corbett National Park is India's oldest national park."],["nat","ভারতের জাতীয় জলজ প্রাণী গঙ্গার শুশুক (Ganges River Dolphin) দৃষ্টিহীন এবং শব্দতরঙ্গের সাহায্যে পথ চেনে।","भारत का राष्ट्रीय जलीय जीव गंगा डॉल्फ़िन दृष्टिहीन होती है और ध्वनि तरंगों से रास्ता खोजती है।","India's national aquatic animal, the Ganges River Dolphin, is virtually blind and navigates by echolocation."],["nat","ভারতের জাতীয় পশু রয়্যাল বেঙ্গল টাইগার, জাতীয় পাখি ময়ূর এবং জাতীয় ঐতিহ্যবাহী প্রাণী ভারতীয় হাতি।","भारत का राष्ट्रीय पशु रॉयल बंगाल टाइगर, राष्ट्रीय पक्षी मोर और राष्ट्रीय विरासत पशु भारतीय हाथी है।","India's national animal is the Royal Bengal Tiger, national bird the Peacock, and heritage animal the Elephant."],["nat","ভারতে ৪টি বৈশ্বিক জীববৈচিত্র্য হটস্পট রয়েছে — হিমালয়, পশ্চিমঘাট, ইন্দো-বার্মা ও সুন্দাল্যান্ড (নিকোবর)।","भारत में 4 वैश्विक जैव-विविधता हॉटस्पॉट हैं — हिमालय, पश्चिमी घाट, इंडो-बर्मा और सुंडालैंड (निकोबार)।","India contains 4 global biodiversity hotspots: the Himalayas, Western Ghats, Indo-Burma and Sundaland (Nicobar)."],["nat","মেঘালয়ের খাসি ও জয়ন্তিয়া পাহাড়ে রাবার গাছের জীবন্ত শিকড় বুনে তৈরি শতাব্দীপ্রাচীন \"জীবন্ত শিকড়ের সেতু\" রয়েছে।","मेघालय की खासी व जयंतिया पहाड़ियों में रबर के पेड़ों की जड़ों से बने सैकड़ों साल पुराने \"जीवित जड़ों के पुल\" हैं।","Meghalaya's living root bridges are hand-woven from aerial rubber-fig roots and grow stronger over decades."],["nat","মধ্যপ্রদেশকে \"টাইগার স্টেট অব ইন্ডিয়া\" বলা হয়, কারণ ভারতে সবচেয়ে বেশি বাঘ এই রাজ্যেই আছে।","मध्य प्रदेश को \"टाइगर स्टेट ऑफ़ इंडिया\" कहा जाता है, क्योंकि भारत में सबसे ज़्यादा बाघ यहीं हैं।","Madhya Pradesh is called the \"Tiger State of India\", hosting the highest tiger count in the country."],["nat","আয়তনের শতাংশ হিসেবে লাক্ষাদ্বীপ ও মিজোরামে ভারতের সবচেয়ে বেশি বনভূমি আচ্ছাদন (৮৪%+) রয়েছে।","क्षेत्रफल के प्रतिशत के हिसाब से लक्षद्वीप और मिज़ोरम में भारत का सर्वाधिक वन आवरण (84%+) है।","By percentage of area, Lakshadweep and Mizoram have India's highest forest cover (over 84%)."],["nat","মোট বনাঞ্চলের আয়তনে মধ্যপ্রদেশ ভারতের প্রথম স্থানে রয়েছে।","कुल वन क्षेत्रफल के मामले में मध्य प्रदेश भारत में पहले स्थान पर है।","Madhya Pradesh has the largest total forest area of any Indian state."],["nat","১৯৭৩ সালের ১ এপ্রিল বিপন্ন বাঘ সংরক্ষণের জন্য ভারতে ঐতিহাসিক \"প্রজেক্ট টাইগার\" শুরু হয়।","1 अप्रैल 1973 को बाघों के संरक्षण के लिए भारत में ऐतिहासिक \"प्रोजेक्ट टाइगर\" शुरू किया गया था।","India launched Project Tiger on 1 April 1973 to protect and revive wild tiger populations."],["nat","ওডিশার গহিরমাথা সৈকত বিপন্ন অলিভ রিডলি কচ্ছপদের বিশ্বের অন্যতম বৃহৎ প্রজনন ক্ষেত্র।","ओडिशा का गहिरमाथा तट लुप्तप्राय ऑलिव रिडले कछुओं के विश्व के सबसे बड़े प्रजनन स्थलों में है।","Odisha's Gahirmatha Beach is one of the world's largest mass-nesting rookeries for Olive Ridley turtles."],["nat","কেরলের নীলগিরি পাহাড়ে ১২ বছরে মাত্র একবার ফোটা \"নীলকুরিঞ্জি\" ফুল পুরো উপত্যকা নীল করে দেয়।","केरल व तमिलनाडु की नीलगिरि पहाड़ियों में 12 साल में एक बार खिलने वाला \"नीलकुरिंजी\" फूल पूरी घाटी को नीला कर देता है।","The Neelakurinji flower in the Western Ghats blooms only once every 12 years, turning the hills blue."],["nat","কলকাতার হাওড়া বোটানিক্যাল গার্ডেনের \"গ্রেট ব্যানিয়ান ট্রি\" ২৫০ বছরেরও বেশি পুরনো এবং সাড়ে ৩ একর জুড়ে বিস্তৃত।","कोलकाता के हावड़ा बॉटैनिकल गार्डन का \"ग्रेट बैनियन ट्री\" 250 साल से ज़्यादा पुराना और 3.5 एकड़ में फैला है।","The Great Banyan Tree at Howrah Botanical Garden is over 250 years old and covers roughly 3.5 acres."],["nat","ভারতে ১০৬টি জাতীয় উদ্যান এবং ৫৫টিরও বেশি টাইগার রিজার্ভ রয়েছে।","भारत में 106 राष्ट्रीय उद्यान और 55 से अधिक टाइगर रिज़र्व हैं।","India protects wildlife across 106 National Parks and over 55 Tiger Reserves."],["nat","উত্তরাখণ্ডের \"ভ্যালি অব ফ্লাওয়ার্স\" ইউনেস্কো বিশ্ব ঐতিহ্যবাহী স্থান, যেখানে ৬০০-র বেশি বিরল পাহাড়ি ফুল ফোটে।","उत्तराखंड की \"फूलों की घाटी\" एक यूनेस्को धरोहर है, जहाँ 600 से अधिक दुर्लभ पहाड़ी फूल खिलते हैं।","Uttarakhand's Valley of Flowers UNESCO site hosts over 600 species of rare alpine flora."],["nat","১৯৭০-এর দশকে উত্তরাখণ্ডে শুরু হওয়া \"চিপকো আন্দোলন\" গাছ বাঁচানোর বিশ্বখ্যাত পরিবেশ আন্দোলন।","1970 के दशक में उत्तराखंड से शुरू हुआ \"चिपको आंदोलन\" वन संरक्षण का विश्व-प्रसिद्ध जन-आंदोलन है।","The 1970s Chipko Movement in Uttarakhand became a landmark grassroots forest-conservation movement."],["nat","লাদাখের হেমিস জাতীয় উদ্যান আয়তনে ভারতের বৃহত্তম জাতীয় উদ্যান এবং তুষার চিতার (Snow Leopard) জন্য বিখ্যাত।","लद्दाख का हेमिस राष्ट्रीय उद्यान क्षेत्रफल में भारत का सबसे बड़ा नेशनल पार्क है और हिम तेंदुओं के लिए प्रसिद्ध है।","Ladakh's Hemis National Park is India's largest national park and renowned for snow leopards."],["nat","ভারতে ৮০টিরও বেশি রামসার (Ramsar) জলাভূমি রয়েছে, যা এশিয়ার মধ্যে সর্বাধিক।","भारत में 80 से अधिक रामसर आर्द्रभूमियाँ (Wetlands) हैं, जो एशिया में सबसे अधिक हैं।","India has over 80 Ramsar wetlands of international importance, the highest in Asia."],["nat","তামিলনাডু ও কেরলের সীমান্তে অবস্থিত নীলগিরি বায়োস্ফিয়ার রিজার্ভ (১৯৮৬) ছিল ভারতের প্রথম বায়োস্ফিয়ার রিজার্ভ।","1986 में स्थापित नीलगिरि बायोस्फीयर रिज़र्व भारत का पहला बायोस्फीयर रिज़र्व था।","Established in 1986, the Nilgiri Biosphere Reserve was India's very first biosphere reserve."],["nat","গুজরাত থেকে কেরল পর্যন্ত বিস্তৃত পশ্চিমঘাট পর্বতমালা ভূতাত্ত্বিকভাবে হিমালয়ের চেয়েও প্রাচীন।","गुजरात से केरल तक फैला पश्चिमी घाट पर्वत भूवैज्ञानिक रूप से हिमालय से भी अधिक प्राचीन है।","The Western Ghats mountain range is geologically older than the Himalayas."],["spt","ভারতের কোনো সরকারিভাবে ঘোষিত \"জাতীয় খেলা\" নেই, যদিও অনেকেই হকিকে জাতীয় খেলা বলে মনে করেন।","भारत का कोई आधिकारिक \"राष्ट्रीय खेल\" घोषित नहीं है, हालाँकि हॉकी को अक्सर ऐसा मान लिया जाता है।","India has no officially declared \"national sport\", though hockey is often mistakenly assumed to be one."],["spt","ভারতীয় পুরুষ হকি দল অলিম্পিকে রেকর্ড ৮টি স্বর্ণপদক জিতেছে (১৯২৮–১৯৫৬ টানা ৬টি-সহ)।","भारतीय पुरुष हॉकी टीम ने ओलंपिक में रिकॉर्ड 8 स्वर्ण पदक जीते हैं (1928–1956 लगातार 6 सहित)।","India's men's hockey team has won a record 8 Olympic gold medals, including 6 straight from 1928 to 1956."],["spt","হকির জাদুকর মেজর ধ্যানচাঁদের জন্মদিন ২৯ আগস্ট ভারতে \"জাতীয় ক্রীড়া দিবস\" হিসেবে পালিত হয়।","हॉकी के जादूगर मेजर ध्यानचंद के जन्मदिन 29 अगस्त को भारत में \"राष्ट्रीय खेल दिवस\" मनाया जाता है।","Major Dhyan Chand's birthday, 29 August, is celebrated across India as National Sports Day."],["spt","২০০৮ বেইজিং অলিম্পিকে অভিনব বিন্দ্রা শুটিংয়ে ভারতের প্রথম ব্যক্তিগত অলিম্পিক স্বর্ণপদক জেতেন।","2008 बीजिंग ओलंपिक में अभिनव बिंद्रा ने निशानेबाज़ी में भारत का पहला व्यक्तिगत ओलंपिक स्वर्ण जीता।","Abhinav Bindra won India's first individual Olympic gold medal in shooting at Beijing 2008."],["spt","২০২১ টোকিও অলিম্পিকে নীরজ চোপড়া জ্যাভলিন থ্রো-তে অ্যাথলেটিক্সে ভারতের প্রথম অলিম্পিক স্বর্ণপদক জেতেন।","2021 टोक्यो ओलंपिक में नीरज चोपड़ा ने भाला फेंक में एथलेटिक्स का भारत का पहला ओलंपिक स्वर्ण जीता।","Neeraj Chopra won India's first Olympic gold in athletics (javelin throw) at Tokyo 2020."],["spt","১৯৫২ হেলসিঙ্কি অলিম্পিকে কুস্তিগীর খাশাবা দাদাসাহেব যাদব স্বাধীন ভারতের প্রথম ব্যক্তিগত অলিম্পিক পদক জেতেন।","1952 हेलसिंकी ओलंपिक में पहलवान के. डी. जाधव ने स्वतंत्र भारत का पहला व्यक्तिगत ओलंपिक पदक जीता।","Wrestler K. D. Jadhav won independent India's first individual Olympic medal at Helsinki 1952."],["spt","২০০০ সিডনি অলিম্পিকে ভারোত্তোলক কর্ণম মালেশ্বরী প্রথম ভারতীয় নারী হিসেবে অলিম্পিক পদক জেতেন।","2000 सिडनी ओलंपिक में भारोत्तोलक कर्णम मल्लेश्वरी ओलंपिक पदक जीतने वाली पहली भारतीय महिला बनीं।","Weightlifter Karnam Malleswari became the first Indian woman to win an Olympic medal at Sydney 2000."],["spt","ব্যাডমিন্টন তারকা পি. ভি. সিন্ধু প্রথম ভারতীয় নারী হিসেবে দুটি ব্যক্তিগত অলিম্পিক পদক জেতেন।","बैडमिंटन स्टार पी. वी. सिंधु दो व्यक्तिगत ओलंपिक पदक जीतने वाली पहली भारतीय महिला बनीं।","P. V. Sindhu became the first Indian woman to win two individual Olympic medals."],["spt","শুটার মনু ভাকের ২০২৪ প্যারিস অলিম্পিকে স্বাধীন ভারতের প্রথম ক্রীড়াবিদ হিসেবে এক আসরে দুটি অলিম্পিক পদক জেতেন।","निशानेबाज़ मनु भाकर 2024 पेरिस ओलंपिक में एक ही खेल में दो पदक जीतने वाली स्वतंत्र भारत की पहली एथलीट बनीं।","Shooter Manu Bhaker became the first athlete from independent India to win two medals in a single Olympics (Paris 2024)."],["spt","বিশ্বনাথন আনন্দ ১৯৮৮ সালে ভারতের প্রথম দাবা গ্র্যান্ডমাস্টার হন এবং ৫ বার বিশ্ব দাবা চ্যাম্পিয়ন শিরোপা জেতেন।","विश्वनाथन आनंद 1988 में भारत के पहले शतरंज ग्रैंडमास्टर बने और 5 बार विश्व चैंपियन रहे।","Viswanathan Anand became India's first chess Grandmaster in 1988 and a 5-time World Chess Champion."],["spt","২০২৪ সালের ডিসেম্বরে ১৮ বছর বয়সী ডি. গুকেশ বিশ্বের সর্বকনিষ্ঠ বিশ্ব দাবা চ্যাম্পিয়ন হয়ে ইতিহাস গড়েন।","दिसंबर 2024 में 18 वर्षीय डी. गुकेश दुनिया के सबसे कम उम्र के विश्व शतरंज चैंपियन बने।","In December 2024, 18-year-old D. Gukesh became the youngest World Chess Champion in history."],["spt","ভারত ক্রিকেট বিশ্বকাপ জিতেছে ১৯৮৩ ও ২০১১ সালে (একদিনের) এবং ২০০৭ ও ২০২৪ সালে (টি-টোয়েন্টি)।","भारत ने क्रिकेट विश्व कप 1983 व 2011 (वनडे) तथा 2007 व 2024 (टी20) में जीता है।","India has won the ODI Cricket World Cup in 1983 and 2011, and the T20 World Cup in 2007 and 2024."],["spt","আহমেদাবাদের নরেন্দ্র মোদি স্টেডিয়াম (১,৩২,০০০ আসন) বিশ্বের বৃহত্তম ক্রিকেট স্টেডিয়াম।","अहमदाबाद का नरेंद्र मोदी स्टेडियम (1,32,000 दर्शक क्षमता) दुनिया का सबसे बड़ा क्रिकेट स्टेडियम है।","Ahmedabad's Narendra Modi Stadium (132,000 capacity) is the largest cricket stadium in the world."],["spt","১৮৬৪ সালে প্রতিষ্ঠিত কলকাতার ইডেন গার্ডেন্স ভারতের প্রাচীনতম ক্রিকেট স্টেডিয়াম।","1864 में स्थापित कोलकाता का ईडन गार्डन्स भारत का सबसे पुराना क्रिकेट स्टेडियम है।","Established in 1864, Eden Gardens in Kolkata is India's oldest cricket stadium."],["spt","শচীন তেন্ডুলকর আন্তর্জাতিক ক্রিকেটে ১০০টি শতক করা বিশ্বের একমাত্র ব্যাটার এবং প্রথম ক্রীড়াবিদ ভারতরত্ন।","सचिन तेंदुलकर अंतरराष्ट्रीय क्रिकेट में 100 शतक लगाने वाले एकमात्र बल्लेबाज़ और पहले खिलाड़ी भारत रत्न हैं।","Sachin Tendulkar is the only cricketer with 100 international centuries and the first sportsperson awarded the Bharat Ratna."],["spt","১৯৫১ সালে নয়াদিল্লিতেই প্রথম এশিয়ান গেমস (Asian Games) অনুষ্ঠিত হয়েছিল।","1951 में नई दिल्ली में ही पहले एशियाई खेलों (Asian Games) का आयोजन हुआ था।","The very first Asian Games were held in New Delhi in 1951."],["spt","আধুনিক পোলো খেলার উৎপত্তি ভারতের মণিপুর রাজ্যের ঐতিহ্যবাহী \"সাগোল কাংজেই\" খেলা থেকে।","आधुनिक पोलो खेल की उत्पत्ति भारत के मणिपुर राज्य के पारंपरिक \"सगोल कांगजेई\" खेल से हुई।","Modern polo traces its origins to Manipur's traditional game of Sagol Kangjei."],["spt","বক্সিং কিংবদন্তি এম. সি. মেরি কম রেকর্ড ৬ বার বিশ্ব অ্যামেচার বক্সিং চ্যাম্পিয়নশিপ জিতেছেন।","मुक्केबाज़ी की दिग्गज एम. सी. मैरी कॉम ने रिकॉर्ड 6 बार विश्व एमेच्योर बॉक्सिंग चैंपियनशिप जीती है।","Boxing legend M. C. Mary Kom is a record 6-time World Amateur Boxing Champion."],["spt","প্যারালিম্পিকে শুটার অবনী লেখারা প্রথম ভারতীয় নারী হিসেবে পরপর দুই আসরে স্বর্ণপদক জিতেছেন।","पैरालंपिक में निशानेबाज़ अवनि लेखरा लगातार दो स्वर्ण पदक जीतने वाली पहली भारतीय महिला बनीं।","Shooter Avani Lekhara became the first Indian woman to win consecutive Paralympic gold medals."],["spt","হকি ও কবাডির পাশাপাশি খো-খো ও মল্লখাম্ব ভারতের প্রাচীনতম ঐতিহ্যবাহী দেশীয় খেলা।","कबड्डी के साथ-साथ खो-खो और मल्लखंब भारत के सबसे प्राचीन पारंपरिक स्वदेशी खेल हैं।","Alongside kabaddi, kho-kho and mallakhamb are among India's oldest indigenous traditional sports."],["spt","কবাডি বিশ্বকাপের ইতিহাসে পুরুষ ও নারী—উভয় বিভাগেই ভারত সবচেয়ে সফল দল।","कबड्डी विश्व कप के इतिहास में पुरुष और महिला — दोनों वर्गों में भारत सबसे सफल टीम है।","India is the most successful nation in both men's and women's Kabaddi World Cup history."],["spt","দৌড়বিদ মিলখা সিং ১৯৫৮ কমনওয়েলথ গেমসে স্বাধীন ভারতের প্রথম অ্যাথলেটিক্স স্বর্ণ জিতে \"ফ্লাইং শিখ\" উপাধি পান।","धावक मिल्खा सिंह ने 1958 राष्ट्रमंडल खेलों में एथलेटिक्स का पहला स्वर्ण जीतकर \"फ़्लाइंग सिख\" नाम पाया।","Sprinter Milkha Singh won independent India's first Commonwealth athletics gold in 1958, earning the nickname \"The Flying Sikh\"."],["st","পশ্চিমবঙ্গের কলকাতায় ভারতের প্রথম মেডিকেল কলেজ (১৮৩৫) এবং প্রথম আধুনিক বিশ্ববিদ্যালয়গুলির একটি (১৮৫৭) স্থাপিত হয়।","कोलकाता में भारत का पहला मेडिकल कॉलेज (1835) और पहला आधुनिक विश्वविद्यालय (1857) स्थापित हुआ।","Kolkata saw India's first medical college (1835) and one of its first modern universities (1857)."],["st","পশ্চিমবঙ্গের দার্জিলিং হিমালয়ান রেলওয়ে (টয় ট্রেন) ভারতের প্রথম পার্বত্য রেল হিসেবে ইউনেস্কো বিশ্ব ঐতিহ্য পায়।","दार्जिलिंग हिमालयन रेलवे (टॉय ट्रेन) यूनेस्को विश्व धरोहर पाने वाली भारत की पहली पर्वतीय रेल है।","The Darjeeling Himalayan Railway was the first Indian mountain railway declared a UNESCO World Heritage Site."],["st","পশ্চিমবঙ্গের হাওড়া ব্রিজ (রবীন্দ্র সেতু, ১৯৪৩) একটিও নাট-বোল্ট ছাড়াই রিভেট দিয়ে তৈরি বিশ্বের অন্যতম ব্যস্ত ক্যান্টিলিভার সেতু।","कोलकाता का हावड़ा ब्रिज (रवींद्र सेतु, 1943) बिना नट-बोल्ट के रिवेट से बना दुनिया के सबसे व्यस्त कैंटीलीवर पुलों में है।","Kolkata's Howrah Bridge (1943) is a riveted cantilever bridge built without nuts and bolts, among the busiest in the world."],["st","সিকিম ২০১৬ সালে ভারতের তথা বিশ্বের প্রথম সম্পূর্ণ \"জৈব কৃষি রাজ্য\" (100% Organic State) হিসেবে স্বীকৃতি পায়।","सिक्किम 2016 में भारत और दुनिया का पहला 100% जैविक खेती वाला राज्य बना।","In 2016, Sikkim became India's and the world's first 100% organic farming state."],["st","কেরল ভারতের সর্বোচ্চ লিঙ্গ-অনুপাতবিশিষ্ট রাজ্য (প্রতি ১,০০০ পুরুষে ১,০৮৪ নারী, ২০১১ আদমশুমারি)।","केरल भारत में सर्वाधिक लिंगानुपात वाला राज्य है (प्रति 1,000 पुरुष पर 1,084 महिलाएँ, 2011)।","Kerala has India's highest sex ratio at 1,084 females per 1,000 males (2011 Census)."],["st","মিজোরাম ২০২৪ সালের PLFS জরিপে ৯৮.২% সাক্ষরতা নিয়ে ভারতের শীর্ষ সাক্ষর রাজ্য।","मिज़ोरम 2024 के PLFS सर्वेक्षण में 98.2% साक्षरता के साथ भारत का शीर्ष साक्षर राज्य है।","Mizoram topped India in literacy at 98.2% in the 2024 PLFS survey."],["st","গুজরাতের কেভাদিয়ায় অবস্থিত সর্দার প্যাটেলের \"স্ট্যাচু অব ইউনিটি\" (১৮২ মিটার) বিশ্বের উচ্চতম মূর্তি।","गुजरात के केवड़िया में स्थित सरदार पटेल की \"स्टैच्यू ऑफ़ यूनिटी\" (182 मीटर) दुनिया की सबसे ऊँची प्रतिमा है।","Gujarat's 182-metre Statue of Unity depicting Sardar Patel is the tallest statue in the world."],["st","মহারাষ্ট্রের মুম্বই ভারতের আর্থিক রাজধানী; দেশের বৃহত্তম শেয়ার বাজার ও RBI সদর দপ্তর এখানেই।","महाराष्ट्र की मुंबई भारत की वित्तीय राजधानी है; प्रमुख शेयर बाज़ार और RBI मुख्यालय यहीं हैं।","Mumbai in Maharashtra is India's financial capital, home to the RBI, BSE and NSE."],["st","উত্তরপ্রদেশের প্রয়াগরাজে গঙ্গা, যমুনা ও পৌরাণিক সরস্বতী নদীর পবিত্র \"ত্রিবেণী সঙ্গম\" অবস্থিত।","उत्तर प्रदेश के प्रयागराज में गंगा, यमुना और पौराणिक सरस्वती नदी का \"त्रिवेणी संगम\" स्थित है।","Prayagraj in Uttar Pradesh is home to the sacred Triveni Sangam of the Ganga, Yamuna and mythical Saraswati."],["st","বিহারের বোধগয়ায় বোধিবৃক্ষের নিচে গৌতম বুদ্ধ জ্ঞান (বোধি) লাভ করেছিলেন।","बिहार के बोधगया में बोधिवृक्ष के नीचे गौतम बुद्ध को ज्ञान की प्राप्ति हुई थी।","Gautama Buddha attained enlightenment under the Bodhi Tree at Bodh Gaya in Bihar."],["st","রাজস্থানের জয়পুর \"গোলাপি শহর\" (Pink City), উদয়পুর \"হ্রদের শহর\" এবং যোধপুর \"নীল শহর\" নামে পরিচিত।","राजस्थान का जयपुर \"गुलाबी शहर\", उदयपुर \"झीलों का शहर\" और जोधपुर \"नीला शहर\" कहलाता है।","Rajasthan's Jaipur is the Pink City, Udaipur the City of Lakes, and Jodhpur the Blue City."],["st","মধ্যপ্রদেশের ইন্দোর টানা বহু বছর ধরে \"স্বচ্ছ সর্বেক্ষণ\"-এ ভারতের সবচেয়ে পরিচ্ছন্ন শহরের শিরোপা জিতেছে।","मध्य प्रदेश का इंदौर लगातार कई वर्षों से स्वच्छ सर्वेक्षण में भारत का सबसे स्वच्छ शहर रहा है।","Indore in Madhya Pradesh has repeatedly topped Swachh Survekshan as India's cleanest city."],["st","কর্ণাটকের বেঙ্গালুরুকে বলা হয় \"ভারতের সিলিকন ভ্যালি\", যা দেশের বৃহত্তম আইটি ও স্টার্টআপ কেন্দ্র।","कर्नाटक का बेंगलुरु \"भारत की सिलिकॉन वैली\" कहलाता है, जो देश का सबसे बड़ा आईटी व स्टार्टअप केंद्र है।","Bengaluru in Karnataka is known as India's Silicon Valley, the nation's leading tech and startup hub."],["st","তামিলনাডুর চেন্নাই ভারতের বৃহত্তম অটোমোবাইল উৎপাদন কেন্দ্র হওয়ায় \"ভারতের ডেট্রয়েট\" নামে পরিচিত।","तमिलनाडु का चेन्नई बड़े ऑटोमोबाइल उद्योग के कारण \"भारत का डेट्रॉइट\" कहलाता है।","Chennai in Tamil Nadu is nicknamed the \"Detroit of India\" for its massive automotive industry."],["st","তেলেঙ্গানার হায়দরাবাদ ঐতিহাসিক মুক্তা ও হীরের বাণিজ্যের জন্য \"মুক্তার শহর\" (City of Pearls) নামে খ্যাত।","तेलंगाना का हैदराबाद ऐतिहासिक मोती व्यापार के कारण \"मोतियों का शहर\" कहलाता है।","Hyderabad in Telangana is famously called the \"City of Pearls\" for its historic pearl and diamond trade."],["st","অন্ধ্রপ্রদেশের তিরুমালা ভেঙ্কটেশ্বর মন্দির বিশ্বের সর্বাধিক দর্শনার্থী সমাগম হওয়া তীর্থক্ষেত্রগুলির একটি।","आंध्र प्रदेश का तिरुमला वेंकटेश्वर मंदिर दुनिया के सबसे अधिक श्रद्धालुओं वाले तीर्थों में से एक है।","Andhra Pradesh's Tirumala Venkateswara Temple is among the most visited pilgrimage sites on Earth."],["st","অন্ধ্রপ্রদেশ ১৯৫৩ সালে ভাষাগত ভিত্তিতে গঠিত স্বাধীন ভারতের প্রথম রাজ্য।","आंध्र प्रदेश 1953 में भाषाई आधार पर गठित होने वाला स्वतंत्र भारत का पहला राज्य था।","Andhra Pradesh (1953) was the first state in independent India formed on a linguistic basis."],["st","তেলেঙ্গানা ২ জুন ২০১৪ সালে অন্ধ্রপ্রদেশ থেকে আলাদা হয়ে ভারতের নবীনতম রাজ্য হিসেবে আত্মপ্রকাশ করে।","तेलंगाना 2 जून 2014 को आंध्र प्रदेश से अलग होकर भारत का सबसे नया राज्य बना।","Telangana became India's newest state on 2 June 2014 after bifurcating from Andhra Pradesh."],["st","ওডিশার পুরীর রথযাত্রা শব্দ থেকেই ইংরেজি \"Juggernaut\" (জগন্নাথ) শব্দটি এসেছে।","ओडिशा के पुरी की जगन्नाथ रथयात्रा से ही अंग्रेज़ी का शब्द \"Juggernaut\" बना है।","The English word \"juggernaut\" originates from the massive chariot of Jagannath in Puri, Odisha."],["st","পাঞ্জাবের নামটি এসেছে ফার্সি \"পাঞ্জ-আব\" (পাঁচ নদী) থেকে — শতদ্রু, বিপাশা, ইরাবতী, চন্দ্রভাগা ও বিতস্তা।","पंजाब का नाम \"पंज-आब\" (पाँच नदियाँ) से बना है — सतलुज, ब्यास, रावी, चिनाब और झेलम।","Punjab gets its name from \"Panj-ab\" — the land of five rivers: Sutlej, Beas, Ravi, Chenab and Jhelum."],["st","হরিয়ানা জনসংখ্যার অনুপাতে ভারতের সবচেয়ে বেশি অলিম্পিক ও আন্তর্জাতিক কুস্তি-বক্সিং পদকজয়ী রাজ্য।","हरियाणा जनसंख्या के अनुपात में भारत को सर्वाधिक ओलंपिक व अंतरराष्ट्रीय कुश्ती-बॉक्सिंग पदक देने वाला राज्य है।","Haryana contributes a disproportionately large share of India's Olympic and international medals."],["st","চণ্ডীগড় স্বাধীন ভারতের প্রথম পরিকল্পিত আধুনিক শহর, যার নকশা করেছিলেন স্থপতি লে কর্বুজিয়ে।","चंडीगढ़ स्वतंत्र भारत का पहला योजनाबद्ध आधुनिक शहर है, जिसका डिज़ाइन वास्तुकार ले कोर्बुज़िए ने बनाया था।","Chandigarh was independent India's first planned modern city, designed by architect Le Corbusier."],["st","হিমাচল প্রদেশকে \"ভারতের আপেলের ঝুড়ি\" বলা হয় এবং এর প্রায় ৯০% মানুষ গ্রামীণ অঞ্চলে বাস করেন।","हिमाचल प्रदेश को \"भारत की सेब की टोकरी\" कहा जाता है और इसकी लगभग 90% आबादी ग्रामीण क्षेत्रों में रहती है।","Himachal Pradesh is known as the \"Apple Bowl of India\" and remains nearly 90% rural."],["st","হিমাচল প্রদেশের ধর্মশালা বিশ্বের অন্যতম উচ্চতম ও মনোরম আন্তর্জাতিক ক্রিকেট স্টেডিয়ামের জন্য পরিচিত।","हिमाचल प्रदेश का धर्मशाला दुनिया के सबसे ऊँचे और सुंदर अंतरराष्ट्रीय क्रिकेट स्टेडियम के लिए जाना जाता है।","Dharamshala in Himachal Pradesh hosts one of the world's highest and most scenic international cricket stadiums."],["st","উত্তরাখণ্ডের ঋষিকেশকে বলা হয় \"বিশ্বের যোগ রাজধানী\" (Yoga Capital of the World)।","उत्तराखंड के ऋषिकेश को \"विश्व की योग राजधानी\" कहा जाता है।","Rishikesh in Uttarakhand is celebrated worldwide as the \"Yoga Capital of the World\"."],["st","অসম ভারতের মোট চা উৎপাদনের অর্ধেকেরও বেশি জোগান দেয় এবং এশিয়ার প্রাচীনতম তেলশোধনাগার ডিগবয়ে (১৯০১) অবস্থিত।","असम भारत की आधी से अधिक चाय पैदा करता है और एशिया की सबसे पुरानी रिफ़ाइनरी डिगबोई (1901) यहीं है।","Assam produces over half of India's tea and is home to Digboi (1901), one of the world's oldest oil refineries."],["st","মেঘালয়ের মাওলিননং গ্রাম \"এশিয়ার সবচেয়ে পরিচ্ছন্ন গ্রাম\" হিসেবে আন্তর্জাতিক স্বীকৃতি পেয়েছে।","मेघालय का मावलिननॉन्ग गाँव \"एशिया के सबसे स्वच्छ गाँव\" के रूप में प्रसिद्ध है।","Mawlynnong in Meghalaya earned fame as Asia's Cleanest Village."],["st","অরুণাচল প্রদেশের তাওয়াং মঠ (১৬৮০) ভারতের বৃহত্তম এবং বিশ্বের দ্বিতীয় বৃহত্তম বৌদ্ধ মঠ।","अरुणाचल प्रदेश का तवांग मठ (1680) भारत का सबसे बड़ा और दुनिया का दूसरा सबसे बड़ा बौद्ध मठ है।","Tawang Monastery (1680) in Arunachal Pradesh is India's largest and the world's second-largest monastery."],["st","নাগাল্যান্ডের কিসামা গ্রামে প্রতি বছর ১–১০ ডিসেম্বর ঐতিহ্যবাহী \"হর্নবিল উৎসব\" পালিত হয়।","नागालैंड के किसामा गाँव में हर साल 1–10 दिसंबर को प्रसिद्ध \"हॉर्नबिल महोत्सव\" मनाया जाता है।","Nagaland's Hornbill Festival, held every December at Kisama, is celebrated as the Festival of Festivals."],["st","ত্রিপুরার \"নীরমহল\" পূর্ব ভারতের একমাত্র জলপ্রাসাদ, যা রুদ্রসাগর হ্রদের মাঝখানে নির্মিত।","त्रिपुरा का \"नीरमहल\" पूर्वी भारत का एकमात्र जल महल है, जो रुद्रसागर झील के बीच बना है।","Tripura's Neermahal, set in the middle of Rudrasagar Lake, is the only water palace in eastern India."],["st","ঝাড়খণ্ডের জামশেদপুর ভারতের প্রথম পরিকল্পিত শিল্পনগরী, যা জামশেদজি টাটার নামে পরিচিত।","झारखंड का जमशेदपुर भारत का पहला योजनाबद्ध औद्योगिक शहर है, जिसका नाम जमशेदजी टाटा पर पड़ा।","Jamshedpur in Jharkhand was India's first planned industrial city, named after Jamsetji Tata."],["st","ছত্তিশগড়ের চিত্রকোট জলপ্রপাতকে এর বিস্তৃত ঘোড়ার খুরের আকৃতির জন্য \"ভারতের নায়াগ্রা\" বলা হয়।","छत्तीसगढ़ के चित्रकोट जलप्रपात को इसके विशाल घोड़े की नाल जैसे आकार के कारण \"भारत का नियाग्रा\" कहा जाता है।","Chhattisgarh's wide horseshoe-shaped Chitrakote Falls is popularly called the \"Niagara of India\"."],["st","গোয়া আয়তনে ভারতের ক্ষুদ্রতম রাজ্য হলেও মাথাপিছু আয়ে দেশের শীর্ষ রাজ্যগুলোর একটি।","गोवा क्षेत्रफल में सबसे छोटा राज्य है, पर प्रति व्यक्ति आय में देश के शीर्ष राज्यों में शामिल है।","Though smallest by area, Goa consistently ranks among the top Indian states in per-capita income."],["st","পুদুচেরির চারটি জেলা — পুদুচেরি, করাইকাল, মাহে ও ইয়ানম — তিনটি আলাদা রাজ্যের সীমানায় ছড়িয়ে আছে।","पुदुचेरी के चार ज़िले — पुदुचेरी, कराईकल, माहे और यानम — तीन अलग-अलग राज्यों के बीच फैले हुए हैं।","Puducherry's four districts—Puducherry, Karaikal, Mahe and Yanam—are geographically enclaves across three states."],["st","লাক্ষাদ্বীপ ভারতের ক্ষুদ্রতম কেন্দ্রশাসিত অঞ্চল (৩২ বর্গ কিমি), যা ৩৬টি প্রবাল দ্বীপ নিয়ে গঠিত।","लक्षद्वीप भारत का सबसे छोटा केंद्रशासित प्रदेश (32 वर्ग किमी) है, जो 36 प्रवाल द्वीपों से बना है।","Lakshadweep is India's smallest union territory (32 sq km), an archipelago of 36 coral islands."],["st","আন্দামান ও নিকোবরের রাজধানী পোর্ট ব্লেয়ারের নতুন নামকরণ করা হয়েছে \"শ্রী বিজয়পুরম\" (২০২৪)।","अंडमान और निकोबार की राजधानी पोर्ट ब्लेयर का नया नाम \"श्री विजयपुरम\" (2024) रखा गया है।","Port Blair, capital of Andaman & Nicobar Islands, was renamed Sri Vijaya Puram in 2024."],["st","দিল্লিতে দেশের সর্বোচ্চ জনঘনত্ব রয়েছে — প্রতি বর্গ কিলোমিটারে ১১,৩০০-রও বেশি মানুষ (২০১১)।","दिल्ली में देश का सर्वाधिक जनघनत्व है — प्रति वर्ग किमी 11,300 से अधिक लोग (2011)।","Delhi has the highest population density in India at over 11,300 people per sq km (2011 Census)."],["st","লাদাখের প্যাংগং ত্সো হ্রদ সমুদ্রপৃষ্ঠ থেকে ৪,২২৫ মিটার উচ্চতায় অবস্থিত এবং দিনের আলোয় এর জলের রং বদলায়।","लद्दाख की पैंगोंग झील 4,225 मीटर की ऊँचाई पर स्थित है और धूप के साथ इसका रंग बदलता रहता है।","Ladakh's Pangong Tso sits at 4,225 m altitude and shifts shades of blue through the day."],["st","দাদরা ও নগর হাভেলি এবং দমন ও দিউ ২০২০ সালের ২৬ জানুয়ারি একত্রিত হয়ে একটি কেন্দ্রশাসিত অঞ্চলে পরিণত হয়।","दादरा-नगर हवेली और दमन-दीव 26 जनवरी 2020 को विलय होकर एक केंद्रशासित प्रदेश बने।","Dadra & Nagar Haveli and Daman & Diu merged into a single union territory on 26 January 2020."]];

function istDayInfo() {
  const now = new Date();
  const parts = new Intl.DateTimeFormat('en-CA', { year: 'numeric', month: '2-digit', day: '2-digit', timeZone: 'Asia/Kolkata' }).formatToParts(now);
  const y = +(parts.find((p) => p.type === 'year') || {}).value || now.getFullYear();
  const m = +(parts.find((p) => p.type === 'month') || {}).value || (now.getMonth() + 1);
  const d = +(parts.find((p) => p.type === 'day') || {}).value || now.getDate();
  const key = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const dayNum = Math.floor(Date.UTC(y, m - 1, d) / 86400000);
  return { key, dayNum };
}

function seededShuffleIndices(n, seed) {
  const arr = Array.from({ length: n }, (_, i) => i);
  let s = (seed >>> 0) || 1;
  const rand = () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function ensureDailyFactBatch() {
  const { key, dayNum } = istDayInfo();
  if (key === totdDayKey && totdBatch.length) return totdBatch;
  totdDayKey = key;
  const total = FACT_BANK.length;
  const daysPerCycle = Math.max(1, Math.floor(total / TOTD_DAILY_COUNT));
  const cycle = Math.floor(dayNum / daysPerCycle);
  const slot = ((dayNum % daysPerCycle) + daysPerCycle) % daysPerCycle;
  const order = seededShuffleIndices(total, cycle * 9973 + 202611);
  const builtIn = order.slice(slot * TOTD_DAILY_COUNT, (slot + 1) * TOTD_DAILY_COUNT).map((idx) => FACT_BANK[idx]);
  if (totdLiveExtras.length) {
    const merged = [...totdLiveExtras, ...builtIn];
    totdBatch = merged.slice(0, TOTD_DAILY_COUNT);
  } else {
    totdBatch = builtIn;
  }
  factIdx = 0;
  totdElapsed = 0;
  return totdBatch;
}

function updateTotdProgress() {
  const bar = $('#totdbar');
  if (!bar) return;
  const pct = Math.max(0, Math.min(100, (1 - totdElapsed / TOTD_INTERVAL_MS) * 100));
  bar.style.width = pct.toFixed(1) + '%';
}

function renderTotd(animate = false) {
  const batch = ensureDailyFactBatch();
  if (!batch.length) return;
  const n = batch.length;
  const i = ((factIdx % n) + n) % n;
  factIdx = i;
  const item = batch[i];
  const catKey = item[0] in FACT_CATS ? item[0] : 'const';
  const cat = FACT_CATS[catKey];
  const li = lang === 'bn' ? 0 : lang === 'hi' ? 1 : 2;
  const txt = item[li + 1] || item[3] || item[1];

  const box = $('#totd');
  box.style.setProperty('--tc', cat.c);
  box.classList.toggle('is-paused', totdPaused || totdHover);
  $('#totdlbl').textContent = '⚡ ' + L('আজকের তথ্য', 'आज की जानकारी', 'Fact of the Day');
  $('#totdcat').textContent = `${cat.ico} ${cat.l[li]}`;
  $('#totdcnt').textContent = `${nf.format(i + 1)} / ${nf.format(n)}`;

  const txtEl = $('#totdtxt');
  txtEl.textContent = txt;
  if (animate) {
    txtEl.classList.remove('totd-anim');
    void txtEl.offsetWidth;
    txtEl.classList.add('totd-anim');
  }

  const pauseBtn = $('#totdpause');
  if (pauseBtn) {
    pauseBtn.textContent = totdPaused ? '▶' : '⏸';
    pauseBtn.setAttribute('aria-pressed', String(totdPaused));
    pauseBtn.setAttribute('aria-label', totdPaused ? L('অটো-রোটেশন চালু করুন', 'ऑटो-रोटेशन चालू करें', 'Resume auto-rotation') : L('অটো-রোটেশন থামান', 'ऑटो-रोटेशन रोकें', 'Pause auto-rotation'));
  }
  const prevBtn = $('#totdprev');
  if (prevBtn) prevBtn.setAttribute('aria-label', L('আগের তথ্য দেখুন', 'पिछला तथ्य देखें', 'Previous fact'));
  $('#totdnext').setAttribute('aria-label', L('পরের তথ্য দেখুন', 'अगला तथ्य देखें', 'Next fact'));
  box.hidden = false;
  updateTotdProgress();
  startTotdTicker();
}

function stepTotd(delta) {
  ensureDailyFactBatch();
  factIdx = (factIdx + delta + totdBatch.length) % totdBatch.length;
  totdElapsed = 0;
  renderTotd(true);
}

function startTotdTicker() {
  if (totdTimerStarted) return;
  totdTimerStarted = true;
  let lastTs = Date.now();
  setInterval(() => {
    const now = Date.now();
    const dt = Math.min(500, Math.max(0, now - lastTs));
    lastTs = now;
    if (document.visibilityState === 'hidden') return;
    const { key } = istDayInfo();
    if (key !== totdDayKey) {
      ensureDailyFactBatch();
      renderTotd(true);
      return;
    }
    if (totdPaused || totdHover) return;
    totdElapsed += dt;
    if (totdElapsed >= TOTD_INTERVAL_MS) {
      stepTotd(1);
    } else {
      updateTotdProgress();
    }
  }, 100);
}

$('#totdprev').addEventListener('click', () => stepTotd(-1));
$('#totdnext').addEventListener('click', () => stepTotd(1));
$('#totdpause').addEventListener('click', () => {
  totdPaused = !totdPaused;

});
$('#totd').addEventListener('mouseenter', () => {

$('#totd').addEventListener('mouseleave', () => {

});

function wrapCanvasText(ctx, text, x, y, maxW, lineH, maxLines = 3) {
  const words = String(text || '').split(/\s+/);
  let line = '', lines = 0;
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y + lines * lineH);
      line = words[i];
      lines++;
      if (lines >= maxLines - 1) {
        const rest = [line, ...words.slice(i + 1)].join(' ');
        let trimmed = rest;
        while (ctx.measureText(trimmed + '…').width > maxW && trimmed.length > 4) trimmed = trimmed.slice(0, -1);
        ctx.fillText(trimmed === rest ? rest : trimmed + '…', x, y + lines * lineH);
        return lines + 1;
      }
    } else {
      line = test;
    }
  }
  if (line) { ctx.fillText(line, x, y + lines * lineH); lines++; }
  return lines;
}

  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  const p2 = (n) => String(n).padStart(2, '0');
  const timeEl = $('#lqCdTime');
  if (timeEl) timeEl.textContent = days > 0 ? `${days}${L('দিন ', 'दिन ', 'd ')}${p2(hrs)}:${p2(mins)}:${p2(secs)}` : `${p2(hrs)}:${p2(mins)}:${p2(secs)}`;
  const labelEl = $('#lqCdLabel');
  if (labelEl) labelEl.textContent = L('শুরু হতে বাকি', 'शुरू होने में बाकी', 'until start');
  const sweep = $('#lqCdSweep');
  if (sweep) {
    const frac = secs / 60;
    sweep.style.strokeDashoffset = String(LQ_RING_C * (1 - frac));
  }
}
function lqMaybeAutoStart() {
  const ev = lqRoot.event;
  if (!ev || ev.status !== 'scheduled' || !ev.scheduledAt) return;
  if (Date.now() < ev.scheduledAt) return;
  if (lqAutoStarting) return;
  lqAutoStarting = true;
  const total = (lqRoot.state && lqRoot.state.total) || 15;
  fetch(LQ_DB + '/liveQuiz/state.json', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ qIndex: 0, total, lockedBy: null, lockedAnswer: null, qStartAt: Date.now() })
  }).then(() => fetch(LQ_DB + '/liveQuiz/event.json', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'live' })
  })).catch(() => {}).finally(() => { lqAutoStarting = false; });
}
let lqJoining = false;
function lqDoJoin() {
  if (lqJoining) return;
  const inp = $('#lqNameInput');
  const name = (inp.value || '').trim().slice(0, 24);
  if (!name) { inp.focus(); return; }
  lqJoining = true;
  const goBtn = $('#lqNameGo');
  if (goBtn) { goBtn.disabled = true; }
  if (inp) { inp.disabled = true; }
  lqName = name;
  try { localStorage.setItem('lq_name', name); } catch (_) {}
  fetch(LQ_DB + '/liveQuiz/players.json', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, score: 0, joinedAt: Date.now() })
  }).then((r) => r.json()).then((res) => {
    if (res && res.name) {
      lqPid = res.name;
      try { localStorage.setItem('lq_pid', lqPid); } catch (_) {}
      lqJoined = true;
    }
    lqJoining = false;
    lqRender();
  }).catch(() => {
    lqJoining = false;
    if (goBtn) { goBtn.disabled = false; }
    if (inp) { inp.disabled = false; }
  });
}
function lqFmtWhen(ts) {
  if (!ts) return '';
  try { return new Intl.DateTimeFormat(LOC[lang], { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }).format(new Date(ts)); }
  catch (_) { return new Date(ts).toLocaleString(); }
}
let lqQuizBlocked = false;
function lqUpdateQuizGate(ev) {
  const blocked = !!(ev && (ev.status === 'scheduled' || ev.status === 'live'));
  if (blocked !== lqQuizBlocked) {
    lqQuizBlocked = blocked;
    if (typeof render === 'function') render();
  }
}
function lqRender() {
  const banner = $('#lqBanner');
  if (!banner) return;
  const ev = lqRoot.event, st = lqRoot.state, players = lqRoot.players || {};
  const count = Object.keys(players).length;
  if (!ev || !ev.status) { banner.hidden = true; lqUpdateQuizGate(null); return; }
  banner.hidden = false;
  lqUpdateQuizGate(ev);
  lqMaybeAutoStart();
  lqTickCountdown();
  if (lqPid && players[lqPid]) lqJoined = true;
  $('#lqDot').hidden = ev.status !== 'live';
  $('#lqTitle').textContent = ev.title || L('লাইভ কুইজ ইভেন্ট', 'लाइव क्विज़ इवेंट', 'Live quiz event');
  $('#lqCount').textContent = L(`${nf.format(count)} জন যোগ দিয়েছে`, `${nf.format(count)} लोग शामिल हुए`, `${nf.format(count)} joined`);

  if (ev.status === 'scheduled') {
    $('#lqWhen').textContent = ev.scheduledAt ? L('শুরু হবে: ', 'शुरू होगा: ', 'Starts: ') + lqFmtWhen(ev.scheduledAt) : L('শীঘ্রই শুরু হবে', 'जल्द शुरू होगा', 'Starting soon');
  } else if (ev.status === 'live') {
    $('#lqWhen').textContent = L('🔴 এখনই লাইভ চলছে', '🔴 अभी लाइव चल रहा है', '🔴 Live now');
  } else if (ev.status === 'ended') {
    $('#lqWhen').textContent = L('ইভেন্ট শেষ হয়েছে', 'इवेंट समाप्त हो गया', 'Event has ended');
  }

  const joinBtn = $('#lqJoinBtn'), joinbox = $('#lqJoinbox');
  const evKey = (ev.title || '') + '|' + (ev.scheduledAt || '') + '|' + (ev.createdAt || '');
  if (evKey !== lqLastEvKey) { lqLastEvKey = evKey; lqBoxOpen = false; }
  if (lqJoined || ev.status === 'ended') {
    joinBtn.hidden = true;
    joinbox.hidden = true;
    lqBoxOpen = false;
  } else {
    joinBtn.hidden = false;
    joinBtn.textContent = L('যোগ দিন', 'जुड़ें', 'Join');
    joinbox.hidden = !lqBoxOpen;
    joinBtn.onclick = () => {
      lqBoxOpen = true;
      joinbox.hidden = false;
      $('#lqNameInput').value = lqName;
      $('#lqNameInput').placeholder = L('তোমার নাম লেখো', 'अपना नाम लिखें', 'Enter your name');
      $('#lqNameGo').textContent = L('যোগ দাও', 'जुड़ें', 'Go');
      $('#lqNameInput').focus();
    };
  }

  const play = $('#lqPlay');
  if (ev.status === 'ended') {
    play.hidden = false;
    const ranked = Object.entries(players).map(([id, p]) => ({ id, ...p })).sort((a, b) => (b.score || 0) - (a.score || 0) || (a.joinedAt || 0) - (b.joinedAt || 0));
    const medals = ['🥇', '🥈', '🥉'];
    if (!ranked.length) { play.innerHTML = `<p class="hint">${L('কেউ জয়েন করেনি।', 'कोई शामिल नहीं हुआ।', 'No one joined.')}</p>`; }
    else play.innerHTML = `<div class="lq-leader">` + ranked.slice(0, 3).map((p, i) => `<div class="lq-lrow"><span class="lq-medal">${medals[i]}</span><span class="lq-lname">${lqEsc(p.name)}</span><span class="lq-lscore">${L('স্কোর', 'स्कोर', 'Score')} ${nf.format(p.score || 0)}</span></div>`).join('') + `</div>`;
  } else if (ev.status === 'live' && lqJoined && st) {
    play.hidden = false;
    lqRenderQuestion(st, players);
  } else {
    play.hidden = true;
  }
}
function lqRenderQuestion(st, players) {
  const Q = QUIZ();
  const qi = st.qIndex || 0;
  const total = Math.min(st.total || Q.length, Q.length);
  const play = $('#lqPlay');
  if (qi >= total || qi >= Q.length) { play.innerHTML = `<p class="hint">${L('ফলাফলের অপেক্ষা করছি...', 'नतीजों का इंतज़ार...', 'Waiting for results...')}</p>`; return; }
  const [q, opts, ans] = Q[qi];
  const locked = st.lockedBy != null;
  const mine = players[lqPid] || { score: 0 };
  const optHtml = opts.map((o, i) => {
    let cls = 'lq-opt';
    if (locked && i === ans) cls += ' lqright';
    else if (locked && st.lockedAnswer === i && i !== ans) cls += ' lqwrong';
    return `<button type="button" class="${cls}" data-lq-opt="${i}" ${locked ? 'disabled' : ''}>${o}</button>`;
  }).join('');
  let firstLine = '';
  if (locked) {
    const who = players[st.lockedBy];
    const correct = st.lockedAnswer === ans;
    firstLine = `<p class="lq-firstby">${who ? lqEsc(who.name) : '?'} ${correct ? L('সঠিক উত্তর দিয়েছে ✅', 'ने सही उत्तर दिया ✅', 'answered correctly ✅') : L('ভুল উত্তর দিয়েছে ❌', 'ने ग़लत उत्तर दिया ❌', 'answered incorrectly ❌')}</p>`;
  }
  const revealMode = !!locked;
  const ringC = LQ_QRING_C;
  let ringFrac = 0, ringNum = 0;
  if (revealMode) {
    const lockedAt = st.lockedAt || Date.now();
    const remain = Math.max(0, LQ_REVEAL_MS - (Date.now() - lockedAt));
    ringFrac = remain / LQ_REVEAL_MS;
    ringNum = Math.ceil(remain / 1000);
  } else {
    const startedAt = st.qStartAt || Date.now();
    const remain = Math.max(0, LQ_QUESTION_MS - (Date.now() - startedAt));
    ringFrac = remain / LQ_QUESTION_MS;
    ringNum = Math.ceil(remain / 1000);
  }
  const ringHtml = `<div class="lq-qring-wrap${revealMode ? ' lq-qring-reveal' : ''}" id="lqQRingWrap"><svg class="lq-qring" viewBox="0 0 36 36"><circle class="lq-qring-track" cx="18" cy="18" r="18"></circle><circle class="lq-qring-sweep" id="lqQSweep" cx="18" cy="18" r="18" transform="rotate(-90 18 18)" style="stroke-dashoffset:${ringC * (1 - ringFrac)}"></circle></svg><span class="lq-qring-num" id="lqQNum">${ringNum}</span></div>`;
  play.innerHTML = `<div class="lq-qtop"><span class="lq-qtop-left">${ringHtml}${L('প্রশ্ন', 'प्रश्न', 'Question')} ${nf.format(qi + 1)} / ${nf.format(total)}</span><span>${L('তোমার স্কোর', 'तुम्हारा स्कोर', 'Your score')}: ${nf.format(mine.score || 0)}</span></div>` +
    `<p class="lq-q">${q}</p><div class="lq-opts">${optHtml}</div>` + firstLine;
  if (!locked) {
    play.querySelectorAll('[data-lq-opt]').forEach((btn) => btn.addEventListener('click', () => lqAnswer(qi, +btn.dataset.lqOpt, ans)));
  }
}
function lqAnswer(qi, pickIdx, ansIdx) {
  if (!lqPid) return;
  fetch(LQ_DB + '/liveQuiz/state.json', { headers: { 'X-Firebase-ETag': 'true' } }).then((res) => {
    const etag = res.headers.get('ETag');
    return res.json().then((data) => ({ etag, data }));
  }).then(({ etag, data }) => {
    if (!data || data.qIndex !== qi || data.lockedBy) return;
    const body = Object.assign({}, data, { lockedBy: lqPid, lockedAnswer: pickIdx, lockedAt: Date.now() });
    return fetch(LQ_DB + '/liveQuiz/state.json', {
      method: 'PUT', headers: { 'Content-Type': 'application/json', 'if-match': etag }, body: JSON.stringify(body)
    }).then((r) => {
      if (r.status === 412) return;
      if (pickIdx === ansIdx) {
        const cur = (lqRoot.players && lqRoot.players[lqPid] && lqRoot.players[lqPid].score) || 0;
        return fetch(LQ_DB + '/liveQuiz/players/' + lqPid + '.json', {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ score: cur + 10 })
        }).catch(() => {});
      }
    });
  }).catch(() => {});
}

buildMap();
applyHashState();
applyStatic();
labelMap();
render();
if (cur !== 'india') focusOn(cur);
lqInit();

</script>
</body></html>
