/* Layout: survey-sheet feel. Left: picture map of India with clickable regions (sticky on desktop). Right: tabbed fact panel. Phone: map first, panel below. */
:root {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --fg: #161E2E;
  --muted: #4B5563;
  --line: #E2E8F0;
  --accent: #C2410C;
  --accent-ink: #FFFFFF;
  --positive: #0F766E;
  --card-shadow: 0 4px 20px rgba(22, 30, 46, 0.05);
  --maphl: #C2410C;
  --sea: #CFE3F2;
  --zn: #BCD3E8;
  --zw: #E6D2A8;
  --zc: #C4DEBE;
  --ze: #D9C3DF;
  --zne: #A8DCD4;
  --zs: #F0C4B8;
  --font-display: 'Noto Serif Bengali', 'Kohinoor Bangla', 'Nirmala UI', serif;
  --font-body: 'Hind Siliguri', 'Kohinoor Bangla', 'Nirmala UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1120; --surface: #131C31; --fg: #F1F5F9; --muted: #94A3B8; --line: #24324A; --accent: #FB923C; --accent-ink: #1A0E05; --positive: #2DD4BF;
    --card-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
    --zn: #26455E; --zw: #55472A; --zc: #2C4B2F; --ze: #473554; --zne: #1E504B; --zs: #5A3329;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1120; --surface: #131C31; --fg: #F1F5F9; --muted: #94A3B8; --line: #24324A; --accent: #FB923C; --accent-ink: #1A0E05; --positive: #2DD4BF;
  --card-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
  --zn: #26455E; --zw: #55472A; --zc: #2C4B2F; --ze: #473554; --zne: #1E504B; --zs: #5A3329;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1320px; margin-inline: auto; }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; padding-bottom: 16px; border-bottom: 2px solid var(--fg); margin-bottom: 20px; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 6vw, 2.9rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--muted); max-width: 46ch; }
.asof { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; white-space: nowrap; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 32px; align-items: start; }
  .mapcol { position: sticky; top: 16px; }
}

.pickrow { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.pickrow label { font-size: 13px; color: var(--muted); white-space: nowrap; }
select { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }

.pickrow { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.pickrow label { font-size: 13px; color: var(--muted); white-space: nowrap; }
select { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }

.zoombar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.zoombar button { min-width: 38px; height: 34px; padding: 0 12px; background: var(--surface); border: 1px solid var(--fg); border-radius: 6px; cursor: pointer; font-size: 17px; line-height: 1; }
.zoombar #zreset { font-size: 14px; }
.zoombar button:hover:not(:disabled) { background: var(--fg); color: var(--bg); }
.zoombar button:disabled { opacity: .35; cursor: default; }
.zhint { font-size: 12.5px; color: var(--muted); }

.mapwrap { position: relative; }
.mapvp { background: #F1F4F7; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: var(--card-shadow); }
.mapvp.zoomed { overflow: auto; max-height: min(78vh, 780px); overscroll-behavior: contain; }
.stage { width: 100%; }
#map { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 13px; padding: 2px 9px; border-radius: 4px; white-space: nowrap; }

.reg { fill: var(--maphl); fill-opacity: 0; stroke: none; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
.reg:hover { fill-opacity: .3; }
.reg:focus-visible { stroke: #000; stroke-width: 3px; vector-effect: non-scaling-stroke; }
.hot { fill-opacity: .18; stroke: var(--maphl); stroke-width: 2px; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.hot:hover { fill-opacity: .42; }
.hlc { fill: var(--maphl); fill-opacity: .42; stroke: var(--maphl); stroke-width: 2.5px; vector-effect: non-scaling-stroke; pointer-events: none; stroke-dasharray: none; }

.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 10px; font-size: 13px; color: var(--muted); }
#chips { display: contents; }
.chip { font-size: 13px; background: var(--surface); border: 1px dashed var(--fg); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
.chip:hover { background: var(--fg); color: var(--bg); }
.maphint { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; max-width: 60ch; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px max(16px, 3vw) 24px; min-width: 0; scroll-margin-top: 12px; box-shadow: var(--card-shadow); }
.phead { display: flex; flex-wrap: wrap; align-items: start; justify-content: space-between; gap: 8px 16px; }
.phead h2 { font-family: var(--font-display); font-size: clamp(1.6rem, 5vw, 2.25rem); line-height: 1.2; margin: 0; text-wrap: balance; }
.phead p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.pbtns { display: flex; gap: 8px; flex-wrap: wrap; }
#tomap { display: none; }
@media (max-width: 899px) { #tomap { display: inline-block; } }
#tomap, #back { font-size: 14px; background: transparent; border: 1px solid var(--fg); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
#tomap:hover, #back:hover { background: var(--fg); color: var(--bg); }

.pbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px 22px; margin-top: 16px; }
#tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; align-content: start; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

.vsstatelink { font: inherit; font-weight: 700; color: var(--fg); background: transparent; border: none; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; text-align: left; line-height: 1.25; }
.vsstatelink:hover { color: var(--accent); }

/* Ranking filter pills - clean wrapped pills on all screen sizes */
.seg-wrap { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 12px; }
.seg-group { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.seg-glabel { font-size: 12.5px; font-weight: 700; color: var(--muted); min-width: 110px; }
.seg-group .seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; border: 0; border-radius: 0; overflow: visible; flex: 1; }
.seg-group .seg button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
.seg-group .seg button + button { border-left: 1px solid var(--line); }
.seg-group .seg button:hover { border-color: var(--accent); color: var(--accent); }
.seg-group .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }

@media (max-width: 640px) {
  .vspick { gap: 6px; }

  .vspick select { font-size: 13px; padding: 7px 8px; }
  .vsadd { width: 100%; text-align: center; padding: 7px 10px; font-size: 13px; }
  .vstable th, .vstable td { padding: 8px 6px; font-size: 12.5px; word-break: break-word; }
  .vstable thead th { font-size: 13px; padding-block: 9px; }
  .vstable td:first-child, .vstable th:first-child { font-size: 12px; padding-left: 8px; padding-right: 5px; }
  .vstable[data-cols="2"] th:first-child, .vstable[data-cols="2"] td:first-child { width: 35%; }
  .vstable[data-cols="2"] th:not(:first-child), .vstable[data-cols="2"] td:not(:first-child) { width: 32.5%; }
  .vstable:not([data-cols="2"]) td:first-child, .vstable:not([data-cols="2"]) th:first-child { min-width: 98px; max-width: 112px; }
  .vstable:not([data-cols="2"]) th:not(:first-child), .vstable:not([data-cols="2"]) td:not(:first-child) { min-width: 96px; }
  .vstable tr.vsghead th { font-size: 11.5px; padding-left: 8px; }
  .seg-group { flex-direction: column; gap: 5px; }
  .seg-glabel { min-width: 0; }
  .seg-group .seg button { padding: 4px 10px; font-size: 12.5px; }
}
.top-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.nav-pill { background: var(--surface); color: var(--fg); border: 1px solid var(--fg); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; line-height: 1.3; transition: background .15s, color .15s, border-color .15s; }
.nav-pill:hover { background: var(--fg); color: var(--bg); }
.home-pill.is-away { border-color: var(--accent); color: var(--accent); }
.home-pill.is-away:hover { background: var(--accent); color: var(--accent-ink); }
.theme-pill { padding: 6px 10px; font-size: 15px; }
.sharebtn.dl:hover { background: var(--positive); border-color: var(--positive); color: #fff; }
.mapquiz-box { background: var(--bg); border: 1.5px solid var(--accent); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.mapquiz-prompt { font-size: 17px; font-weight: 700; margin: 4px 0 10px; color: var(--fg); }
.mapquiz-fb { font-size: 14.5px; font-weight: 600; padding: 8px 12px; border-radius: 8px; margin: 10px 0; }
.mapquiz-fb.ok { background: rgba(15, 118, 110, 0.14); color: var(--positive); border: 1px solid var(--positive); }
.mapquiz-fb.err { background: rgba(194, 65, 12, 0.14); color: var(--accent); border: 1px solid var(--accent); }
.mapquiz-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.mapquiz-tomap { background: var(--surface); border: 1px solid var(--fg); border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.mapquiz-tomap:hover { background: var(--fg); color: var(--bg); }
@media (min-width: 900px) { .mapquiz-tomap { display: none; } }

.vsstatelink { font: inherit; font-weight: 600; color: var(--fg); background: transparent; border: none; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.vsstatelink:hover { color: var(--accent); }
.seg-wrap { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 8px; }
.seg-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

#map.choro > image { filter: grayscale(1) brightness(1.12); }

.totd { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin: 14px 0; }

.sharebtns { display: flex; gap: 6px; flex-wrap: wrap; }

.sharebtn.fb:hover { background: #1877F2; border-color: #1877F2; color: #fff; }

  :root:not([data-theme="light"]) .badge-ut { background: #1B2D4A; color: #8FB6F0; }

}
:root[data-theme="dark"] .badge-state, :root[data-theme="dark"] .badge-fresh { background: #1C3A26; color: #7FDA9B; }
:root[data-theme="dark"] .badge-ut { background: #1B2D4A; color: #8FB6F0; }
:root[data-theme="dark"] .badge-est { background: #4A3215; color: #F0B868; }

.lq-banner { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid #D11A2A; border-radius: 8px; padding: 12px 16px; margin: 14px 0; }
.lq-row { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.lq-dot { width: 10px; height: 10px; border-radius: 50%; background: #D11A2A; flex: 0 0 auto; animation: lqpulse 1.4s infinite; }
@keyframes lqpulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.lq-info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lq-info strong { font-size: 15px; }
.lq-when, .lq-count { font-size: 13px; color: var(--muted); }
.lq-join { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 8px 18px; font-weight: 600; cursor: pointer; flex: 0 0 auto; }
.lq-joinbox { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.lq-joinbox input { flex: 1; min-width: 140px; font: inherit; padding: 8px 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; }
.lq-joinbox button { background: var(--fg); color: var(--bg); border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
.lq-countdown { display: flex; align-items: center; justify-content: center; gap: 0; margin: 14px 0 4px; position: relative; width: 112px; height: 112px; margin-left: auto; margin-right: auto; }
.lq-cd-ring { width: 112px; height: 112px; transform: rotate(0deg); }
.lq-cd-track { fill: none; stroke: var(--line); stroke-width: 9; }
:root[data-theme="dark"] .lq-cd-track { stroke: #2A3B4D; }
.lq-cd-sweep { fill: none; stroke: #F08A1E; stroke-width: 9; stroke-linecap: round; stroke-dasharray: 326.7; stroke-dashoffset: 326.7; transition: stroke-dashoffset .95s linear; }
.lq-cd-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.lq-cd-time { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 700; color: var(--fg); letter-spacing: .3px; }
.lq-cd-label { font-size: 10.5px; color: var(--muted); }
.lq-play { margin-top: 12px; }
.lq-qtop { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; gap: 10px; }
.lq-qtop-left { display: flex; align-items: center; gap: 10px; }
.lq-qring-wrap { position: relative; width: 36px; height: 36px; flex: 0 0 auto; }
.lq-qring { width: 36px; height: 36px; display: block; }
.lq-qring-track { fill: none; stroke: var(--line); stroke-width: 4; }
:root[data-theme="dark"] .lq-qring-track { stroke: #2A3B4D; }
.lq-qring-sweep { fill: none; stroke: #F08A1E; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 113.1; transition: stroke-dashoffset .22s linear, stroke .2s; }
.lq-qring-wrap.lq-qring-reveal .lq-qring-sweep { stroke: #2E9E5B; }
.lq-qring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; }

.lq-opts { display: grid; gap: 8px; }
.lq-opt { text-align: left; padding: 11px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font: inherit; color: var(--fg); }
.lq-opt:hover:not(:disabled) { border-color: var(--accent); }
.lq-opt:disabled { cursor: default; opacity: .8; }
.lq-opt.lqright { border-color: #2e9e53; background: rgba(46, 158, 83, .14); font-weight: 600; }
.lq-opt.lqwrong { border-color: #c0392b; background: rgba(192, 57, 43, .14); }
.lq-firstby { font-size: 13px; color: var(--muted); margin-top: 10px; }
.lq-leader { margin-top: 4px; }
.lq-lrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.lq-lrow:last-child { border-bottom: 0; }
.lq-medal { font-size: 19px; width: 26px; text-align: center; flex: 0 0 auto; }
.lq-lname { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lq-lscore { color: var(--muted); font-size: 13px; flex: 0 0 auto; }


/* ===== Professional Editorial & Parameter Design Upgrade ===== */
:root {
  --font-display: 'Baloo Da 2', 'Noto Serif Bengali', 'Kohinoor Bangla', sans-serif;
  --font-body: 'Hind Siliguri', 'Plus Jakarta Sans', system-ui, sans-serif;
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --fg: #0F172A;
  --muted: #475569;
  --line: #E2E8F0;
  --accent: #C2410C;
  --card-shadow: 0 10px 30px -6px rgba(15, 23, 42, 0.07), 0 2px 8px -2px rgba(15, 23, 42, 0.04);
}
html[lang="en"] {
  --font-display: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-body: 'Plus Jakarta Sans', 'Hind', system-ui, sans-serif;
}
html[lang="hi"] {
  --font-display: 'Noto Serif Devanagari', 'Hind', serif;
  --font-body: 'Hind', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080E1A;
    --surface: #11192C;
    --fg: #F1F5F9;
    --muted: #94A3B8;
    --line: #1E293B;
    --card-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] {
  --bg: #080E1A;
  --surface: #11192C;
  --fg: #F1F5F9;
  --muted: #94A3B8;
  --line: #1E293B;
  --card-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.45);
}

body {
  background-image: radial-gradient(at 0% 0%, rgba(194, 65, 12, 0.045) 0px, transparent 50%),
                    radial-gradient(at 100% 0%, rgba(15, 118, 110, 0.045) 0px, transparent 50%);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Header & Top Bar */
.top {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 4px solid transparent;
  border-image: linear-gradient(90deg, #FF9933 0%, #C2410C 38%, #1E40AF 68%, #138808 100%) 1;
  border-radius: 14px;
  padding: 18px 22px;
  box-shadow: var(--card-shadow);
  margin-bottom: 22px;
}
.top h1 {
  letter-spacing: -0.015em;
  background: linear-gradient(120deg, var(--fg) 30%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.asof {
  background: color-mix(in srgb, var(--accent) 8%, var(--bg));
  border-color: color-mix(in srgb, var(--accent) 25%, var(--line));
  color: var(--fg);
  font-weight: 500;
  padding: 4px 13px;
}

/* Left Map Card & Controls */
.mapcol {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  box-shadow: var(--card-shadow);
}
.pickrow label, .choropick label {
  font-weight: 600;
  color: var(--fg);
}
select, .searchrow input {
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--bg);
  transition: border-color .15s, box-shadow .15s, background .15s;
}
select:hover, .searchrow input:hover {
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
}
select:focus, .searchrow input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
  background: var(--surface);
  outline: none;
}
.zoombar button {
  border: 1px solid var(--line);
  background: var(--bg);
  border-radius: 8px;
  font-weight: 600;
  transition: all .15s;
}
.zoombar button:hover:not(:disabled) {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.mapvp {
  border-radius: 12px;
  border: 1px solid var(--line);
}
.chip {
  border-style: solid;
  border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
  background: color-mix(in srgb, var(--accent) 6%, var(--bg));
  font-weight: 600;
  transition: all .15s;
}
.chip:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  transform: translateY(-1px);
}

/* Right Content Panel */
.panel {
  border-radius: 16px;
  border: 1px solid var(--line);
  padding: 22px max(18px, 2.6vw) 26px;
}
.phead {
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.phead h2 {
  letter-spacing: -0.01em;
}
.pbtns button, .sharebtn {
  border-radius: 8px;
  font-weight: 600;
  transition: all .15s;
}
@media (min-width: 640px) {
  .pbody { grid-template-columns: 184px minmax(0, 1fr); gap: 8px 24px; }
  #tabs { padding-right: 10px; }
}

/* Parameter Cards (.facts & .fact) */
.facts {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.fact {
  --p-accent: #2563EB;
  --p-bg: #F8FAFC;
  display: grid;
  grid-template-columns: minmax(110px, 34%) minmax(0, 1fr);
  gap: 6px 16px;
  align-items: start;
  padding: 13px 16px;
  background: var(--p-bg);
  border: 1px solid var(--line);
  border-left: 4px solid var(--p-accent);
  border-radius: 11px;
  transition: transform .14s ease, box-shadow .16s ease, border-color .16s ease;
}
.fact:nth-child(6n+1) { --p-accent: #2563EB; --p-bg: #F4F8FF; }
.fact:nth-child(6n+2) { --p-accent: #0D9488; --p-bg: #F1FBF9; }
.fact:nth-child(6n+3) { --p-accent: #D97706; --p-bg: #FFFBEB; }
.fact:nth-child(6n+4) { --p-accent: #7C3AED; --p-bg: #F7F4FF; }
.fact:nth-child(6n+5) { --p-accent: #059669; --p-bg: #F2FBF7; }
.fact:nth-child(6n+6) { --p-accent: #E11D48; --p-bg: #FFF5F7; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .fact:nth-child(6n+1) { --p-accent: #60A5FA; --p-bg: rgba(37, 99, 235, 0.11); }
  :root:not([data-theme="light"]) .fact:nth-child(6n+2) { --p-accent: #2DD4BF; --p-bg: rgba(13, 148, 136, 0.11); }
  :root:not([data-theme="light"]) .fact:nth-child(6n+3) { --p-accent: #FBBF24; --p-bg: rgba(217, 119, 6, 0.11); }
  :root:not([data-theme="light"]) .fact:nth-child(6n+4) { --p-accent: #A78BFA; --p-bg: rgba(124, 58, 237, 0.11); }
  :root:not([data-theme="light"]) .fact:nth-child(6n+5) { --p-accent: #34D399; --p-bg: rgba(5, 150, 105, 0.11); }
  :root:not([data-theme="light"]) .fact:nth-child(6n+6) { --p-accent: #FB7185; --p-bg: rgba(225, 29, 72, 0.11); }
}
:root[data-theme="dark"] .fact:nth-child(6n+1) { --p-accent: #60A5FA; --p-bg: rgba(37, 99, 235, 0.11); }
:root[data-theme="dark"] .fact:nth-child(6n+2) { --p-accent: #2DD4BF; --p-bg: rgba(13, 148, 136, 0.11); }
:root[data-theme="dark"] .fact:nth-child(6n+3) { --p-accent: #FBBF24; --p-bg: rgba(217, 119, 6, 0.11); }
:root[data-theme="dark"] .fact:nth-child(6n+4) { --p-accent: #A78BFA; --p-bg: rgba(124, 58, 237, 0.11); }
:root[data-theme="dark"] .fact:nth-child(6n+5) { --p-accent: #34D399; --p-bg: rgba(5, 150, 105, 0.11); }
:root[data-theme="dark"] .fact:nth-child(6n+6) { --p-accent: #FB7185; --p-bg: rgba(225, 29, 72, 0.11); }

.fact:hover {
  transform: translateY(-1px);
  border-color: color-mix(in srgb, var(--p-accent) 45%, var(--line));
  box-shadow: 0 6px 16px -4px rgba(15, 23, 42, 0.08);
}
.fact dt {
  color: var(--p-accent);
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1.45;
  display: flex;
  align-items: center;
  gap: 7px;
}
.fact dt::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--p-accent);
  flex: 0 0 auto;
  opacity: 0.85;
}
.fact dd {
  font-size: 15.5px;
  font-weight: 600;
  color: var(--fg);
  line-height: 1.5;
}
.fact dd small {
  margin-top: 5px;
  padding-top: 5px;
  border-top: 1px dashed color-mix(in srgb, var(--line) 85%, transparent);
  color: var(--muted);
  font-size: 12.8px;
}
@media (max-width: 520px) {
  .fact {
    grid-template-columns: minmax(0, 1fr);
    gap: 4px;
    padding: 12px 14px;
  }
}

/* Section Subheadings */
.sub {
  font-family: var(--font-display);
  font-size: 1.18rem;
  font-weight: 700;
  color: var(--fg);
  background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 11%, var(--bg)), transparent);
  border-left: 4px solid var(--accent);
  border-top: 0;
  border-radius: 8px;
  padding: 8px 13px;
  margin: 22px 0 12px;
}
.sub:first-child { margin-top: 2px; }

/* Cabinet Rows */
.cab-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0 0 18px;
}
.cab-row {
  display: grid;
  grid-template-columns: minmax(140px, 40%) minmax(0, 1fr);
  gap: 4px 14px;
  padding: 11px 15px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 4px solid #7C3AED;
  border-radius: 10px;
  font-size: 14.5px;
  transition: transform .12s ease, border-color .15s ease;
}
.cab-row:nth-child(even) { border-left-color: #2563EB; }
.cab-row:hover { transform: translateX(2px); border-color: #7C3AED; }
.cab-pm .cab-row {
  background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, var(--surface)), var(--bg));
  border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
  border-left: 5px solid var(--accent);
  font-size: 17.5px;
  padding: 14px 16px;
}
.cab-name { font-weight: 700; color: var(--fg); }
.cab-port { color: var(--muted); font-weight: 500; }

/* Indices Cards (.idx) */
.idx {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.idx li {
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 4px solid #0284C7;
  border-radius: 11px;
  transition: transform .14s ease, box-shadow .16s ease;
}
.idx li:nth-child(odd) { border-left-color: #0284C7; }
.idx li:nth-child(even) { border-left-color: #0D9488; }
.idx li:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px -4px rgba(15, 23, 42, 0.08);
}
.idx-l { font-weight: 700; font-size: 15.5px; color: var(--fg); }
.idx-v {
  background: color-mix(in srgb, var(--accent) 12%, var(--surface));
  color: var(--accent);
  border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 1.1rem;
}

/* Market & Chart Blocks (.cbl) */
.cbl {
  padding: 14px 16px;
  margin-bottom: 10px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 4px solid #D97706;
  border-radius: 11px;
}
.meter {
  height: 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--line) 85%, transparent);
}
.meter i {
  background: linear-gradient(90deg, var(--accent), #F59E0B);
  border-radius: 999px;
}

/* Fundamental Rights & Places Cards */
.rgt-list { gap: 10px; }
.rgt-card {
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 4px solid #EA580C;
  border-radius: 11px;
}
.places {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.places li {
  padding: 12px 16px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 4px solid #0891B2;
  border-radius: 10px;
  font-weight: 500;
}

/* Comparison Rows */
.cmp {
  border-radius: 12px;
  background: var(--bg);
}
.crow {
  padding: 9px 12px;
  transition: background .12s;
}
.crow:hover {
  background: color-mix(in srgb, var(--accent) 8%, var(--surface));
}
.cr {
  font-weight: 700;
  color: var(--accent);
}
.cn { font-weight: 600; }

/* Hint / Source Callout */
.hint {
  background: color-mix(in srgb, var(--muted) 7%, var(--bg));
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 14px;
  line-height: 1.55;
}


/* ===== Mobile Responsiveness & Overflow Fix ===== */
html, body {
  max-width: 100%;
  overflow-x: hidden;
}
body {
  margin: 0;
  padding-top: max(12px, env(safe-area-inset-top, 12px));
  padding-bottom: max(28px, env(safe-area-inset-bottom, 28px));
  padding-left: max(10px, env(safe-area-inset-left, 10px));
  padding-right: max(10px, env(safe-area-inset-right, 10px));
}
.wrap, .layout, .mapcol, .panel, .top, .totd, .lq-banner {
  min-width: 0;
  max-width: 100%;
}
.topr {
  min-width: 0;
  max-width: 100%;
}
.top-controls {
  max-width: 100%;
}
.asof {
  white-space: normal;
  word-break: break-word;
  max-width: 100%;
  border-radius: 10px;
  line-height: 1.4;
}

/* ===== Professional Colorful Electoral Analytics & Interactive Roster UI ===== */
.pol-click-fact {
  cursor: pointer;
  position: relative;
  transition: transform .15s ease, box-shadow .18s ease, border-color .18s ease;
}
.pol-click-fact:hover {
  transform: translateY(-2px);
  border-color: var(--accent) !important;
  box-shadow: 0 8px 22px rgba(194, 65, 12, 0.16);
}
.pol-click-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: 10px;
  padding: 2px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent-ink);
  background: var(--accent);
}
.pol-kpi-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.pol-kpi {
  --kc: #3B82F6;
  background: color-mix(in srgb, var(--kc) 9%, var(--bg));
  border: 1px solid color-mix(in srgb, var(--kc) 30%, var(--line));
  border-top: 3px solid var(--kc);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.pol-kpi-lbl {
  font-size: 12px;
  font-weight: 700;
  color: var(--kc);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.pol-kpi-val {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--fg);
  line-height: 1.2;
}
.pol-kpi-sub {
  font-size: 12px;
  color: var(--muted);
}

/* Stacked 100% Multi-Color Composition Bar */
.stack-bar-wrap {
  margin: 4px 0 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
}
.stack-bar {
  display: flex;
  width: 100%;
  height: 14px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--line);
  gap: 2px;
}
.stack-seg {
  height: 100%;
  min-width: 3px;
  transition: width .35s ease;
}
.stack-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--muted);
}
.stack-leg-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}
.stack-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex: 0 0 auto;
}

/* Modern 2-Column Colorful Metric Cards (Religion, Age, Parties) */
.viz-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.viz-card {
  --vc: #3B82F6;
  background: color-mix(in srgb, var(--vc) 7%, var(--bg));
  border: 1px solid color-mix(in srgb, var(--vc) 28%, var(--line));
  border-left: 4px solid var(--vc);
  border-radius: 12px;
  padding: 11px 13px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: transform .15s ease, box-shadow .16s ease, border-color .16s ease;
}
.viz-card:hover {
  transform: translateY(-1px);
  border-color: var(--vc);
  box-shadow: 0 6px 18px color-mix(in srgb, var(--vc) 16%, transparent);
}
.viz-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.viz-lbl {
  font-weight: 700;
  font-size: 13.8px;
  color: var(--fg);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.viz-pill {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 800;
  color: var(--vc);
  background: color-mix(in srgb, var(--vc) 15%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--vc) 35%, transparent);
  padding: 1px 9px;
  border-radius: 999px;
  white-space: nowrap;
}
.viz-count {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
}
.viz-track {
  width: 100%;
  height: 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--line) 85%, transparent);
  overflow: hidden;
}
.viz-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--vc), color-mix(in srgb, var(--vc) 72%, #FFFFFF));
}

/* Election History Timeline Cards */
.hist-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
}
.hist-card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-left: 4px solid #6366F1;
  border-radius: 12px;
  padding: 13px 15px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.hist-card:nth-child(2) { border-left-color: #0EA5E9; }
.hist-card:nth-child(3) { border-left-color: #10B981; }
.hist-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
}
.hist-yr {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 15px;
  color: var(--fg);
  background: color-mix(in srgb, #6366F1 14%, var(--surface));
  border: 1px solid color-mix(in srgb, #6366F1 32%, transparent);
  padding: 2px 10px;
  border-radius: 8px;
}
.hist-outcome {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.hist-win {
  color: #10B981;
  font-weight: 700;
}
.hist-run {
  color: #38BDF8;
  font-weight: 700;
}
.hist-parties {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.hist-ptag {
  --pc: #64748B;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12.5px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--pc) 12%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--pc) 35%, transparent);
  color: var(--fg);
}
.hist-ptag b {
  color: var(--pc);
  font-weight: 800;
}

/* Interactive Clickable Roster Drawer */
.roster-box {
  margin: 14px 0 18px;
  padding: 14px 16px;
  background: var(--bg);
  border: 1.5px solid color-mix(in srgb, var(--accent) 45%, var(--line));
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
}
.roster-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.roster-head h4 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.08rem;
  color: var(--accent);
}
.roster-close {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 11px;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
}
.roster-close:hover {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
}
.roster-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}
.roster-fbtn {
  padding: 4px 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.roster-fbtn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.roster-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 8px;
  max-height: 360px;
  overflow-y: auto;
}
.roster-item {
  --pc: #3B82F6;
  background: color-mix(in srgb, var(--pc) 7%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--pc) 28%, var(--line));
  border-left: 4px solid var(--pc);
  border-radius: 10px;
  padding: 9px 11px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.roster-mname {
  font-weight: 700;
  font-size: 13.8px;
  color: var(--fg);
}
.roster-meta {
  font-size: 12px;
  color: var(--muted);
}
.roster-party {
  display: inline-flex;
  align-self: flex-start;
  margin-top: 2px;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 800;
  color: var(--pc);
  background: color-mix(in srgb, var(--pc) 16%, var(--surface));
}
.roster-ext {
  display: inline-block;
  margin-top: 10px;
  font-size: 12.5px;
  font-weight: 600;
  color: #38BDF8;
  text-decoration: underline;
}

@media (max-width: 639px) {
  .pol-kpi-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }
  .viz-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }
  .pol-kpi-val {
    font-size: 1.2rem;
  }
}

/* ===== Auto-Cycling Daily Fact of the Day (20/day · 30s cycle) ===== */
.totd {
  --tc: var(--accent);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 8px 14px;
  flex-wrap: wrap;
  background: color-mix(in srgb, var(--tc) 5.5%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--tc) 30%, var(--line));
  border-left: 4.5px solid var(--tc);
  border-radius: 12px;
  padding: 11px 15px 14px;
  margin: 14px 0;
  box-shadow: var(--card-shadow);
  transition: border-color .25s ease, background .25s ease;
}
.totd-head {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}
.totd-lbl {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
  color: var(--tc);
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.totd-cat {
  font-size: 11.5px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 999px;
  color: var(--tc);
  background: color-mix(in srgb, var(--tc) 14%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--tc) 34%, transparent);
  white-space: nowrap;
}
.totd-cnt {
  font-size: 11.5px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.totd-txt {
  flex: 1 1 280px;
  min-width: 0;
  margin: 0;
  font-size: 14.8px;
  font-weight: 500;
  line-height: 1.5;
  color: var(--fg);
}
@keyframes totdFadeIn {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}
.totd-txt.totd-anim {
  animation: totdFadeIn .32s ease;
}
@media (prefers-reduced-motion: reduce) {
  .totd-txt.totd-anim { animation: none; }
}
.totd-ctrls {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.totd-btn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all .15s ease;
}
.totd-btn:hover {
  background: var(--tc);
  border-color: var(--tc);
  color: #FFFFFF;
}
.totd-btn[aria-pressed="true"] {
  background: color-mix(in srgb, var(--tc) 18%, var(--surface));
  border-color: var(--tc);
  color: var(--tc);
}
.totd-prog {
  position: absolute;

}

function applyChoro() {
  const g = $('#choro'), leg = $('#legend');
  if (choroKey === 'none') { g.innerHTML = ''; svg.classList.remove('choro'); leg.hidden = true; return; }
  const [name, get, fmt] = CH()[choroKey];
  const vals = T.map((x) => [x.id, get(x)]).filter(([, v]) => v != null).sort((a, b) => a[1] - b[1]);
  const bin = {}, ranges = [[], [], [], [], []];
  vals.forEach(([id, v], i) => { const b = Math.min(4, Math.floor((i / vals.length) * 5)); bin[id] = b; ranges[b].push(v); });
  let h = '';
  for (const id in REG) if (bin[id] != null) h += `<path d="${REG[id]}" fill="${STEPS[bin[id]]}" fill-rule="evenodd"/>`;
  for (const o of HOT) if (bin[o.id] != null) h += o.t === 'c' ? `<circle cx="${o.x}" cy="${o.y}" r="${o.r}" fill="${STEPS[bin[o.id]]}"/>` : `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="12" fill="${STEPS[bin[o.id]]}"/>`;
  g.innerHTML = h;
  svg.classList.add('choro');
  leg.innerHTML = `<b>${name}:</b>` + ranges.map((r, i) => r.length ? `<span><i style="background:${STEPS[i]}"></i>${fmt(r[0])}–${fmt(r[r.length - 1])}</span>` : '').join('') + `<span><i style="background:#ccc"></i>${L('তথ্য নেই', 'डेटा नहीं', 'No data')}</span>`;
  leg.hidden = false;
}

function setZoom(z, fx = 0.5, fy = 0.5) {
  z = Math.max(1, Math.min(5, z));
  if (z === zoom) return;
  const px = (vp.scrollLeft + vp.clientWidth * fx) / stage.clientWidth;
  const py = (vp.scrollTop + vp.clientHeight * fy) / stage.clientHeight;
  zoom = z;
  stage.style.width = z * 100 + '%';
  vp.classList.toggle('zoomed', z > 1);
  vp.scrollLeft = px * stage.clientWidth - vp.clientWidth * fx;
  vp.scrollTop = py * stage.clientHeight - vp.clientHeight * fy;
  $('#zin').disabled = z >= 5;
  $('#zout').disabled = z <= 1;
}
function focusOn(id) {
  if (id === 'india') { setZoom(1); return; }
  const b = BB[id];
  if (!b) return;
  if ((b[2] - b[0]) * (b[3] - b[1]) < 30000 && zoom < 3) setZoom(3);
  requestAnimationFrame(() => {
    if (zoom <= 1) return;
    const cx = ((b[0] + b[2]) / 2 / 1280) * stage.clientWidth, cy = ((b[1] + b[3]) / 2 / 1495) * stage.clientHeight;
    vp.scrollTo({ left: cx - vp.clientWidth / 2, top: cy - vp.clientHeight / 2, behavior: reduceMotion ? 'auto' : 'smooth' });
  });
}
function highlight() {
  const g = $('#hl');
  g.innerHTML = '';
  const targetHl = (cur === 'india' && tab === 'quiz' && quizMode === 'map' && mapQuizHighlight) ? mapQuizHighlight : cur;
  document.querySelectorAll('.reg').forEach((t) => {

    if (!on) return;
    const c = t.cloneNode(false);
    ['tabindex', 'role', 'aria-pressed', 'aria-label', 'data-go'].forEach((k) => c.removeAttribute(k));
    c.setAttribute('class', 'hlc');
    g.appendChild(c);
  });
}

    if (hasLiveVal) last[1] = liveVal;
  } else if (hasLiveVal) {
    arr.push([liveKey, liveVal]);
    if (arr.length > 7) arr.shift();
  }
  return arr;
}

function metalBlock() {

  const monMap = { Jan: ['জানুয়ারি', 'जनवरी', 'Jan'], Feb: ['ফেব্রুয়ারি', 'फ़रवरी', 'Feb'], Mar: ['মার্চ', 'मार्च', 'Mar'], Apr: ['এপ্রিল', 'अप्रैल', 'Apr'], May: ['মে', 'मई', 'May'], Jun: ['জুন', 'जून', 'Jun'], Jul: ['জুলাই', 'जुलाई', 'Jul'], Aug: ['আগস্ট', 'अगस्त', 'Aug'], Sep: ['সেপ্টেম্বর', 'सितंबर', 'Sep'], Oct: ['অক্টোবর', 'अक्टूबर', 'Oct'], Nov: ['নভেম্বর', 'नवंबर', 'Nov'], Dec: ['ডিসেম্বর', 'दिसंबर', 'Dec'] };
  const mon = (d) => { const [n, m] = String(d).split(' '); const mm = monMap[m] || [m, m, m]; return L(`${nf.format(+n)} ${mm[0]}`, `${nf.format(+n)} ${mm[1]}`, `${n} ${mm[2]}`); };

  const renderMetalSeries = (arr, title, themeColor, gradCss, isLiveSeries) => {
    const vals = arr.map((x) => x[1]);
    const mx = Math.max(...vals), mn = Math.min(...vals);
    const span = Math.max(mx * 0.08, mx - mn);
    const floor = Math.max(0, mn - span * 0.35);
    const firstV = vals[0], lastV = vals[vals.length - 1];
    const chgPct = ((lastV - firstV) / Math.max(1, firstV)) * 100;
    const trendCls = chgPct < 0 ? 'down' : chgPct > 0 ? 'up' : 'flat';
    const trendTxt = `${chgPct > 0 ? '▲ +' : chgPct < 0 ? '▼ ' : ''}${nf1.format(chgPct)}%`;

    const rowsHtml = arr.map(([d, v], idx) => {
      const pct = Math.max(16, Math.min(100, ((v - floor) / Math.max(1, mx - floor)) * 100));
      const prev = idx > 0 ? arr[idx - 1][1] : null;
      const diff = prev != null ? v - prev : 0;
      const isLast = idx === arr.length - 1;
      const diffHtml = prev != null && diff !== 0
        ? `<span class="mkt-delta ${diff < 0 ? 'down' : 'up'}">${diff > 0 ? '+' : '−'}₹${nf.format(Math.abs(diff))}</span>`
        : '';
      const latestTag = isLast ? `<span class="mkt-mini-tag">${isLiveSeries ? L('● লাইভ', '● लाइव', '● LIVE') : L('সর্বশেষ', 'नवीनतम', 'Latest')}</span>` : '';
      return `<div class="mkt-bar-row${isLast ? ' is-latest' : ''}" style="--mc:${themeColor}">
        <div class="mkt-bar-top">
          <span class="mkt-bar-lbl"><i class="stack-dot" style="background:${themeColor}"></i>${mon(d)} ${latestTag}</span>
          <span class="mkt-bar-right">${diffHtml}<b class="mkt-bar-val">₹${nf.format(v)}</b></span>
        </div>

    }).join('');

    return `<div class="mkt-panel" style="--mp:${themeColor}">
      <div class="mkt-panel-head">

    </div>
    <div class="pol-kpi" style="--kc:#EAB308">
      <span class="pol-kpi-lbl">${L('২২ ক্যারেট সোনা (১০ গ্রাম)', '22 कैरेट सोना (10 ग्राम)', '22K Gold (10 g)')}</span>
      <span class="pol-kpi-val">₹${nf.format(g22Kol)}</span>
      <span class="pol-kpi-sub">${L(`দিল্লি ₹${nf.format(g22)} · +মেকিং ও ৩% GST`, `दिल्ली ₹${nf.format(g22)} · +मेकिंग व 3% GST`, `Delhi ₹${nf.format(g22)} · +Making & 3% GST`)}</span>
    </div>
    <div class="pol-kpi" style="--kc:#38BDF8">
      <span class="pol-kpi-lbl">${L('রুপো (প্রতি কেজি)', 'चाँदी (प्रति किलो)', 'Silver (per kg)')}</span>
      <span class="pol-kpi-val">₹${nf.format(slv)}</span>
      <span class="pol-kpi-sub">${L(`₹${nf.format(Math.round(slv / 1000))}/গ্রাম · ${dtLbl}`, `₹${nf.format(Math.round(slv / 1000))}/ग्राम · ${dtLbl}`, `₹${nf.format(Math.round(slv / 1000))}/g · ${dtLbl}`)}</span>
    </div>
  </div>`;

  const spotCard = `<dl class="facts" style="margin-bottom:14px">` +
    fact(L('আন্তর্জাতিক স্পট দর', 'अंतरराष्ट्रीय स्पॉट भाव', 'International spot price'),
      L(`সোনা $${nf.format(spotG)} · রুপো $${nf2.format(spotS)} (প্রতি ট্রয় আউন্স)`, `सोना $${nf.format(spotG)} · चाँदी $${nf2.format(spotS)} (प्रति ट्रॉय औंस)`, `Gold $${nf.format(spotG)} · Silver $${nf2.format(spotS)} (per troy oz)`),
      L(`${dtLbl}-এর আন্তর্জাতিক স্পট দর${hasLiveGold ? ' (লাইভ API)' : ''}`, `${dtLbl} का अंतरराष्ट्रीय स्पॉट भाव${hasLiveGold ? ' (लाइव API)' : ''}`, `Spot price on ${dtLbl}${hasLiveGold ? ' (Live API)' : ''}`)) + `</dl>`;

  return `<h3 class="sub">${L('সোনা ও রুপোর দাম', 'सोने और चाँदी के दाम', 'Gold and silver prices')}</h3>` +
    kpiCards + spotCard +
    renderMetalSeries(goldHist, L('সাম্প্রতিক ২৪ ক্যারেট সোনা (১০ গ্রাম)', 'हालिया 24 कैरेट सोना (10 ग्राम)', 'Recent 24-carat gold (10 g)'), '#F59E0B', 'linear-gradient(90deg, #D97706, #F59E0B, #FDE047)', hasLiveGold) +
    renderMetalSeries(silvHist, L('সাম্প্রতিক রুপো (প্রতি কেজি)', 'हालिया चाँदी (प्रति किलो)', 'Recent silver (per kg)'), '#38BDF8', 'linear-gradient(90deg, #0284C7, #38BDF8, #CBD5E1)', hasLiveSilv) +
    `<p class="hint">${L(`সূত্র: ভারতীয় খুচরো বুলিয়ন বাজার দর (GoodReturns/Groww) ও আন্তর্জাতিক স্পট ফিড (${dtLbl} হালনাগাদ)। শহরভেদে দাম সামান্য আলাদা হয় এবং গয়নার ক্ষেত্রে মেকিং চার্জ ও ৩% GST যোগ হয়। এটি বিনিয়োগের পরামর্শ নয়।`, `स्रोत: भारतीय खुदरा बुलियन दरें (GoodReturns/Groww) व अंतरराष्ट्रीय स्पॉट फ़ीड (${dtLbl} अपडेट)। शहर के हिसाब से दाम थोड़े अलग होते हैं और गहनों पर मेकिंग चार्ज व 3% GST जुड़ता है। यह निवेश की सलाह नहीं है।`, `Source: Indian retail bullion rates (GoodReturns/Groww) & live international spot feeds (updated ${dtLbl}). Prices vary slightly by city; jewellery purchases add making charges and 3% GST. Not investment advice.`)}</p>`;

    `</div>`;
  const filterHtml = `<div class="idx-filters" role="group" aria-label="${L('সূচক বিভাগ', 'सूचकांक श्रेणी', 'Index category')}">` +
    Object.entries(CATS).map(([k, v]) => {
      const cnt = k === 'all' ? INDICES.length : INDICES.filter((i) => i.cat === k).length;
      return `<button type="button" class="idx-fbtn${idxCat === k ? ' active' : ''}" data-idx-cat="${k}" style="--fc:${v.c}">${v.ico} ${v.l[li()]} <span class="idx-fcnt">${nf.format(cnt)}</span></button>`;
    }).join('') + `</div>`;
  const list = idxCat === 'all' ? INDICES : INDICES.filter((i) => i.cat === idxCat);
  const items = list.map((i) => {
    const cInfo = CATS[i.cat] || CATS.human;
    const l = i.l[li()], s = i.s[li()], n = i.n[li()], p = i.p ? i.p[li()] : '';
    const rankStr = i.badge ? i.badge : ord(i.rank);
    const trendHtml = i.delta > 0
      ? `<span class="idx-trend up">▲ +${nf.format(i.delta)}</span>`
      : i.delta < 0
        ? `<span class="idx-trend down">▼ ${nf.format(i.delta)}</span>`
        : `<span class="idx-trend flat">• ${L('অপরিবর্তিত', 'स्थिर', 'Unchanged')}</span>`;
    const scoreHtml = i.score ? `<span class="idx-score-pill">${L('স্কোর', 'स्कोर', 'Score')}: ${dg(i.score)}</span>` : '';
    let track = '';
    if (i.tot) {
      const posPct = i.inv ? (100 - ((i.rank - 1) / (i.tot - 1)) * 100) : ((i.rank - 1) / (i.tot - 1)) * 100;
      const leftLbl = i.inv ? L('কম প্রভাবিত', 'कम प्रभावित', 'Low impact') : ord(1);
      const rightLbl = i.inv ? L('সর্বাধিক প্রভাবিত (১ম)', 'सर्वाधिक प्रभावित (1st)', 'Most impacted (1st)') : ord(i.tot);
      track = `<div class="idx-track-pro" role="img" aria-label="${ofN(i.rank, i.tot)}"><span>${leftLbl}</span><b style="left:${Math.max(2, Math.min(98, posPct)).toFixed(1)}%"></b><span>${rightLbl}</span></div>`;
    }
    const peerHtml = p ? `<div class="idx-peers"><strong>🌍 ${L('তুলনা:', 'तुलना:', 'Benchmark:')}</strong> <span>${p}</span></div>` : '';

  }).join('');
  return kpiHtml + filterHtml + `<ul class="idx">${items}</ul>`;
}

function cmpKeys() {

  const noData = () => L('তথ্য নেই', 'डेटा नहीं', 'No data');
  /* polarity: 'hi' = higher better, 'lo' = lower better, 'ne' = neutral */
  return {
    pop: [L('জনসংখ্যা', 'जनसंख्या', 'Population'), (x) => x.pop, (x) => big(x.pop), 'ne'],
    area: [L('আয়তন', 'क्षेत्रफल', 'Area'), (x) => x.area, (x) => nf.format(x.area) + ' ' + KM(), 'ne'],

  [L('শাসন ও প্রতিনিধিত্ব', 'शासन और प्रतिनिधित्व', 'Governance'), ['ls', 'vs', 'rsSeats'], '#7C3AED'],

function vsBlock() {
  const keys = cmpKeys();
  const states = cmpList.map((id) => byId[id]).filter(Boolean);
  const opt = (x, selId) => `<option value="${x.id}" ${x.id === selId ? 'selected' : ''}>${R(x).n}</option>`;
  const srt = (selId) => [...T].sort((p, q) => R(p).n.localeCompare(R(q).n, LOC[lang])).map((x) => opt(x, selId)).join('');
  const noData = L('তথ্য নেই', 'डेटा नहीं', 'No data');

  const presets = [
    ['wb,mh', L('পশ্চিমবঙ্গ vs মহারাষ্ট্র', 'प. बंगाल vs महाराष्ट्र', 'WB vs Maharashtra')],
    ['kl,tn', L('কেরল vs তামিলনাডু', 'केरल vs तमिलनाडु', 'Kerala vs Tamil Nadu')],
    ['up,br', L('উত্তর প্রদেশ vs বিহার', 'उ.प्र. vs बिहार', 'UP vs Bihar')],
    ['gj,ka', L('গুজরাত vs কর্ণাটক', 'गुजरात vs कर्नाटक', 'Gujarat vs Karnataka')],
    ['mh,tn,gj,ka', L('শীর্ষ ৪ অর্থনীতি', 'शीर्ष 4 अर्थव्यवस्था', 'Top 4 Economies')]
  ];
  const presetHtml = `<div class="cmp-presets"><span class="cmp-presets-lbl">⚡ ${L('দ্রুত তুলনা:', 'त्वरित तुलना:', 'Quick compare:')}</span>` +
    presets.map(([ids, lbl]) => `<button type="button" class="cmp-preset-btn" data-cmp-preset="${ids}">${lbl}</button>`).join('') + `</div>`;

  const pickers = cmpList.map((id, i) => `<div class="vspick-item" style="--col:${CMP_COLORS[i % CMP_COLORS.length]}">` +
    `<select data-cmp-sel="${i}" aria-label="${L('রাজ্য', 'राज्य', 'State')} ${nf.format(i + 1)}">${srt(id)}</select>` +
    (cmpList.length > 2 ? `<button type="button" class="vsrm" data-cmp-remove="${i}" aria-label="${L('সরান', 'हटाएँ', 'Remove')}">✕</button>` : '') +
    `</div>`).join('');
  const addBtn = cmpList.length < CMP_MAX ? `<button type="button" class="vsadd" data-cmp-add>+ ${L('রাজ্য যোগ করুন', 'राज्य जोड़ें', 'Add state')}</button>` : '';

  // Compute Head-to-Head Lead Counts across all scored (hi/lo) metrics
  const winCounts = states.map(() => 0);
  let totalScored = 0;
  Object.values(keys).forEach(([, get, , pol]) => {
    if (pol !== 'hi' && pol !== 'lo') return;
    const vals = states.map((x) => get(x));
    const num = vals.filter((v) => v != null);
    if (num.length < 2) return;
    const best = pol === 'lo' ? Math.min(...num) : Math.max(...num);
    const winners = vals.map((v, idx) => (v === best ? idx : -1)).filter((idx) => idx >= 0);
    if (winners.length < states.length) {
      totalScored++;
      winners.forEach((idx) => winCounts[idx]++);
    }
  });
  const topWins = Math.max(...winCounts);
  const scoreboardHtml = `<div class="cmp-scoreboard">` + states.map((x, i) => {
    const col = CMP_COLORS[i % CMP_COLORS.length];
    const crown = winCounts[i] === topWins && topWins > 0 ? '🏆' : '';
    return `<div class="cmp-sc-card" style="--col:${col}"><div class="cmp-sc-name"><span>${R(x).sh || R(x).n}</span><span>${crown}</span></div><div class="cmp-sc-wins">${nf.format(winCounts[i])}/${nf.format(totalScored)}</div><div class="cmp-sc-sub">${L('সূচকে এগিয়ে', 'सूचकांकों में आगे', 'metrics led')}</div></div>`;
  }).join('') + `</div>`;

  const rowHtml = (k) => {
    const [label, get, show, pol] = keys[k];
    const vals = states.map((x) => get(x));
    const numeric = vals.filter((v) => v != null);
    const best = numeric.length > 1 ? (pol === 'lo' ? Math.min(...numeric) : Math.max(...numeric)) : null;
    const cells = states.map((x, i) => {
      const v = vals[i];
      const s = v != null ? show(x) : noData;
      const isWin = v != null && best != null && v === best && pol !== 'ne';
      const col = CMP_COLORS[i % CMP_COLORS.length];
      const cls = isWin ? (pol === 'lo' ? ' class="vswin vswin-lo"' : ` class="vswin" style="--col:${col}"`) : '';
      return `<td${cls}>${isWin ? '★ ' : ''}${s}</td>`;
    }).join('');
    const arrow = pol === 'hi' ? ' <span class="vsarrow vsarrow-hi" title="' + L('বেশি ভালো', 'ज़्यादा बेहतर', 'higher is better') + '">▲</span>'
      : pol === 'lo' ? ' <span class="vsarrow vsarrow-lo" title="' + L('কম ভালো', 'कम बेहतर', 'lower is better') + '">▼</span>' : '';
    return `<tr><td>${label}${arrow}</td>${cells}</tr>`;
  };
  const groupsHtml = CMP_GROUPS().map(([glabel, gkeys, gcol]) =>
    `<tbody class="vsgroup"><tr class="vsghead" style="--gc:${gcol}"><th class="vsg-sticky">${glabel}</th><th class="vsg-fill" colspan="${states.length}"></th></tr>${gkeys.map(rowHtml).join('')}</tbody>`
  ).join('');
  const thead = `<tr><th>${L('সূচক', 'सूचकांक', 'Metric')}</th>${states.map((x, i) => `<th class="vs-col-head" style="--col:${CMP_COLORS[i % CMP_COLORS.length]}"><button type="button" class="vsstatelink" data-go="${x.id}">${R(x).n}</button></th>`).join('')}</tr>`;
  return `<h3 class="sub">⚔️ ${L('কয়েকটি রাজ্য পাশাপাশি তুলনা', 'कई राज्यों की आमने-सामने तुलना', 'Compare several states side by side')}</h3>` +
    presetHtml +
    `<div class="vspick">${pickers}${addBtn}</div>` +
    scoreboardHtml +
    `<div class="vstable-wrap"><table class="vstable" data-cols="${states.length}"><thead>${thead}</thead>${groupsHtml}</table></div>` +
    `<p class="hint">${L('★ ও রঙিন ঘরে সেরা ফলাফল দেখানো হয়েছে — ▲ মানে বেশি ভালো, ▼ মানে কম ভালো। রাজ্যের নামে ক্লিক করলে সেই রাজ্যের বিস্তারিত পাতা খুলবে।', '★ और रंगीन खाने में बेहतर नतीजा दिखाया गया है — ▲ मतलब ज़्यादा बेहतर, ▼ मतलब कम बेहतर। राज्य के नाम पर क्लिक करके विस्तृत पेज खोलें।', '★ highlights the leading state in each row — ▲ higher is better, ▼ lower is better. Click any state name to open its full page.')}</p>`;
}

}

    fact(L('তুলনামূলক নিরাপদ শহর (NARI)', 'तुलनात्मक रूप से सुरक्षित शहर (NARI)', 'Relatively safer cities (NARI)'), L('কোহিমা, বিশাখাপত্তনম, ভুবনেশ্বর, আইজল, গ্যাংটক, ইটানগর, মুম্বই', 'कोहिमा, विशाखापत्तनम, भुवनेश्वर, आइज़ोल, गंगटोक, ईटानगर, मुंबई', 'Kohima, Visakhapatnam, Bhubaneswar, Aizawl, Gangtok, Itanagar, Mumbai')),

function stSaf(x) {
  const rows = [];

  if (a != null) {
    const pl = Object.entries(CAW18).sort((p, q) => q[1] - p[1]);
    const r = rankOf(pl, x.id);
    rows.push(fact(L('২০১৮ (প্রতি লক্ষ জনসংখ্যায়)', '2018 (प्रति लाख जनसंख्या पर)', '2018 (per lakh population)'), pfx(a), L(`${nf.format(pl.length)}টির মধ্যে ${ord(r)} সর্বোচ্চ (১ম = সর্বোচ্চ হার)। NCRB ২০১৮, উইকিপিডিয়ার সারণি`, `${nf.format(pl.length)} में ${ord(r)} सर्वोच्च (पहला = सबसे ऊँची दर)। NCRB 2018, विकिपीडिया की सारणी`, `${ord(r)} highest of ${nf.format(pl.length)} (1st = highest rate). NCRB 2018, Wikipedia table`)));
  }
  if (!rows.length) return `<p class="hint">${L(`${R(x).n}-এর নারীর বিরুদ্ধে অপরাধের আলাদা হার আমি পাইনি।`, `${R(x).n} के लिए महिलाओं के विरुद्ध अपराध की अलग दर मुझे नहीं मिली।`, `I did not find a separate crime-against-women rate for ${R(x).n}.`)}${x.id === 'la' ? L(' ২০১৮ সালে লাদাখ আলাদা অঞ্চল ছিল না।', ' 2018 में लद्दाख अलग क्षेत्र नहीं था।', ' Ladakh was not a separate territory in 2018.') : ''}${x.id === 'dd' ? L(' ২০১৮ সালে দাদরা-নগর হাভেলি ১৭.৩ ও দমন-দিউ ১২.৩ ছিল, তখন দুটি আলাদা অঞ্চল।', ' 2018 में दादरा-नगर हवेली 17.3 और दमन-दीव 12.3 थे, तब दो अलग क्षेत्र।', ' In 2018 Dadra & Nagar Haveli (17.3) and Daman & Diu (12.3) were two separate territories.') : ''}</p>`;
  const max = Math.max(...Object.values(CAW18));
  return facts(rows) + (a != null ? `<div class="cbl cbl-colored" style="--cc:#F43F5E"><div class="cbl-h"><span>${L('২০১৮ হার, সর্বোচ্চের (অসম) তুলনায়', '2018 की दर, सर्वोच्च (असम) की तुलना में', '2018 rate, relative to the highest (Assam)')}</span><b>${nf.format(Math.round(a / max * 100))}%</b></div>${bar(a / max * 100, 'rate')}</div>` : '') +
    (x.id === 'jk' ? `<p class="hint">${L('২০১৮ সালের সংখ্যা লাদাখ-সহ অবিভক্ত জম্মু ও কাশ্মীরের।', '2018 के आँकड़े लद्दाख सहित अविभाजित जम्मू और कश्मीर के हैं।', 'The 2018 figure is for undivided Jammu & Kashmir, including Ladakh.')}</p>` : '') +
    `<p class="hint">${L('এই হার শুধু নথিভুক্ত অভিযোগ গণনা করে। বেশি হার মানেই বেশি অপরাধ নয়, অভিযোগ করার সুযোগ ও থানার নথিভুক্তির ধরনও এতে প্রভাব ফেলে। ২০১৮ ও ২০২৩-এর সংখ্যা সরাসরি তুলনীয় নয়, কারণ হিসাবের ভিত্তি (জনসংখ্যা বনাম নারী) ও আইন (IPC বনাম BNS) আলাদা।', 'यह दर केवल दर्ज शिकायतों को गिनती है। ज़्यादा दर का मतलब ज़्यादा अपराध ही नहीं है; शिकायत करने की सुविधा और थानों के दर्ज करने के तरीक़े का भी असर पड़ता है। 2018 और 2023 के आँकड़े सीधे तुलनीय नहीं हैं, क्योंकि गणना का आधार (जनसंख्या बनाम महिलाएँ) और क़ानून (IPC बनाम BNS) अलग हैं।', 'This rate counts only registered complaints. A higher rate does not simply mean more crime; how easy it is to complain and how police record cases also matter. The 2018 and 2023 figures are not directly comparable, because the base (population vs women) and the law (IPC vs BNS) differ.')}</p>`;
}

function partyColor(p) {
  const s = String(p || '').toUpperCase();
  if (s.includes('BJP') || s.includes('NDA') || s.includes('MAHAYUTI')) return '#F97316';
  if (s.includes('INC') || s.includes('UDF') || s.includes('INDIA') || s.includes('MVA') || s.includes('ASM')) return '#3B82F6';
  if (s.includes('AITC') || s.includes('TMC')) return '#10B981';
  if (s.includes('TVK')) return '#F43F5E';
  if (s.includes('DMK') || s.includes('SPA')) return '#EF4444';
  if (s.includes('AIADMK')) return '#22C55E';
  if (s.includes('AAP')) return '#06B6D4';
  if (s.includes('SP') && !s.includes('BSP') && !s.includes('NCP') && !s.includes('JSP') && !s.includes('ASP')) return '#E11D48';
  if (s.includes('TDP')) return '#EAB308';
  if (s.includes('YSRCP')) return '#0EA5E9';
  if (s.includes('JD(U)')) return '#84CC16';
  if (s.includes('RJD') || s.includes('MGB')) return '#16A34A';
  if (s.includes('BJD')) return '#14B8A6';
  if (s.includes('BRS')) return '#EC4899';
  if (s.includes('JMM')) return '#0D9488';
  if (s.includes('CPI') || s.includes('LDF') || s.includes('LEFT')) return '#DC2626';
  if (s.includes('SHS')) return '#EA580C';
  if (s.includes('NCP')) return '#6366F1';
  if (s.includes('BSP')) return '#2563EB';
  if (s.includes('JKNC')) return '#E11D48';
  if (s.includes('SKM') || s.includes('ZPM') || s.includes('NPP') || s.includes('NDPP') || s.includes('AINRC') || s.includes('TMP')) return '#A855F7';
  if (s.includes('SAD') || s.includes('MNF') || s.includes('INLD') || s.includes('JSP') || s.includes('LJP')) return '#D97706';
  if (s.includes('AIMIM') || s.includes('IUML') || s.includes('AIUDF')) return '#059669';
  return '#64748B';
}

let activeRosterKind = null;
let activeRosterParty = 'ALL';

window.toggleRoster = function(kind) {
  if (activeRosterKind === kind) {
    activeRosterKind = null;
  } else {
    activeRosterKind = kind;
    activeRosterParty = 'ALL';
  }
  render();
};

window.setRosterParty = function(p) {
  activeRosterParty = p;
  render();
};

function renderRosterBox(sid, x) {
  if (!activeRosterKind) return '';
  const rd = VERIFIED_ROSTER[sid] || { mp: [], mla: [] };
  const ed = ELECTORAL_DATA[sid];
  const isMp = activeRosterKind === 'mp';
  const list = isMp ? (rd.mp || []) : (rd.mla || []);
  const totalSeats = isMp ? x.ls : x.vs;
  const partyStats = ed ? (isMp ? ed.mp : ed.mla) : [];
  const title = isMp
    ? L(`লোকসভা সদস্য (MP) — মোট ${nf.format(totalSeats)} আসন`, `लोकसभा सदस्य (MP) — कुल ${nf.format(totalSeats)} सीटें`, `Lok Sabha Members (MPs) — ${totalSeats} Seats`)
    : L(`বিধানসভা সদস্য (MLA) — মোট ${nf.format(totalSeats)} আসন`, `विधानसभा सदस्य (MLA) — कुल ${nf.format(totalSeats)} सीटें`, `Assembly Members (MLAs) — ${totalSeats} Seats`);

  const summaryBar = partyStats && partyStats.length
    ? `<div class="stack-bar-wrap"><div class="stack-bar">${
        partyStats.map((m) => `<div class="stack-seg" style="width:${Math.max(2, (m.s / Math.max(1, totalSeats)) * 100)}%;background:${partyColor(m.p)}" title="${m.p}: ${m.s}"></div>`).join('')
      }</div><div class="stack-legend">${
        partyStats.map((m) => `<span class="stack-leg-item"><i class="stack-dot" style="background:${partyColor(m.p)}"></i>${m.p} (${nf.format(m.s)})</span>`).join('')
      }</div></div>`
    : '';

  const parties = ['ALL', ...Array.from(new Set(list.map((i) => i[2])))];
  const filterHtml = list.length > 1
    ? `<div class="roster-filters">${
        parties.map((p) => `<button type="button" class="roster-fbtn${activeRosterParty === p ? ' active' : ''}" onclick="setRosterParty('${p.replace(/'/g, "\\'")}')">${p === 'ALL' ? L('সব পার্টি', 'सभी दल', 'All Parties') : p}</button>`).join('')
      }</div>`
    : '';

  const filtered = activeRosterParty === 'ALL' ? list : list.filter((i) => i[2] === activeRosterParty);
  const cardsHtml = filtered.length
    ? `<div class="roster-list">${
        filtered.map(([constituency, member, party]) => {
          const col = partyColor(party);
          return `<div class="roster-item" style="--pc:${col}"><span class="roster-mname">${member}</span><span class="roster-meta">${L('আসন: ', 'सीट: ', 'Seat: ')}${constituency}</span><span class="roster-party">${party}</span></div>`;
        }).join('')
      }</div>`
    : '';

  const isPartial = filtered.length < totalSeats && activeRosterParty === 'ALL';
  const noteHtml = isPartial
    ? `<p class="hint">${L(`এখানে যাচাইকৃত ${nf.format(list.length)} জন প্রধান জনপ্রতিনিধির নাম দেখানো হলো। বাকি আসনসহ সম্পূর্ণ তালিকা দেখতে সরকারি নির্বাচন কমিশন / সংসদ পোর্টাল দেখুন।`, `यहाँ सत्यापित ${nf.format(list.length)} प्रमुख जनप्रतिनिधियों के नाम दिखाए गए हैं। शेष सीटों सहित पूरी सूची के लिए आधिकारिक ECI / संसद पोर्टल देखें।`, `Showing ${list.length} verified key representatives out of ${totalSeats} seats (no placeholder names). For the full constituency-by-constituency directory, visit the official ECI / Sansad portal.`)}</p>`
    : '';

  const extUrl = isMp ? 'https://sansad.in/ls/members' : 'https://results.eci.gov.in/';
  const extLabel = isMp
    ? L('সংসদ পোর্টালে সম্পূর্ণ ১৮তম লোকসভা তালিকা দেখুন ↗', 'संसद पोर्टल पर पूरी 18वीं लोकसभा सूची देखें ↗', 'View full 18th Lok Sabha directory on Sansad.in ↗')
    : L('নির্বাচন কমিশনের (ECI) সরকারি ফলাফল পোর্টালে দেখুন ↗', 'निर्वाचन आयोग (ECI) के आधिकारिक पोर्टल पर देखें ↗', 'View full official Assembly results on ECI ↗');

  return `<div class="roster-box" id="rosterBox"><div class="roster-head"><h4>${title}</h4><button type="button" class="roster-close" onclick="toggleRoster(null)">${L('বন্ধ করুন ✕', 'बंद करें ✕', 'Close ✕')}</button></div>${summaryBar}${filterHtml}${cardsHtml}${noteHtml}<a class="roster-ext" href="${extUrl}" target="_blank" rel="noopener">${extLabel}</a></div>`;
}

const rankOf = (arr, id) => { const i = arr.findIndex((r) => r[0] === id); return i < 0 ? 0 : i + 1; };
function stEco(x) {
  const e = ECO[x.id], nm = R(x).n;

  const rows = [];

    const val = e.g >= 1000 ? nf2.format(e.g / 1000) + L(' লক্ষ কোটি টাকা', ' लाख करोड़ रुपये', ' lakh crore rupees') : nf.format(e.g * 100) + L(' কোটি টাকা', ' करोड़ रुपये', ' crore rupees');
    rows.push(fact(L(`GSDP (চলতি দামে, ${e.gy})`, `GSDP (मौजूदा क़ीमतों पर, ${dg(e.gy)})`, `GSDP (current prices, ${dg(e.gy)})`), val, r ? L(`${nf.format(list.length)}টি রাজ্য/অঞ্চলের মধ্যে ${ord(r)}`, `${nf.format(list.length)} राज्यों/क्षेत्रों में ${ord(r)}`, `${ord(r)} of ${nf.format(list.length)} states/territories`) : L('২০২৪-২৫-এর তথ্য এখনও পাওয়া যায়নি, তাই ক্রম দেওয়া হলো না', '2024-25 के आँकड़े अभी उपलब्ध नहीं हैं, इसलिए क्रम नहीं दिया गया', '2024-25 figures are not yet available, so no rank is given')));
  }
  const pl = Object.entries(ECO).filter(([, v]) => v.p24).sort((a, b) => b[1].p24 - a[1].p24);
  const top = pl[0];

  if (e.p25) rows.push(fact(L('মাথাপিছু GSDP (২০২৫-২৬)', 'प्रति व्यक्ति GSDP (2025-26)', 'GSDP per capita (2025-26)'), '₹' + nf.format(e.p25), L(`দেশের গড় ₹${nf.format(NAT_PC[1])}`, `देश का औसत ₹${nf.format(NAT_PC[1])}`, `National average ₹${nf.format(NAT_PC[1])}`)));
  const pct = (e.p24 / top[1].p24) * 100, tn = R(byId[top[0]]).n;
  return facts(rows) +
    `<div class="cbl cbl-colored" style="--cc:#10B981"><div class="cbl-h"><span>${L(`মাথাপিছু আয়, সর্বোচ্চের (${tn}) তুলনায়`, `प्रति व्यक्ति आय, सर्वोच्च (${tn}) की तुलना में`, `Per-capita income, relative to the highest (${tn})`)}</span><b>${nf.format(Math.round(pct))}%</b></div>${bar(pct, 'per capita')}</div>` +
    `<p class="hint">${L('সূত্র: রাজ্য সরকার ও MoSPI-র অনুমান (উইকিপিডিয়ায় সংকলিত, ২০২৬ সালের অক্টোবরে দেখা)। GSDP মানে রাজ্যের মোট অভ্যন্তরীণ উৎপাদন।', 'स्रोत: राज्य सरकारों और MoSPI के अनुमान (विकिपीडिया में संकलित, अक्टूबर 2026 में देखे गए)। GSDP यानी राज्य का सकल घरेलू उत्पाद।', 'Source: state government and MoSPI estimates (compiled on Wikipedia, checked in October 2026). GSDP means Gross State Domestic Product.')} ${e.gy === '২০২৩-২৪' ? L('এই অঞ্চলের ২০২৪-২৫-এর GSDP-র হিসাব তালিকায় ফাঁকা ছিল।', 'इस क्षेत्र का 2024-25 का GSDP सूची में ख़ाली था।', 'The 2024-25 GSDP for this region was blank in the table.') : ''}</p>`;
}
function stEdu(x) {

  if (l[0] != null) rows.push(fact(L('সাক্ষরতা, আদমশুমারি ২০১১', 'साक्षरता, जनगणना 2011', 'Literacy, Census 2011'), pf(l[0]), `${M} ${pf(l[1])} · ${W} ${pf(l[2])}`));
  const pl = Object.entries(LIT).filter(([, v]) => v[3] != null).sort((a, b) => b[1][3] - a[1][3]);
  rows.push(fact(L('সাক্ষরতা, PLFS ২০২৪', 'साक्षरता, PLFS 2024', 'Literacy, PLFS 2024'), pf(l[3]), `${M} ${pf(l[4])} · ${W} ${pf(l[5])}${L('। ', '। ', '. ')}${ofN(rankOf(pl, x.id), pl.length)}`));
  rows.push(fact(L('সারা দেশে (PLFS ২০২৪)', 'पूरे देश में (PLFS 2024)', 'All India (PLFS 2024)'), pf(NAT_LIT[3]), `${M} ${pf(NAT_LIT[4])} · ${W} ${pf(NAT_LIT[5])}`));
  const gap = l[4] - l[5];
  return facts(rows) +
    `<div class="cbl cbl-colored" style="--cc:#0EA5E9"><div class="cbl-h"><span>${L('পুরুষ সাক্ষরতা', 'पुरुष साक्षरता', 'Male literacy')}</span><b>${pf(l[4])}</b></div>${bar(l[4], 'male')}</div>` +
    `<div class="cbl cbl-colored" style="--cc:#EC4899"><div class="cbl-h"><span>${L('নারী সাক্ষরতা', 'महिला साक्षरता', 'Female literacy')}</span><b>${pf(l[5])}</b></div>${bar(l[5], 'female')}<small>${L(`পুরুষ ও নারীর ব্যবধান ${nf1.format(gap)} শতাংশ-বিন্দু`, `पुरुष और महिला का अंतर ${nf1.format(gap)} प्रतिशत अंक`, `Gap between men and women: ${nf1.format(gap)} percentage points`)}</small></div>` +
    (LIT_NOTE[x.id] ? `<p class="hint">${L(...LIT_NOTE[x.id])}</p>` : '') +
    `<p class="hint">${L('সাক্ষরতার হার ৭ বছর বা তার বেশি বয়সীদের। সূত্র: আদমশুমারি ২০১১ এবং NSO-র PLFS বার্ষিক প্রতিবেদন (জুলাই ২০২৩ থেকে জুন ২০২৪)।', 'साक्षरता दर 7 वर्ष या अधिक आयु वालों की है। स्रोत: जनगणना 2011 और NSO की PLFS वार्षिक रिपोर्ट (जुलाई 2023 से जून 2024)।', 'Literacy rates are for people aged 7 and above. Source: Census 2011 and the NSO PLFS annual report (July 2023 to June 2024).')}</p>`;

function stCul(x) {
  const c = CUL[x.id];
  if (!c) return '';
  return facts([
    fact(L('বিখ্যাত খাবার', 'प्रसिद्ध भोजन', 'Famous food'), L(...c.food)),
    fact(L('প্রধান উৎসব', 'प्रमुख त्योहार', 'Major festival'), L(...c.fest), L(...c.when)),
    fact(L('বিখ্যাত ব্যক্তিত্ব', 'प्रसिद्ध व्यक्तित्व', 'Famous personality'), L(...c.person)),
    ...(GI_UNESCO[x.id] && GI_UNESCO[x.id].gi ? [fact(L('ভৌগোলিক নির্দেশক পণ্য (GI Tag)', 'भौगोलिक संकेतक उत्पाद (GI Tag)', 'Geographical Indication (GI Tags)'), L(...GI_UNESCO[x.id].gi))] : [])
  ]) + `<p class="hint">${L('স্থানীয় খাবার, প্রধান উৎসব, বিখ্যাত ব্যক্তিত্ব এবং সরকারিভাবে স্বীকৃত GI ট্যাগ পণ্যের উদাহরণ দেওয়া হয়েছে।', 'स्थानीय भोजन, प्रमुख त्योहार, प्रसिद्ध व्यक्तित्व और आधिकारिक GI टैग उत्पादों के उदाहरण दिए गए हैं।', 'Examples of local cuisine, major festivals, notable figures and officially registered GI-tagged products.')}</p>`;
}

function rankMetric(x, getter, asc = false) {
  const vals = T.filter((y) => y.t === x.t && getter(y) != null).sort((a, b) => asc ? getter(a) - getter(b) : getter(b) - getter(a));
  const idx = vals.findIndex((y) => y.id === x.id);
  return idx >= 0 ? [idx + 1, vals.length] : null;
}

  const ext = (z) => EXT[z.id] || {};
  const si = (z) => ST_IDX[z.id] || {};
  const dash = '—';
  const metrics = [
    [L('জনসংখ্যা (২০১১)', 'जनसंख्या (2011)', 'Population (2011)'), (z) => z.pop, (z) => big(z.pop), 'ne'],
